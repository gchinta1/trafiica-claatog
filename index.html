<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}

/* =========================================================
   STAGE
========================================================= */

#stage {
    width: 100%;
    height: calc(100% - 54px);

    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ddd;
    font-size: 14px;
}

/* =========================================================
   CLOSED BOOK

   FRONT/BACK are NOT controlled by PageFlip.
   This is a real single-page container.
========================================================= */

#closedView {
    display: none;

    position: relative;
    overflow: hidden;

    background: #fff;

    box-shadow:
        0 16px 45px rgba(0,0,0,.48),
        0 0 0 1px rgba(0,0,0,.16);

    cursor: pointer;

    transform-origin: center center;
}

#closedImage {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #fff;

    user-select: none;
    -webkit-user-drag: none;
}

#closedView.front,
#closedView.back {
    animation: coverAppear .25s ease both;
}

@keyframes coverAppear {

    from {
        opacity: .65;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================================
   OPEN BOOK
========================================================= */

#openView {
    display: none;

    position: relative;

    overflow: hidden;

    filter:
        drop-shadow(
            0 16px 32px rgba(0,0,0,.40)
        );
}

/* =========================================================
   PAGEFLIP

   IMPORTANT:
   DO NOT put object-fit or width/height rules on PageFlip's
   generated images.
========================================================= */

#book {
    visibility: hidden;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    width: 100%;
    height: 54px;

    background: #101010;

    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}

/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 46px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;

    cursor: pointer;

    transition:
        background .15s ease,
        opacity .15s ease;
}

button:hover:not(:disabled) {
    background: #3a3a3a;
}

button:active:not(:disabled) {
    background: #202020;
}

button:disabled {
    opacity: .25;
    cursor: default;
}

/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 240px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

@media (max-width: 700px) {

    #count {
        min-width: 150px;
    }

    button {
        width: 40px;
    }
}

</style>

</head>

<body>

<!-- =======================================================
     MAIN STAGE
======================================================== -->

<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <!-- ===================================================
         TRUE SINGLE-PAGE CLOSED BOOK
    ==================================================== -->

    <div
        id="closedView"
        aria-label="Closed catalogue"
    >
        <img
            id="closedImage"
            alt="Catalogue cover"
        >
    </div>

    <!-- ===================================================
         OPEN TWO-PAGE BOOK
    ==================================================== -->

    <div id="openView">
        <div id="book"></div>
    </div>

</div>

<!-- =======================================================
     CONTROLS
======================================================== -->

<footer>

    <button
        id="prev"
        aria-label="Previous"
    >
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button
        id="next"
        aria-label="Next"
    >
        ›
    </button>

</footer>

<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const loading =
    document.getElementById("loading");

const closedView =
    document.getElementById("closedView");

const closedImage =
    document.getElementById("closedImage");

const openView =
    document.getElementById("openView");

const book =
    document.getElementById("book");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const count =
    document.getElementById("count");


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

let pdfImages = [];

let interiorImages = [];

let totalPdfPages = 0;

let pageWidth = 0;

let pageHeight = 0;

let pdfRatio = 0;

let renderedWidth = 0;

let renderedHeight = 0;

/*
    MODES:

    front = closed front cover
    open  = normal two-page book
    back  = closed back cover
*/

let mode = "front";


/* =========================================================
   CREATE WHITE PAGE
========================================================= */

function createWhitePage(width, height) {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        width;

    canvas.height =
        height;

    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );

    context.fillStyle =
        "#ffffff";

    context.fillRect(
        0,
        0,
        width,
        height
    );

    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );
}


/* =========================================================
   CALCULATE PAGE SIZE

   The dimensions here are the dimensions of ONE PDF page.

   OPEN BOOK WIDTH = pageWidth × 2
========================================================= */

function calculateBookSize() {

    const availableHeight =
        stage.clientHeight * 0.90;

    const availableWidth =
        stage.clientWidth * 0.92;

    /*
        Fit TWO full pages on screen.

        PDF ratio:
        width / height
    */

    pageHeight =
        Math.min(
            availableHeight,
            availableWidth / (2 * pdfRatio)
        );

    pageWidth =
        pageHeight * pdfRatio;

    pageHeight =
        Math.floor(pageHeight);

    pageWidth =
        Math.floor(pageWidth);


    /* =====================================================
       CLOSED = ONE PAGE
    ===================================================== */

    closedView.style.width =
        pageWidth + "px";

    closedView.style.height =
        pageHeight + "px";


    /* =====================================================
       OPEN = TWO PAGES
    ===================================================== */

    openView.style.width =
        (pageWidth * 2) + "px";

    openView.style.height =
        pageHeight + "px";
}


/* =========================================================
   LOAD PDF
========================================================= */

async function start() {

    const pdf =
        await pdfjsLib
            .getDocument("catalogue.pdf")
            .promise;

    totalPdfPages =
        pdf.numPages;


    /* =====================================================
       RENDER ALL PDF PAGES
    ===================================================== */

    for (
        let pageNumber = 1;
        pageNumber <= totalPdfPages;
        pageNumber++
    ) {

        const page =
            await pdf.getPage(pageNumber);

        /*
            Render at good quality.

            This affects image resolution,
            NOT display zoom.
        */

        const viewport =
            page.getViewport({
                scale: 2
            });

        /*
            Get REAL PDF page ratio.
        */

        if (pdfRatio === 0) {

            pdfRatio =
                viewport.width /
                viewport.height;
        }

        const canvas =
            document.createElement("canvas");

        canvas.width =
            Math.round(viewport.width);

        canvas.height =
            Math.round(viewport.height);

        renderedWidth =
            canvas.width;

        renderedHeight =
            canvas.height;

        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );

        context.fillStyle =
            "#ffffff";

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;

        pdfImages.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );
    }


    /* =====================================================
       SIZE THE BOOK
    ===================================================== */

    calculateBookSize();


    /* =====================================================
       INTERIOR PAGES

       PDF PAGE 1 is NOT given to PageFlip.

       PageFlip gets:

       PDF 2
       PDF 3
       PDF 4
       ...
       PDF 13
    ===================================================== */

    interiorImages =
        pdfImages.slice(1);


    /*
        Generic protection if another PDF
        contains an odd number of interior pages.
    */

    if (
        interiorImages.length % 2 !== 0
    ) {

        interiorImages.push(

            createWhitePage(
                renderedWidth,
                renderedHeight
            )

        );
    }


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                /*
                    Size of ONE page.
                */

                width:
                    pageWidth,

                height:
                    pageHeight,


                /*
                    IMPORTANT:

                    FIXED means PageFlip must use exactly
                    the dimensions we calculated.
                */

                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,


                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /*
                    NO PageFlip cover.

                    We handle the closed covers ourselves.
                */

                showCover:
                    false,


                /*
                    Two-page desktop book.
                */

                usePortrait:
                    false,


                /*
                    VERY IMPORTANT.

                    DO NOT let PageFlip resize the book again.
                */

                autoSize:
                    false,


                drawShadow:
                    true,


                maxShadowOpacity:
                    0.35,


                flippingTime:
                    850,


                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                showPageCorners:
                    true,


                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD INTERIOR PAGE IMAGES
    ===================================================== */

    flip.loadFromImages(
        interiorImages
    );


    /* =====================================================
       INITIALIZED
    ===================================================== */

    flip.on(
        "init",
        function () {

            book.style.visibility =
                "visible";
        }
    );


    /* =====================================================
       PAGE TURNED
    ===================================================== */

    flip.on(
        "flip",
        function () {

            if (
                mode !== "open"
            ) {
                return;
            }

            /*
                Wait until PageFlip has updated
                its current index.
            */

            requestAnimationFrame(
                updateCounterFromFlip
            );
        }
    );


    /* =====================================================
       READY
    ===================================================== */

    loading.style.display =
        "none";

    showFront();
}


/* =========================================================
   SHOW FRONT COVER
========================================================= */

function showFront() {

    mode =
        "front";

    /*
        Hide PageFlip.
    */

    openView.style.display =
        "none";


    /*
        Show genuine one-page cover.
    */

    closedView.style.display =
        "block";

    closedView.className =
        "front";


    /*
        REAL PDF PAGE 1.
    */

    closedImage.src =
        pdfImages[0];


    count.textContent =
        `Front Cover · Page 1 / ${totalPdfPages}`;


    prevButton.disabled =
        true;

    nextButton.disabled =
        false;
}


/* =========================================================
   SHOW OPEN BOOK
========================================================= */

function showOpenByIndex(index) {

    mode =
        "open";


    /*
        Hide closed cover.
    */

    closedView.style.display =
        "none";


    /*
        Show PageFlip.
    */

    openView.style.display =
        "block";


    /*
        Ensure index points to LEFT side
        of a spread.
    */

    if (
        index % 2 !== 0
    ) {

        index--;
    }


    index =
        Math.max(
            0,
            Math.min(
                index,
                interiorImages.length - 2
            )
        );


    /*
        Jump to requested spread.
    */

    flip.turnToPage(index);


    /*
        Update after PageFlip changes its state.
    */

    requestAnimationFrame(
        updateCounterFromFlip
    );


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;
}


/* =========================================================
   SHOW FIRST OPEN SPREAD

   PDF 2 + PDF 3
========================================================= */

function showFirstSpread() {

    showOpenByIndex(0);
}


/* =========================================================
   SHOW LAST OPEN SPREAD

   For your PDF:

   PDF 12 + PDF 13
========================================================= */

function showLastSpread() {

    const lastLeftIndex =
        interiorImages.length - 2;

    showOpenByIndex(
        lastLeftIndex
    );
}


/* =========================================================
   SHOW BACK COVER
========================================================= */

function showBack() {

    mode =
        "back";


    /*
        Hide PageFlip.
    */

    openView.style.display =
        "none";


    /*
        Show genuine one-page cover.
    */

    closedView.style.display =
        "block";

    closedView.className =
        "back";


    /*
        White back cover.

        This uses exactly the same PDF aspect ratio.
    */

    closedImage.src =
        createWhitePage(
            renderedWidth,
            renderedHeight
        );


    count.textContent =
        "Back Cover";


    prevButton.disabled =
        false;

    nextButton.disabled =
        true;
}


/* =========================================================
   GET LEFT INDEX OF CURRENT SPREAD
========================================================= */

function getCurrentLeftIndex() {

    let index =
        flip.getCurrentPageIndex();


    /*
        If PageFlip reports the right page,
        convert it to the left page.
    */

    if (
        index % 2 !== 0
    ) {

        index--;
    }


    return Math.max(
        0,
        index
    );
}


/* =========================================================
   COUNTER
========================================================= */

function updateCounterFromFlip() {

    if (
        mode !== "open"
    ) {
        return;
    }


    const index =
        getCurrentLeftIndex();


    /*
        PageFlip interior index 0
        corresponds to PDF page 2.
    */

    const leftPdf =
        index + 2;


    const rightPdf =
        leftPdf + 1;


    if (
        rightPdf <= totalPdfPages
    ) {

        count.textContent =
            `Pages ${leftPdf}–${rightPdf} / ${totalPdfPages}`;

    }

    else {

        count.textContent =
            `Page ${leftPdf} / ${totalPdfPages}`;
    }
}


/* =========================================================
   NEXT
========================================================= */

function next() {

    /* =====================================================
       FRONT -> PDF 2 + PDF 3
    ===================================================== */

    if (
        mode === "front"
    ) {

        showFirstSpread();

        return;
    }


    /* =====================================================
       ALREADY AT BACK
    ===================================================== */

    if (
        mode === "back"
    ) {

        return;
    }


    /* =====================================================
       CURRENT OPEN SPREAD
    ===================================================== */

    const currentLeft =
        getCurrentLeftIndex();


    const lastLeft =
        interiorImages.length - 2;


    /*
        LAST SPREAD?

        PDF 12 + PDF 13
        ->
        close to back cover
    */

    if (
        currentLeft >= lastLeft
    ) {

        showBack();

        return;
    }


    /*
        Normal PageFlip animation.
    */

    flip.flipNext(
        "bottom"
    );
}


/* =========================================================
   PREVIOUS
========================================================= */

function previous() {

    /* =====================================================
       FRONT
    ===================================================== */

    if (
        mode === "front"
    ) {

        return;
    }


    /* =====================================================
       BACK -> LAST SPREAD
    ===================================================== */

    if (
        mode === "back"
    ) {

        showLastSpread();

        return;
    }


    /* =====================================================
       CURRENT OPEN SPREAD
    ===================================================== */

    const currentLeft =
        getCurrentLeftIndex();


    /*
        FIRST SPREAD?

        PDF 2 + PDF 3
        ->
        close to front cover
    */

    if (
        currentLeft <= 0
    ) {

        showFront();

        return;
    }


    /*
        Normal PageFlip animation.
    */

    flip.flipPrev(
        "bottom"
    );
}


/* =========================================================
   BUTTONS
========================================================= */

nextButton.addEventListener(
    "click",
    next
);


prevButton.addEventListener(
    "click",
    previous
);


/* =========================================================
   CLICK CLOSED COVER
========================================================= */

closedView.addEventListener(
    "click",
    function () {

        /*
            FRONT:
            open book.
        */

        if (
            mode === "front"
        ) {

            next();

            return;
        }


        /*
            BACK:
            reopen last spread.
        */

        if (
            mode === "back"
        ) {

            previous();
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "ArrowRight"
        ) {

            next();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            previous();
        }
    }
);


/* =========================================================
   START
========================================================= */

start().catch(
    function (error) {

        console.error(error);

        loading.textContent =
            "Could not load catalogue.pdf";
    }
);

</script>

</body>
</html>
