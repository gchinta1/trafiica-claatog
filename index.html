<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}


/* =========================
   STAGE
========================= */

#stage {
    height: calc(100% - 54px);
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}


/* =========================
   BOOK
========================= */

#book {
    visibility: hidden;
}


/* =========================
   LOADING
========================= */

#loading {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 14px;
    color: #ddd;
}


/* =========================
   FOOTER
========================= */

footer {
    height: 54px;

    background: #101010;

    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}


/* =========================
   BUTTONS
========================= */

button {
    width: 42px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;
    line-height: 30px;

    cursor: pointer;

    transition: background .15s ease;
}

button:hover {
    background: #3a3a3a;
}

button:active {
    background: #202020;
}


/* =========================
   COUNTER
========================= */

#count {
    min-width: 180px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

</style>
</head>


<body>


<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <div id="book"></div>

</div>


<footer>

    <button id="prev" aria-label="Previous page">
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button id="next" aria-label="Next page">
        ›
    </button>

</footer>



<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const book =
    document.getElementById("book");

const loading =
    document.getElementById("loading");

const count =
    document.getElementById("count");

const nextButton =
    document.getElementById("next");

const prevButton =
    document.getElementById("prev");


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

let total = 0;

let pageWidth = 0;
let pageHeight = 0;


/* =========================================================
   START
========================================================= */

async function start() {

    /*
     * Load catalogue.pdf
     *
     * Keep catalogue.pdf in the same folder
     * as this HTML file.
     */

    const pdf =
        await pdfjsLib
            .getDocument("catalogue.pdf")
            .promise;


    total = pdf.numPages;


    const images = [];

    let ratio = 0;


    /* =====================================================
       CONVERT PDF PAGES TO IMAGES
    ===================================================== */

    for (let n = 1; n <= total; n++) {

        const page =
            await pdf.getPage(n);


        /*
         * Scale 2 gives good quality
         * without making the catalogue excessively heavy.
         */

        const viewport =
            page.getViewport({
                scale: 2
            });


        /*
         * Calculate page aspect ratio
         * using the first PDF page.
         */

        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement("canvas");


        canvas.width =
            Math.round(viewport.width);

        canvas.height =
            Math.round(viewport.height);


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
         * White PDF background
         */

        context.fillStyle = "#ffffff";

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext: context,

            viewport: viewport

        }).promise;


        /*
         * Convert rendered PDF page
         * into image for PageFlip.
         */

        images.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );

    }


    /* =====================================================
       CALCULATE PAGE SIZE
    ===================================================== */

    /*
     * The size calculation is based on TWO pages because
     * the catalogue will normally be open as a spread.
     *
     * PageFlip will automatically use only one page width
     * for the front/back covers.
     */

    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight * 0.90,

                (stage.clientWidth * 0.92) /
                (2 * ratio)

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /* =====================================================
       CREATE PAGE FLIP BOOK
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                /*
                 * Physical size of ONE page
                 */

                width: pageWidth,

                height: pageHeight,


                /*
                 * Keep page dimensions fixed
                 */

                size: "fixed",


                minWidth: pageWidth,

                maxWidth: pageWidth,

                minHeight: pageHeight,

                maxHeight: pageHeight,


                /*
                 * IMPORTANT
                 *
                 * Page 1:
                 * single front cover
                 *
                 * Last page:
                 * single back cover
                 */

                showCover: true,


                /*
                 * IMPORTANT
                 *
                 * Allows PageFlip to switch between:
                 *
                 * CLOSED:
                 * one centered page
                 *
                 * OPEN:
                 * two-page spread
                 */

                usePortrait: true,


                /*
                 * Automatically size the PageFlip container
                 */

                autoSize: true,


                /*
                 * Realistic page shadow
                 */

                drawShadow: true,

                maxShadowOpacity: 0.58,


                /*
                 * Page-turn speed
                 */

                flippingTime: 950,


                /*
                 * Mouse interaction
                 */

                useMouseEvents: true,


                /*
                 * Touch configuration
                 */

                mobileScrollSupport: false,

                swipeDistance: 20,


                /*
                 * Show interactive page corners
                 */

                showPageCorners: true,


                /*
                 * Clicking page can turn it
                 */

                disableFlipByClick: false

            }

        );


    /* =====================================================
       LOAD PDF PAGES
    ===================================================== */

    flip.loadFromImages(images);


    /* =====================================================
       EVENTS
    ===================================================== */

    flip.on(
        "init",
        function () {

            updateCounter();

        }
    );


    flip.on(
        "flip",
        function () {

            updateCounter();

        }
    );


    flip.on(
        "changeOrientation",
        function () {

            updateCounter();

        }
    );


    /* =====================================================
       SHOW BOOK
    ===================================================== */

    book.style.visibility =
        "visible";


    loading.style.display =
        "none";


    updateCounter();

}


/* =========================================================
   PAGE COUNTER
========================================================= */

function updateCounter() {

    if (!flip || !total) {
        return;
    }


    /*
     * PageFlip uses zero-based indexes:
     *
     * 0 = PDF page 1
     * 1 = PDF page 2
     * 2 = PDF page 3
     * ...
     */

    const index =
        flip.getCurrentPageIndex();


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (index <= 0) {

        count.textContent =
            `Front Cover · Page 1 / ${total}`;

        return;

    }


    /* =====================================================
       BACK COVER
    ===================================================== */

    if (index >= total - 1) {

        count.textContent =
            `Back Cover · Page ${total} / ${total}`;

        return;

    }


    /* =====================================================
       INSIDE PAGES
    ===================================================== */

    /*
     * With showCover:true:
     *
     * PDF page 1 = cover
     *
     * Then:
     *
     * pages 2–3
     * pages 4–5
     * pages 6–7
     * ...
     */


    let pdfPage =
        index + 1;


    let leftPage;


    /*
     * Find left side of spread.
     */

    if (pdfPage % 2 === 0) {

        leftPage =
            pdfPage;

    } else {

        leftPage =
            pdfPage - 1;

    }


    const rightPage =
        Math.min(
            leftPage + 1,
            total
        );


    /*
     * Prevent the final cover from being
     * reported as part of an inside spread.
     */

    if (
        rightPage === total &&
        total % 2 === 1
    ) {

        count.textContent =
            `Page ${leftPage} / ${total}`;

        return;

    }


    count.textContent =
        `Pages ${leftPage}–${rightPage} / ${total}`;

}


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    function () {

        if (!flip) {
            return;
        }

        flip.flipNext("bottom");

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(
    "click",
    function () {

        if (!flip) {
            return;
        }

        flip.flipPrev("bottom");

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (!flip) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {

            flip.flipNext("bottom");

        }


        if (
            event.key === "ArrowLeft"
        ) {

            flip.flipPrev("bottom");

        }

    }
);


/* =========================================================
   LOAD
========================================================= */

start().catch(
    function (error) {

        console.error(error);

        loading.textContent =
            "Could not load catalogue.pdf";

    }
);

</script>


</body>
</html>
