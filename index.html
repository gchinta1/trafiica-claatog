<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: white;
}

/* =========================================================
   STAGE
========================================================= */

#stage {
    position: relative;

    width: 100%;
    height: calc(100vh - 58px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #151515 100%
        );
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;
    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 15px;
    color: #ddd;
}


/* =========================================================
   BOOK AREA
========================================================= */

#viewer {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: relative;

    background: white;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 2px 5px rgba(0,0,0,.35);

    overflow: hidden;

    cursor: pointer;
}


/*
   IMPORTANT:
   Canvas always fills the calculated page box exactly.
*/

#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* Slight book depth */

#closedBook::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 8px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.20),
            rgba(255,255,255,.10)
        );
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: relative;

    align-items: stretch;
    justify-content: center;

    background: transparent;

    box-shadow:
        0 18px 45px rgba(0,0,0,.50);
}


/* =========================================================
   INDIVIDUAL PAGE
========================================================= */

.page {
    position: relative;

    overflow: hidden;

    background: white;

    flex: 0 0 auto;
}


/*
   CRITICAL:

   The canvas dimensions are calculated from the actual
   PDF ratio.

   No object-fit.
   No background-size.
   No transforms.
   No zoom.
*/

.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* =========================================================
   LEFT PAGE
========================================================= */

#leftPage {
    box-shadow:
        inset -12px 0 20px -18px rgba(0,0,0,.85);
}


/* =========================================================
   RIGHT PAGE
========================================================= */

#rightPage {
    box-shadow:
        inset 12px 0 20px -18px rgba(0,0,0,.85);
}


/* =========================================================
   CENTER SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 20;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 22px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.15) 0%,
            rgba(0,0,0,.06) 25%,
            rgba(255,255,255,.16) 48%,
            rgba(0,0,0,.06) 70%,
            rgba(0,0,0,.15) 100%
        );
}


/* =========================================================
   PAGE TURN ANIMATION
========================================================= */

#openBook.turnNext {
    animation: turnNext .28s ease;
}

#openBook.turnPrev {
    animation: turnPrev .28s ease;
}

@keyframes turnNext {

    0% {
        opacity: .72;
        transform: perspective(1800px) rotateY(-1.5deg);
    }

    100% {
        opacity: 1;
        transform: perspective(1800px) rotateY(0);
    }
}

@keyframes turnPrev {

    0% {
        opacity: .72;
        transform: perspective(1800px) rotateY(1.5deg);
    }

    100% {
        opacity: 1;
        transform: perspective(1800px) rotateY(0);
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 28px;

    background: #101010;

    border-top: 1px solid #333;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;
    border-radius: 7px;

    background: #292929;
    color: white;

    font-size: 25px;

    cursor: pointer;
}

button:hover:not(:disabled) {
    background: #3b3b3b;
}

button:disabled {
    opacity: .25;
    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#counter {
    min-width: 230px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }

    #counter {
        min-width: 150px;
    }

    footer {
        gap: 12px;
    }
}

</style>
</head>

<body>

<div id="stage">

    <div id="loading">
        Loading catalogue...
    </div>


    <div id="viewer">

        <!-- ===============================================
             CLOSED FRONT / BACK
        ================================================ -->

        <div id="closedBook">
            <canvas id="closedCanvas"></canvas>
        </div>


        <!-- ===============================================
             OPEN BOOK
        ================================================ -->

        <div id="openBook">

            <div
                id="leftPage"
                class="page"
            >
                <canvas id="leftCanvas"></canvas>
            </div>


            <div
                id="rightPage"
                class="page"
            >
                <canvas id="rightCanvas"></canvas>
            </div>


            <div id="spine"></div>

        </div>

    </div>

</div>


<footer>

    <button
        id="prev"
        type="button"
        aria-label="Previous"
    >
        ‹
    </button>


    <div id="counter">
        Loading...
    </div>


    <button
        id="next"
        type="button"
        aria-label="Next"
    >
        ›
    </button>

</footer>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PDF_FILE = "catalogue.pdf";


pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const loading =
    document.getElementById("loading");

const closedBook =
    document.getElementById("closedBook");

const closedCanvas =
    document.getElementById("closedCanvas");

const openBook =
    document.getElementById("openBook");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const leftCanvas =
    document.getElementById("leftCanvas");

const rightCanvas =
    document.getElementById("rightCanvas");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const counter =
    document.getElementById("counter");


/* =========================================================
   STATE
========================================================= */

let pdf = null;

let totalPages = 0;


/*
    Exact PDF ratio:

    PDF width / PDF height
*/

let pageRatio = 1;


/*
    Display dimensions of ONE page.
*/

let displayWidth = 0;

let displayHeight = 0;


/*
    STATE:

    front
    open
    back
*/

let mode = "front";


/*
    Current LEFT PDF page.

    Example:

    2 = pages 2 + 3
    4 = pages 4 + 5
    6 = pages 6 + 7
*/

let leftPageNumber = 2;


/* =========================================================
   GET PDF RATIO
========================================================= */

async function getPdfRatio() {

    const firstPage =
        await pdf.getPage(1);

    const viewport =
        firstPage.getViewport({
            scale: 1
        });

    pageRatio =
        viewport.width /
        viewport.height;
}


/* =========================================================
   CALCULATE DISPLAY SIZE
========================================================= */

function calculateSize() {

    /*
        Actual available stage dimensions.
    */

    const availableWidth =
        stage.clientWidth - 60;

    const availableHeight =
        stage.clientHeight - 40;


    /*
        We need TWO full pages to fit inside the stage.

        open width:

            pageWidth × 2

        pageWidth:

            pageHeight × pageRatio
    */

    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(
            availableHeight,
            heightFromWidth
        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(displayWidth);

    displayHeight =
        Math.floor(displayHeight);


    /* =====================================================
       CLOSED BOOK SIZE

       ONE PAGE ONLY
    ===================================================== */

    closedBook.style.width =
        displayWidth + "px";

    closedBook.style.height =
        displayHeight + "px";


    /* =====================================================
       OPEN BOOK SIZE

       TWO PAGES
    ===================================================== */

    openBook.style.width =
        (displayWidth * 2) + "px";

    openBook.style.height =
        displayHeight + "px";


    leftPage.style.width =
        displayWidth + "px";

    leftPage.style.height =
        displayHeight + "px";


    rightPage.style.width =
        displayWidth + "px";

    rightPage.style.height =
        displayHeight + "px";
}


/* =========================================================
   RENDER PDF PAGE INTO CANVAS

   This is the critical part.

   We render the WHOLE PDF page directly into a canvas.
   Nothing is cropped.
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {

    if (
        pageNumber < 1 ||
        pageNumber > totalPages
    ) {

        clearCanvas(canvas);

        return;
    }


    const page =
        await pdf.getPage(
            pageNumber
        );


    /*
        Device pixel ratio keeps the text sharp.

        The CSS size remains displayWidth × displayHeight.
    */

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    /*
        Get natural PDF dimensions.
    */

    const baseViewport =
        page.getViewport({
            scale: 1
        });


    /*
        Scale PDF to our EXACT page display width.
    */

    const renderScale =
        (
            displayWidth *
            dpr
        ) /
        baseViewport.width;


    const viewport =
        page.getViewport({
            scale: renderScale
        });


    /*
        Internal high-resolution canvas.
    */

    canvas.width =
        Math.round(
            viewport.width
        );

    canvas.height =
        Math.round(
            viewport.height
        );


    /*
        CSS display size.

        This is the WHOLE page.
    */

    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    /*
        White background.
    */

    ctx.save();

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();


    /*
        Render COMPLETE PDF page.
    */

    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;
}


/* =========================================================
   CLEAR CANVAS
========================================================= */

function clearCanvas(canvas) {

    /*
        Keep correct page dimensions.
    */

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            displayWidth * dpr
        );

    canvas.height =
        Math.round(
            displayHeight * dpr
        );


    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   FRONT COVER
========================================================= */

async function showFront() {

    mode =
        "front";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    await renderPage(
        1,
        closedCanvas
    );


    counter.textContent =
        `Front Cover · Page 1 / ${totalPages}`;


    prevButton.disabled =
        true;


    nextButton.disabled =
        false;
}


/* =========================================================
   OPEN SPREAD
========================================================= */

async function showSpread(
    requestedLeftPage,
    animation = ""
) {

    mode =
        "open";


    /*
        Interior always begins at page 2.
    */

    requestedLeftPage =
        Math.max(
            2,
            requestedLeftPage
        );


    /*
        Keep LEFT page even:

        2 + 3
        4 + 5
        6 + 7
        ...
    */

    if (
        requestedLeftPage % 2 !== 0
    ) {

        requestedLeftPage--;
    }


    leftPageNumber =
        requestedLeftPage;


    closedBook.style.display =
        "none";


    openBook.style.display =
        "flex";


    /*
        Render BOTH pages directly.
    */

    await Promise.all([

        renderPage(
            leftPageNumber,
            leftCanvas
        ),

        renderPage(
            leftPageNumber + 1,
            rightCanvas
        )

    ]);


    /* =====================================================
       SIMPLE TURN ANIMATION
    ===================================================== */

    openBook.classList.remove(
        "turnNext",
        "turnPrev"
    );


    void openBook.offsetWidth;


    if (
        animation
    ) {

        openBook.classList.add(
            animation
        );
    }


    /* =====================================================
       COUNTER
    ===================================================== */

    if (
        leftPageNumber + 1 <= totalPages
    ) {

        counter.textContent =
            `Pages ${leftPageNumber}–${leftPageNumber + 1} / ${totalPages}`;

    }

    else {

        counter.textContent =
            `Page ${leftPageNumber} / ${totalPages}`;
    }


    /*
        BOTH buttons active inside book.
    */

    prevButton.disabled =
        false;


    nextButton.disabled =
        false;
}


/* =========================================================
   BACK COVER
========================================================= */

function showBack() {

    mode =
        "back";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    /*
        WHITE BACK COVER.

        If later you want the final PDF page to be the
        back cover, replace clearCanvas(closedCanvas)
        with:

        renderPage(totalPages, closedCanvas);
    */

    clearCanvas(
        closedCanvas
    );


    counter.textContent =
        "Back Cover";


    /*
        IMPORTANT:

        LEFT BUTTON REMAINS ACTIVE.
    */

    prevButton.disabled =
        false;


    nextButton.disabled =
        true;
}


/* =========================================================
   NEXT

   Completely independent of any flip library.
========================================================= */

async function goNext() {

    /*
        FRONT
        ->
        2 + 3
    */

    if (
        mode === "front"
    ) {

        await showSpread(
            2,
            "turnNext"
        );

        return;
    }


    /*
        BACK = nothing further.
    */

    if (
        mode === "back"
    ) {

        return;
    }


    /*
        Calculate next spread.
    */

    const nextLeft =
        leftPageNumber + 2;


    /*
        If next spread would start beyond
        the final PDF page:

        CLOSE BOOK.
    */

    if (
        nextLeft > totalPages
    ) {

        showBack();

        return;
    }


    await showSpread(
        nextLeft,
        "turnNext"
    );
}


/* =========================================================
   PREVIOUS

   This does NOT depend on PageFlip.
   Therefore the back button WILL work.
========================================================= */

async function goPrevious() {

    /*
        FRONT:
        nowhere to go.
    */

    if (
        mode === "front"
    ) {

        return;
    }


    /*
        BACK COVER
        ->
        reopen final spread.
    */

    if (
        mode === "back"
    ) {

        let lastLeft;


        /*
            For 13 pages:

            last spread = 12 + 13
        */

        if (
            totalPages % 2 === 1
        ) {

            lastLeft =
                totalPages - 1;

        }

        else {

            lastLeft =
                totalPages;
        }


        /*
            Make sure left page is even.
        */

        if (
            lastLeft % 2 !== 0
        ) {

            lastLeft--;
        }


        lastLeft =
            Math.max(
                2,
                lastLeft
            );


        await showSpread(
            lastLeft,
            "turnPrev"
        );

        return;
    }


    /*
        FIRST OPEN SPREAD:

        2 + 3
        ->
        FRONT COVER
    */

    if (
        leftPageNumber <= 2
    ) {

        await showFront();

        return;
    }


    /*
        Normal previous spread.
    */

    await showSpread(
        leftPageNumber - 2,
        "turnPrev"
    );
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

prevButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        goPrevious();
    }
);


nextButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        goNext();
    }
);


/* =========================================================
   CLOSED COVER CLICK
========================================================= */

closedBook.addEventListener(
    "click",
    function() {

        if (
            mode === "front"
        ) {

            goNext();

        }

        else if (
            mode === "back"
        ) {

            goPrevious();
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            goNext();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            goPrevious();
        }
    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

let resizeTimer = null;


window.addEventListener(
    "resize",
    function() {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async function() {

                    if (
                        !pdf
                    ) {
                        return;
                    }


                    calculateSize();


                    /*
                        Re-render CURRENT state
                        at new correct size.
                    */

                    if (
                        mode === "front"
                    ) {

                        await showFront();

                    }

                    else if (
                        mode === "back"
                    ) {

                        showBack();

                    }

                    else {

                        await showSpread(
                            leftPageNumber
                        );
                    }

                },
                150
            );
    }
);


/* =========================================================
   START
========================================================= */

async function start() {

    try {

        pdf =
            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =
            pdf.numPages;


        await getPdfRatio();


        calculateSize();


        loading.style.display =
            "none";


        await showFront();

    }

    catch(error) {

        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";
    }
}


start();

</script>

</body>
</html>
