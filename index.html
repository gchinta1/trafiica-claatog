<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Online Catalogue</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;font-family:Arial,sans-serif;color:#fff}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 42%,#3b3b3b 0,#242424 36%,#151515 76%)}
header{height:58px;flex:0 0 58px;background:rgba(12,12,12,.96);border-bottom:1px solid #383838;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20}
.title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}.actions{display:flex;gap:8px}
button{border:1px solid #484848;background:#292929;color:#fff;border-radius:8px;min-width:40px;height:38px;padding:0 12px;font-size:17px;cursor:pointer}button:hover{background:#3b3b3b}button:disabled{opacity:.3;cursor:default}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 74px 12px;overflow:hidden}
#book{margin:auto}.page{background:#fff;overflow:hidden}.page canvas{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.stf__parent{filter:drop-shadow(0 20px 24px rgba(0,0,0,.55))}.stf__block{background:#fff}.stf__item{background:#fff}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:48px;height:70px;border-radius:12px;font-size:34px;background:rgba(8,8,8,.58);backdrop-filter:blur(4px)}#prev{left:14px}#next{right:14px}
footer{height:50px;flex:0 0 50px;background:rgba(12,12,12,.96);border-top:1px solid #383838;display:flex;align-items:center;justify-content:center;gap:9px;color:#bbb;font-size:13px;z-index:20}
#pageInput{width:52px;height:31px;background:#242424;border:1px solid #484848;border-radius:7px;color:#fff;text-align:center;font-size:14px}
#loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#171717}.spinner{width:38px;height:38px;border:4px solid #444;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 12px;border-radius:20px;font-size:12px;color:#ddd;pointer-events:none;opacity:0;animation:hint 5s 1.2s 1}@keyframes hint{0%,100%{opacity:0}15%,75%{opacity:1}}
@media(max-width:760px){header{height:52px;flex-basis:52px;padding:0 9px}.title{font-size:12px;max-width:58vw}.actions button{height:34px;min-width:34px;padding:0 8px}#stage{padding:8px 45px}.nav{width:38px;height:58px;font-size:28px}#prev{left:4px}#next{right:4px}footer{height:46px;flex-basis:46px}.desktopOnly{display:none}}
@media print{body{display:none!important}}
</style>
</head>
<body oncontextmenu="return false">
<div id="app">
<header><div class="title">Detection of Traffic Violations and Congestion Using Deep Learning</div><div class="actions"><button id="fullscreen" title="Fullscreen">⛶</button></div></header>
<main id="stage">
  <div id="loading"><div class="spinner"></div><div>Preparing catalogue…</div></div>
  <button class="nav" id="prev" aria-label="Previous page">‹</button>
  <div id="book"></div>
  <button class="nav" id="next" aria-label="Next page">›</button>
  <div class="hint">Drag a page corner or use ← →</div>
</main>
<footer><span>Page</span><input id="pageInput" inputmode="numeric" value="1"><span id="total">/ –</span><span class="desktopOnly">• drag the page to turn it</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const bookEl=document.getElementById('book'),stage=document.getElementById('stage'),loading=document.getElementById('loading');
const prev=document.getElementById('prev'),next=document.getElementById('next'),input=document.getElementById('pageInput'),total=document.getElementById('total');
let pdf,pageFlip;
async function makePages(){
 pdf=await pdfjsLib.getDocument({url:'catalogue.pdf'}).promise; total.textContent='/ '+pdf.numPages;
 const first=await pdf.getPage(1), base=first.getViewport({scale:1});
 const dpr=Math.min(window.devicePixelRatio||1,1.7);
 const targetH=Math.min(1050,Math.max(700,stage.clientHeight*dpr)); const scale=targetH/base.height;
 for(let n=1;n<=pdf.numPages;n++){
   loading.lastElementChild.textContent='Preparing page '+n+' of '+pdf.numPages+'…';
   const p=await pdf.getPage(n),vp=p.getViewport({scale});
   const div=document.createElement('div');div.className='page';
   const canvas=document.createElement('canvas');canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);div.appendChild(canvas);bookEl.appendChild(div);
   await p.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;
 }
 const mobile=window.matchMedia('(max-width:760px)').matches;
 const maxH=Math.max(360,stage.clientHeight-32), maxW=Math.max(250,stage.clientWidth-(mobile?92:160));
 let h=Math.min(maxH,mobile?maxW*(base.height/base.width):maxW/2*(base.height/base.width));
 let w=h*(base.width/base.height); if(mobile&&w>maxW){w=maxW;h=w*(base.height/base.width)}
 pageFlip=new St.PageFlip(bookEl,{width:Math.round(w),height:Math.round(h),size:'fixed',minWidth:220,maxWidth:1200,minHeight:300,maxHeight:1600,showCover:true,mobileScrollSupport:false,usePortrait:true,flippingTime:800,maxShadowOpacity:.5,drawShadow:true,autoSize:false,clickEventForward:true,useMouseEvents:true,swipeDistance:20,showPageCorners:true,disableFlipByClick:false});
 pageFlip.loadFromHTML(document.querySelectorAll('.page'));
 pageFlip.on('flip',e=>sync(e.data+1)); pageFlip.on('changeOrientation',()=>sync(pageFlip.getCurrentPageIndex()+1));
 sync(1);loading.classList.add('hidden');
}
function sync(n){input.value=n;prev.disabled=n<=1;next.disabled=n>=pdf.numPages}
prev.onclick=()=>pageFlip?.flipPrev();next.onclick=()=>pageFlip?.flipNext();
input.onchange=()=>{if(!pageFlip)return;let n=Math.max(1,Math.min(pdf.numPages,parseInt(input.value)||1));pageFlip.flip(n-1)};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='s'||e.key.toLowerCase()==='p'))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());
try{await makePages()}catch(err){console.error(err);loading.innerHTML='<div>Could not load the catalogue.</div><small>Make sure catalogue.pdf is in the same folder as index.html.</small>'}
</script>
</body></html>
