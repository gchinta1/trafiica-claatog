<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181818;font-family:Arial;color:#eee}#stage{height:calc(100% - 54px);display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#303030 0,#222 50%,#151515 100%)}#book{visibility:hidden}#loading{position:absolute}footer{height:54px;background:#101010;border-top:1px solid #333;display:flex;align-items:center;justify-content:center;gap:18px}button{width:42px;height:38px;border:1px solid #444;border-radius:6px;background:#292929;color:#fff;font-size:24px;cursor:pointer}#count{min-width:150px;text-align:center;font-size:13px}</style></head>
<body><div id="stage"><div id="loading">Preparing catalogue…</div><div id="book"></div></div><footer><button id="prev">‹</button><span id="count">Page 1 / 13</span><button id="next">›</button></footer>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const stage=document.getElementById("stage"),book=document.getElementById("book"),count=document.getElementById("count");let flip,total=0;
async function start(){const pdf=await pdfjsLib.getDocument("catalogue.pdf").promise;total=pdf.numPages;const images=[];let ratio=0;
for(let n=1;n<=total;n++){const p=await pdf.getPage(n),vp=p.getViewport({scale:2});if(!ratio)ratio=vp.width/vp.height;const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;images.push(c.toDataURL("image/jpeg",.96));}
const ph=Math.floor(Math.min(stage.clientHeight*.90,(stage.clientWidth*.92)/(2*ratio))),pw=Math.floor(ph*ratio);
flip=new St.PageFlip(book,{width:pw,height:ph,size:"fixed",minWidth:pw,maxWidth:pw,minHeight:ph,maxHeight:ph,showCover:true,usePortrait:false,autoSize:true,drawShadow:true,maxShadowOpacity:.58,flippingTime:950,useMouseEvents:true,mobileScrollSupport:false,swipeDistance:20,showPageCorners:true,disableFlipByClick:false});
flip.loadFromImages(images);flip.on("flip",e=>update(e.data));flip.on("init",e=>update(e.data.page||0));book.style.visibility="visible";document.getElementById("loading").style.display="none";update(0);}
function update(i){i=Number(i||0);if(i<=0){count.textContent=`Page 1 / ${total}`;return}if(i>=total-1){count.textContent=`Page ${total} / ${total}`;return}let left=i+1;if(left%2!==0)left--;let right=Math.min(left+1,total);count.textContent=`Pages ${left}–${right} / ${total}`;}
document.getElementById("next").onclick=()=>flip&&flip.flipNext("bottom");document.getElementById("prev").onclick=()=>flip&&flip.flipPrev("bottom");document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&flip)flip.flipNext("bottom");if(e.key==="ArrowLeft"&&flip)flip.flipPrev("bottom");});start().catch(e=>{console.error(e);document.getElementById("loading").textContent="Could not load catalogue.pdf";});
</script></body></html>
