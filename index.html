<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: white;
}

/* =========================================================
   STAGE
========================================================= */

#stage {
    width: 100%;
    height: calc(100vh - 58px);

    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #151515 100%
        );
}

#loading {
    position: absolute;
    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #ddd;
}

/* =========================================================
   VIEWER
========================================================= */

#viewer {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: relative;

    background: white;

    overflow: hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 2px 5px rgba(0,0,0,.35);

    cursor: pointer;
}

#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}

/* Book edge */

#closedBook::after {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 8px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.22),
            transparent
        );
}

/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: relative;

    background: white;

    box-shadow:
        0 18px 45px rgba(0,0,0,.50);

    perspective: 2500px;

    transform-style: preserve-3d;
}

/* =========================================================
   STATIC PAGES
========================================================= */

.page {
    position: absolute;

    top: 0;

    overflow: hidden;

    background: white;
}

#leftPage {
    left: 0;
}

#rightPage {
    right: 0;
}

.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}

/* =========================================================
   PAGE INNER SHADOW
========================================================= */

#leftPage::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.16),
            transparent
        );
}

#rightPage::after {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.16),
            transparent
        );
}

/* =========================================================
   CENTER SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 30;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 20px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.12),
            rgba(0,0,0,.04),
            rgba(255,255,255,.16),
            rgba(0,0,0,.04),
            rgba(0,0,0,.12)
        );
}

/* =========================================================
   FLIPPING SHEET

   THIS IS SEPARATE FROM THE REAL PAGES.
========================================================= */

#flipSheet {
    display: none;

    position: absolute;

    top: 0;

    z-index: 100;

    background: white;

    transform-style: preserve-3d;

    will-change: transform;
}

/* =========================================================
   FRONT + BACK OF TURNING SHEET
========================================================= */

.flipFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flipFace canvas {
    display: block;

    width: 100%;
    height: 100%;
}

#flipBack {
    transform: rotateY(180deg);
}

/* =========================================================
   SHEET LIGHT / SHADOW
========================================================= */

#flipShade {
    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.25)
        );
}

/* =========================================================
   NEXT ANIMATION

   Sheet begins on RIGHT.
   Hinged at center spine.
========================================================= */

#flipSheet.flip-next {
    left: 50%;

    transform-origin: left center;

    animation:
        flipNext
        900ms
        cubic-bezier(.45,.02,.20,1)
        forwards;
}

#flipSheet.flip-next #flipShade {
    animation:
        shadeNext
        900ms
        ease
        forwards;
}

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(-18deg);
    }

    35% {
        transform: rotateY(-58deg);
    }

    50% {
        transform: rotateY(-90deg);
    }

    68% {
        transform: rotateY(-125deg);
    }

    85% {
        transform: rotateY(-160deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}

@keyframes shadeNext {

    0% {
        opacity: 0;
    }

    45% {
        opacity: .45;
    }

    55% {
        opacity: .45;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   PREVIOUS ANIMATION

   Sheet begins on LEFT.
   Hinged at center spine.
========================================================= */

#flipSheet.flip-prev {
    left: 0;

    transform-origin: right center;

    animation:
        flipPrev
        900ms
        cubic-bezier(.45,.02,.20,1)
        forwards;
}

#flipSheet.flip-prev #flipShade {
    animation:
        shadePrev
        900ms
        ease
        forwards;
}

@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(18deg);
    }

    35% {
        transform: rotateY(58deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    68% {
        transform: rotateY(125deg);
    }

    85% {
        transform: rotateY(160deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}

@keyframes shadePrev {

    0% {
        opacity: 0;
    }

    45% {
        opacity: .45;
    }

    55% {
        opacity: .45;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 28px;

    background: #101010;

    border-top: 1px solid #333;
}

button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: white;

    font-size: 25px;

    cursor: pointer;
}

button:hover:not(:disabled) {
    background: #3b3b3b;
}

button:disabled {
    opacity: .25;
    cursor: default;
}

#counter {
    min-width: 230px;

    text-align: center;

    color: #ddd;

    font-size: 13px;
}

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }

    footer {
        gap: 12px;
    }

    #counter {
        min-width: 150px;
    }
}

</style>
</head>

<body>

<div id="stage">

    <div id="loading">
        Loading catalogue...
    </div>

    <div id="viewer">

        <!-- CLOSED FRONT / BACK -->

        <div id="closedBook">
            <canvas id="closedCanvas"></canvas>
        </div>


        <!-- OPEN BOOK -->

        <div id="openBook">

            <!-- STATIC LEFT -->

            <div
                id="leftPage"
                class="page"
            >
                <canvas id="leftCanvas"></canvas>
            </div>


            <!-- STATIC RIGHT -->

            <div
                id="rightPage"
                class="page"
            >
                <canvas id="rightCanvas"></canvas>
            </div>


            <!-- TEMPORARY TURNING SHEET -->

            <div id="flipSheet">

                <div
                    id="flipFront"
                    class="flipFace"
                >
                    <canvas id="flipFrontCanvas"></canvas>
                </div>

                <div
                    id="flipBack"
                    class="flipFace"
                >
                    <canvas id="flipBackCanvas"></canvas>
                </div>

                <div id="flipShade"></div>

            </div>


            <div id="spine"></div>

        </div>

    </div>

</div>


<footer>

    <button id="prev">
        ‹
    </button>

    <div id="counter">
        Loading...
    </div>

    <button id="next">
        ›
    </button>

</footer>


<script>

/* =========================================================
   CONFIG
========================================================= */

const PDF_FILE =
    "catalogue.pdf";

const TURN_TIME =
    900;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const loading =
    document.getElementById("loading");

const closedBook =
    document.getElementById("closedBook");

const closedCanvas =
    document.getElementById("closedCanvas");

const openBook =
    document.getElementById("openBook");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const leftCanvas =
    document.getElementById("leftCanvas");

const rightCanvas =
    document.getElementById("rightCanvas");

const flipSheet =
    document.getElementById("flipSheet");

const flipFrontCanvas =
    document.getElementById("flipFrontCanvas");

const flipBackCanvas =
    document.getElementById("flipBackCanvas");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const counter =
    document.getElementById("counter");


/* =========================================================
   STATE
========================================================= */

let pdf = null;

let totalPages = 0;

let pageRatio = 1;

let displayWidth = 0;

let displayHeight = 0;

let mode =
    "front";

let leftPageNumber =
    2;

let isAnimating =
    false;


/* =========================================================
   PAGE RATIO
========================================================= */

async function getPdfRatio() {

    const page =
        await pdf.getPage(1);

    const viewport =
        page.getViewport({
            scale: 1
        });

    pageRatio =
        viewport.width /
        viewport.height;
}


/* =========================================================
   SIZE
========================================================= */

function calculateSize() {

    const availableWidth =
        stage.clientWidth - 60;

    const availableHeight =
        stage.clientHeight - 40;


    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(
            availableHeight,
            heightFromWidth
        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(
            displayWidth
        );

    displayHeight =
        Math.floor(
            displayHeight
        );


    /* CLOSED BOOK */

    closedBook.style.width =
        displayWidth + "px";

    closedBook.style.height =
        displayHeight + "px";


    /* OPEN BOOK */

    openBook.style.width =
        (displayWidth * 2) + "px";

    openBook.style.height =
        displayHeight + "px";


    /* STATIC PAGES */

    leftPage.style.width =
        displayWidth + "px";

    leftPage.style.height =
        displayHeight + "px";


    rightPage.style.width =
        displayWidth + "px";

    rightPage.style.height =
        displayHeight + "px";


    /* FLIP SHEET */

    flipSheet.style.width =
        displayWidth + "px";

    flipSheet.style.height =
        displayHeight + "px";
}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {

    if (
        pageNumber < 1 ||
        pageNumber > totalPages
    ) {

        clearCanvas(canvas);

        return;
    }


    const page =
        await pdf.getPage(
            pageNumber
        );


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const baseViewport =
        page.getViewport({
            scale: 1
        });


    const renderScale =
        (displayWidth * dpr) /
        baseViewport.width;


    const viewport =
        page.getViewport({
            scale: renderScale
        });


    canvas.width =
        Math.round(
            viewport.width
        );

    canvas.height =
        Math.round(
            viewport.height
        );


    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;
}


/* =========================================================
   CLEAR PAGE
========================================================= */

function clearCanvas(canvas) {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            displayWidth * dpr
        );

    canvas.height =
        Math.round(
            displayHeight * dpr
        );


    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   REMOVE FLIP
========================================================= */

function resetFlip() {

    flipSheet.classList.remove(
        "flip-next",
        "flip-prev"
    );

    flipSheet.style.display =
        "none";

    flipSheet.style.transform =
        "";
}


/* =========================================================
   FRONT COVER
========================================================= */

async function showFront() {

    resetFlip();

    mode =
        "front";


    openBook.style.display =
        "none";

    closedBook.style.display =
        "block";


    await renderPage(
        1,
        closedCanvas
    );


    counter.textContent =
        `Front Cover · Page 1 / ${totalPages}`;


    prevButton.disabled =
        true;

    nextButton.disabled =
        false;


    isAnimating =
        false;
}


/* =========================================================
   RENDER STATIC SPREAD
========================================================= */

async function renderSpread(
    requestedLeft
) {

    requestedLeft =
        Math.max(
            2,
            requestedLeft
        );


    if (
        requestedLeft % 2 !== 0
    ) {

        requestedLeft--;
    }


    leftPageNumber =
        requestedLeft;


    await Promise.all([

        renderPage(
            leftPageNumber,
            leftCanvas
        ),

        renderPage(
            leftPageNumber + 1,
            rightCanvas
        )

    ]);


    if (
        leftPageNumber + 1 <= totalPages
    ) {

        counter.textContent =
            `Pages ${leftPageNumber}–${leftPageNumber + 1} / ${totalPages}`;

    } else {

        counter.textContent =
            `Page ${leftPageNumber} / ${totalPages}`;
    }
}


/* =========================================================
   SHOW OPEN BOOK
========================================================= */

async function showSpread(
    requestedLeft
) {

    resetFlip();

    mode =
        "open";


    closedBook.style.display =
        "none";

    openBook.style.display =
        "block";


    await renderSpread(
        requestedLeft
    );


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;
}


/* =========================================================
   BACK COVER
========================================================= */

function showBack() {

    resetFlip();

    mode =
        "back";


    openBook.style.display =
        "none";

    closedBook.style.display =
        "block";


    /*
       WHITE BACK COVER
    */

    clearCanvas(
        closedCanvas
    );


    counter.textContent =
        "Back Cover";


    prevButton.disabled =
        false;

    nextButton.disabled =
        true;


    isAnimating =
        false;
}


/* =========================================================
   LAST SPREAD
========================================================= */

function getLastLeftPage() {

    let lastLeft;


    if (
        totalPages % 2 === 1
    ) {

        lastLeft =
            totalPages - 1;

    } else {

        lastLeft =
            totalPages;
    }


    if (
        lastLeft % 2 !== 0
    ) {

        lastLeft--;
    }


    return Math.max(
        2,
        lastLeft
    );
}


/* =========================================================
   NEXT PAGE TURN
========================================================= */

async function goNext() {

    if (
        isAnimating
    ) {
        return;
    }


    /* FRONT -> OPEN */

    if (
        mode === "front"
    ) {

        isAnimating =
            true;

        await showSpread(
            2
        );

        return;
    }


    if (
        mode === "back"
    ) {
        return;
    }


    const currentLeft =
        leftPageNumber;

    const currentRight =
        currentLeft + 1;

    const nextLeft =
        currentLeft + 2;

    const nextRight =
        currentLeft + 3;


    /* =====================================================
       END OF BOOK
    ===================================================== */

    if (
        nextLeft > totalPages
    ) {

        isAnimating =
            true;


        /*
           Flip the current right page away.
        */

        await renderPage(
            currentRight,
            flipFrontCanvas
        );


        clearCanvas(
            flipBackCanvas
        );


        flipSheet.style.display =
            "block";


        flipSheet.classList.remove(
            "flip-next"
        );


        void flipSheet.offsetWidth;


        flipSheet.classList.add(
            "flip-next"
        );


        setTimeout(

            function() {

                showBack();

            },

            TURN_TIME

        );


        return;
    }


    /* =====================================================
       NORMAL NEXT
    ===================================================== */

    isAnimating =
        true;


    /*
       FRONT OF TURNING SHEET:

       Current RIGHT page.
    */

    await renderPage(
        currentRight,
        flipFrontCanvas
    );


    /*
       BACK OF TURNING SHEET:

       Next LEFT page.

       When the page passes 90 degrees,
       this becomes visible.
    */

    await renderPage(
        nextLeft,
        flipBackCanvas
    );


    /*
       Underneath the turning page we need the
       NEW RIGHT page already waiting.
    */

    await renderPage(
        nextRight,
        rightCanvas
    );


    /*
       Keep current left page underneath until
       sheet crosses the middle.
    */


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-next"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-next"
    );


    /*
       At approximately halfway, update
       underlying LEFT page.
    */

    setTimeout(

        async function() {

            await renderPage(
                nextLeft,
                leftCanvas
            );

        },

        TURN_TIME * 0.52

    );


    /*
       Finish.
    */

    setTimeout(

        function() {

            leftPageNumber =
                nextLeft;


            resetFlip();


            counter.textContent =
                nextRight <= totalPages

                    ? `Pages ${nextLeft}–${nextRight} / ${totalPages}`

                    : `Page ${nextLeft} / ${totalPages}`;


            isAnimating =
                false;

        },

        TURN_TIME

    );
}


/* =========================================================
   PREVIOUS PAGE TURN
========================================================= */

async function goPrevious() {

    if (
        isAnimating
    ) {
        return;
    }


    if (
        mode === "front"
    ) {
        return;
    }


    /* =====================================================
       BACK -> LAST SPREAD
    ===================================================== */

    if (
        mode === "back"
    ) {

        isAnimating =
            true;


        await showSpread(
            getLastLeftPage()
        );


        return;
    }


    /* =====================================================
       FIRST SPREAD -> FRONT COVER
    ===================================================== */

    if (
        leftPageNumber <= 2
    ) {

        isAnimating =
            true;


        await renderPage(
            leftPageNumber,
            flipFrontCanvas
        );


        await renderPage(
            1,
            flipBackCanvas
        );


        flipSheet.style.display =
            "block";


        flipSheet.classList.remove(
            "flip-prev"
        );


        void flipSheet.offsetWidth;


        flipSheet.classList.add(
            "flip-prev"
        );


        setTimeout(

            async function() {

                await showFront();

            },

            TURN_TIME

        );


        return;
    }


    /* =====================================================
       NORMAL PREVIOUS
    ===================================================== */

    isAnimating =
        true;


    const currentLeft =
        leftPageNumber;

    const previousLeft =
        currentLeft - 2;

    const previousRight =
        currentLeft - 1;


    /*
       FRONT:

       Current LEFT page.
    */

    await renderPage(
        currentLeft,
        flipFrontCanvas
    );


    /*
       BACK:

       Previous RIGHT page.
    */

    await renderPage(
        previousRight,
        flipBackCanvas
    );


    /*
       Prepare previous LEFT page underneath.
    */

    await renderPage(
        previousLeft,
        leftCanvas
    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-prev"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-prev"
    );


    /*
       Change right page around halfway.
    */

    setTimeout(

        async function() {

            await renderPage(
                previousRight,
                rightCanvas
            );

        },

        TURN_TIME * 0.52

    );


    setTimeout(

        function() {

            leftPageNumber =
                previousLeft;


            resetFlip();


            counter.textContent =
                `Pages ${previousLeft}–${previousRight} / ${totalPages}`;


            isAnimating =
                false;

        },

        TURN_TIME

    );
}


/* =========================================================
   BUTTONS
========================================================= */

prevButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        goPrevious();
    }
);


nextButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        goNext();
    }
);


/* =========================================================
   COVER CLICK
========================================================= */

closedBook.addEventListener(
    "click",
    function() {

        if (
            mode === "front"
        ) {

            goNext();

        } else if (
            mode === "back"
        ) {

            goPrevious();
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            goNext();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            goPrevious();
        }
    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    function() {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(

                async function() {

                    if (
                        !pdf ||
                        isAnimating
                    ) {
                        return;
                    }


                    calculateSize();


                    if (
                        mode === "front"
                    ) {

                        await showFront();

                    } else if (
                        mode === "back"
                    ) {

                        showBack();

                    } else {

                        await showSpread(
                            leftPageNumber
                        );
                    }

                },

                150
            );
    }
);


/* =========================================================
   START
========================================================= */

async function start() {

    try {

        pdf =
            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =
            pdf.numPages;


        await getPdfRatio();


        calculateSize();


        loading.style.display =
            "none";


        await showFront();

    }

    catch(error) {

        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";
    }
}


start();

</script>
