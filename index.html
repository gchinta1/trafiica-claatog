<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Catalogue</title>


<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PAGE FLIP -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #181818;

    font-family: Arial, sans-serif;

    color: #eee;
}


/* =========================================================
   STAGE
========================================================= */

#stage {

    width: 100%;

    height: calc(100% - 54px);

    position: relative;

    overflow: hidden;


    display: flex;

    align-items: center;

    justify-content: center;


    background:

        radial-gradient(

            ellipse at center,

            #303030 0%,

            #222 50%,

            #151515 100%

        );

}


/* =========================================================
   LOADING
========================================================= */

#loading {

    position: absolute;

    inset: 0;


    display: flex;

    align-items: center;

    justify-content: center;


    z-index: 100;


    font-size: 14px;

    color: #ddd;

}


/* =========================================================
   CLOSED BOOK
   ---------------------------------------------------------
   IMPORTANT:

   This is NOT PageFlip.

   This is a REAL one-page container.

   Therefore the front/back cover is genuinely:
   ONE PAGE
   CENTERED
========================================================= */

#closedView {

    display: none;


    position: relative;


    overflow: hidden;


    background: #ffffff;


    box-shadow:

        0 16px 45px rgba(0,0,0,.48),

        0 0 0 1px rgba(0,0,0,.16);


    cursor: pointer;


    transform-origin: center center;

}


/* =========================================================
   CLOSED COVER IMAGE
========================================================= */

#closedView img {

    display: block;


    width: 100%;

    height: 100%;


    /*
     * Show the ENTIRE PDF page.
     */

    object-fit: contain;

    object-position: center center;


    background: #ffffff;


    user-select: none;

    -webkit-user-drag: none;

}


/* =========================================================
   COVER APPEAR ANIMATION
========================================================= */

#closedView.front,
#closedView.back {

    animation:
        coverAppear
        .28s
        ease
        both;

}


@keyframes coverAppear {

    from {

        opacity: .65;

        transform:
            scale(.985);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================================
   OPEN BOOK
========================================================= */

#openView {

    display: none;


    position: relative;


    overflow: visible;


    filter:

        drop-shadow(

            0 16px 32px rgba(0,0,0,.40)

        );

}


/* =========================================================
   PAGEFLIP
========================================================= */

#book {

    visibility: hidden;

}


/*
 * Force PageFlip images to show completely.
 *
 * NO CROPPING.
 * NO ZOOMED IMAGE.
 */

#book img {

    width: 100% !important;

    height: 100% !important;


    object-fit: contain !important;

    object-position: center center !important;


    background: #ffffff;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    width: 100%;

    height: 54px;


    background: #101010;


    border-top:

        1px solid #333;


    display: flex;

    align-items: center;

    justify-content: center;


    gap: 18px;

}


/* =========================================================
   BUTTONS
========================================================= */

button {

    width: 46px;

    height: 38px;


    border:

        1px solid #444;


    border-radius: 6px;


    background: #292929;

    color: #ffffff;


    font-size: 24px;


    cursor: pointer;


    transition:

        background .15s ease,

        opacity .15s ease;

}


button:hover:not(:disabled) {

    background: #3a3a3a;

}


button:active:not(:disabled) {

    background: #202020;

}


button:disabled {

    opacity: .25;

    cursor: default;

}


/* =========================================================
   PAGE COUNTER
========================================================= */

#count {

    min-width: 240px;


    text-align: center;


    font-size: 13px;


    color: #ddd;

}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media (max-width: 700px) {

    #count {

        min-width: 150px;

    }


    button {

        width: 40px;

    }

}

</style>

</head>



<body>


<!-- =======================================================
     STAGE
======================================================== -->

<div id="stage">


    <!-- LOADING -->

    <div id="loading">

        Preparing catalogue…

    </div>



    <!-- ===================================================
         CLOSED BOOK

         FRONT COVER
         or
         BACK COVER

         ALWAYS ONE PAGE.
    ==================================================== -->

    <div
        id="closedView"
        aria-label="Closed catalogue"
    >

        <img
            id="closedImage"
            alt="Catalogue cover"
        >

    </div>



    <!-- ===================================================
         OPEN BOOK

         ONLY INTERIOR PDF PAGES
    ==================================================== -->

    <div id="openView">

        <div id="book"></div>

    </div>


</div>



<!-- =======================================================
     CONTROLS
======================================================== -->

<footer>


    <button
        id="prev"
        aria-label="Previous"
    >

        ‹

    </button>



    <span id="count">

        Front Cover

    </span>



    <button
        id="next"
        aria-label="Next"
    >

        ›

    </button>


</footer>



<script>

/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =

    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =

    document.getElementById(
        "stage"
    );


const loading =

    document.getElementById(
        "loading"
    );


const closedView =

    document.getElementById(
        "closedView"
    );


const closedImage =

    document.getElementById(
        "closedImage"
    );


const openView =

    document.getElementById(
        "openView"
    );


const book =

    document.getElementById(
        "book"
    );


const prevButton =

    document.getElementById(
        "prev"
    );


const nextButton =

    document.getElementById(
        "next"
    );


const count =

    document.getElementById(
        "count"
    );


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;


let pdfImages = [];


let interiorImages = [];


let totalPdfPages = 0;


let pageWidth = 0;


let pageHeight = 0;


let pdfRatio = 0;


/*
 * Current mode:
 *
 * front
 * open
 * back
 */

let mode = "front";


/*
 * Current open spread:
 *
 * 0 = PDF 2 + PDF 3
 *
 * 1 = PDF 4 + PDF 5
 *
 * 2 = PDF 6 + PDF 7
 *
 * etc.
 */

let openSpread = 0;


/* =========================================================
   CREATE WHITE PAGE
========================================================= */

function createWhitePage(
    width,
    height
) {


    const canvas =

        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const context =

        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    context.fillStyle =
        "#ffffff";


    context.fillRect(

        0,

        0,

        width,

        height

    );


    return canvas.toDataURL(

        "image/jpeg",

        0.96

    );

}


/* =========================================================
   CALCULATE BOOK SIZE
========================================================= */

function calculateBookSize() {


    /*
     * Available screen area.
     *
     * We leave a small border around the book.
     */

    const availableHeight =

        stage.clientHeight * 0.90;


    const availableWidth =

        stage.clientWidth * 0.92;


    /*
     * IMPORTANT:
     *
     * PDF ratio =
     *
     * page width / page height
     *
     *
     * OPEN BOOK needs TWO pages.
     *
     * Therefore:
     *
     * total open width =
     *
     * 2 × page width
     */


    pageHeight =

        Math.min(

            availableHeight,

            availableWidth /
            (
                2 * pdfRatio
            )

        );


    pageWidth =

        pageHeight *
        pdfRatio;


    pageHeight =

        Math.floor(
            pageHeight
        );


    pageWidth =

        Math.floor(
            pageWidth
        );


    /* =====================================================
       CLOSED BOOK

       EXACTLY ONE PAGE
    ===================================================== */

    closedView.style.width =

        pageWidth + "px";


    closedView.style.height =

        pageHeight + "px";


    /* =====================================================
       OPEN BOOK

       EXACTLY TWO PAGES
    ===================================================== */

    openView.style.width =

        (
            pageWidth * 2
        ) + "px";


    openView.style.height =

        pageHeight + "px";

}


/* =========================================================
   LOAD PDF
========================================================= */

async function start() {


    /* =====================================================
       OPEN PDF
    ===================================================== */

    const pdf =

        await pdfjsLib
            .getDocument(
                "catalogue.pdf"
            )
            .promise;


    totalPdfPages =

        pdf.numPages;


    let renderedWidth = 0;

    let renderedHeight = 0;


    /* =====================================================
       RENDER EVERY PDF PAGE
    ===================================================== */

    for (

        let pageNumber = 1;

        pageNumber <= totalPdfPages;

        pageNumber++

    ) {


        const page =

            await pdf.getPage(
                pageNumber
            );


        /*
         * Render at high quality.
         */

        const viewport =

            page.getViewport({

                scale: 2

            });


        /* =================================================
           GET REAL PDF ASPECT RATIO
        ================================================= */

        if (
            pdfRatio === 0
        ) {


            pdfRatio =

                viewport.width /
                viewport.height;

        }


        /* =================================================
           CANVAS
        ================================================= */

        const canvas =

            document.createElement(
                "canvas"
            );


        canvas.width =

            Math.round(
                viewport.width
            );


        canvas.height =

            Math.round(
                viewport.height
            );


        renderedWidth =

            canvas.width;


        renderedHeight =

            canvas.height;


        /* =================================================
           CONTEXT
        ================================================= */

        const context =

            canvas.getContext(

                "2d",

                {
                    alpha: false
                }

            );


        /* =================================================
           WHITE BACKGROUND
        ================================================= */

        context.fillStyle =

            "#ffffff";


        context.fillRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        /* =================================================
           RENDER COMPLETE PDF PAGE
        ================================================= */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /* =================================================
           SAVE COMPLETE PAGE IMAGE
        ================================================= */

        pdfImages.push(

            canvas.toDataURL(

                "image/jpeg",

                0.96

            )

        );

    }


    /* =====================================================
       CALCULATE DISPLAY DIMENSIONS
    ===================================================== */

    calculateBookSize();


    /* =====================================================
       BOOK STRUCTURE
    ===================================================== */


    /*
     * PDF PAGE 1
     *
     * IS THE FRONT COVER.
     *
     * It is NOT put inside PageFlip.
     */


    /*
     * PageFlip receives:
     *
     * PDF PAGE 2
     * PDF PAGE 3
     * PDF PAGE 4
     * ...
     * PDF PAGE 13
     *
     *
     * So:
     *
     * ┌────────────┬────────────┐
     * │   PAGE 2   │   PAGE 3   │
     * └────────────┴────────────┘
     *
     * ┌────────────┬────────────┐
     * │   PAGE 4   │   PAGE 5   │
     * └────────────┴────────────┘
     *
     * ...
     */


    interiorImages =

        pdfImages.slice(1);


    /* =====================================================
       ODD INTERIOR PAGE PROTECTION
    ===================================================== */

    /*
     * Your current PDF:
     *
     * 13 pages total
     *
     * 1 front
     *
     * 12 interior
     *
     * Perfect.
     *
     *
     * But this also allows another PDF
     * with an odd number of inside pages.
     */


    if (

        interiorImages.length % 2 !== 0

    ) {


        interiorImages.push(

            createWhitePage(

                renderedWidth,

                renderedHeight

            )

        );

    }


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =

        new St.PageFlip(

            book,

            {

                /* =========================================
                   REAL SINGLE PAGE SIZE
                ========================================= */

                width:
                    pageWidth,


                height:
                    pageHeight,


                /* =========================================
                   FIXED PDF ASPECT RATIO
                ========================================= */

                size:
                    "fixed",


                minWidth:
                    pageWidth,


                maxWidth:
                    pageWidth,


                minHeight:
                    pageHeight,


                maxHeight:
                    pageHeight,


                /* =========================================
                   NO PAGEFLIP COVER

                   Covers are handled separately.
                ========================================= */

                showCover:
                    false,


                /* =========================================
                   DESKTOP = TWO PAGES
                ========================================= */

                usePortrait:
                    false,


                /* =========================================
                   LET PAGEFLIP SIZE ITS INTERNAL CANVAS
                   CORRECTLY
                ========================================= */

                autoSize:
                    true,


                /* =========================================
                   PAGE EFFECTS
                ========================================= */

                drawShadow:
                    true,


                maxShadowOpacity:
                    0.35,


                flippingTime:
                    850,


                /* =========================================
                   INPUT
                ========================================= */

                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                showPageCorners:
                    true,


                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD COMPLETE PDF PAGE IMAGES
    ===================================================== */

    flip.loadFromImages(

        interiorImages

    );


    /* =====================================================
       INITIALIZED
    ===================================================== */

    flip.on(

        "init",

        function () {


            book.style.visibility =

                "visible";

        }

    );


    /* =====================================================
       PAGE FLIPPED
    ===================================================== */

    flip.on(

        "flip",

        function () {


            if (

                mode !== "open"

            ) {


                return;

            }


            const index =

                flip.getCurrentPageIndex();


            /*
             * Normalize to spread.
             */

            openSpread =

                Math.floor(

                    index / 2

                );


            updateCounter();

        }

    );


    /* =====================================================
       READY
    ===================================================== */

    loading.style.display =

        "none";


    /*
     * START WITH TRUE CLOSED COVER.
     */

    showFront();

}


/* =========================================================
   SHOW FRONT COVER
========================================================= */

function showFront() {


    mode =
        "front";


    /* Hide open book */

    openView.style.display =
        "none";


    /* Show one-page closed book */

    closedView.style.display =
        "block";


    closedView.className =
        "front";


    /*
     * REAL PDF PAGE 1
     */

    closedImage.src =

        pdfImages[0];


    count.textContent =

        `Front Cover · Page 1 / ${totalPdfPages}`;


    prevButton.disabled =

        true;


    nextButton.disabled =

        false;

}


/* =========================================================
   SHOW OPEN BOOK
========================================================= */

function showOpen(
    spreadIndex = 0
) {


    mode =
        "open";


    /* Hide cover */

    closedView.style.display =
        "none";


    /* Show two-page book */

    openView.style.display =
        "block";


    /* =====================================================
       NUMBER OF SPREADS
    ===================================================== */

    const maxSpread =

        Math.max(

            0,

            Math.ceil(

                interiorImages.length / 2

            ) - 1

        );


    /* =====================================================
       SAFE SPREAD INDEX
    ===================================================== */

    openSpread =

        Math.max(

            0,

            Math.min(

                spreadIndex,

                maxSpread

            )

        );


    /* =====================================================
       PAGEFLIP INDEX
    ===================================================== */

    const target =

        openSpread * 2;


    /*
     * Spread 0:
     *
     * PDF 2 + 3
     *
     * PageFlip index 0 + 1
     *
     *
     * Spread 1:
     *
     * PDF 4 + 5
     *
     * PageFlip index 2 + 3
     */


    flip.turnToPage(
        target
    );


    updateCounter();


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;

}


/* =========================================================
   SHOW BACK COVER
========================================================= */

function showBack() {


    mode =
        "back";


    /* Hide PageFlip */

    openView.style.display =
        "none";


    /* Show ONE PAGE */

    closedView.style.display =
        "block";


    closedView.className =
        "back";


    /* =====================================================
       WHITE BACK COVER
    ===================================================== */

    const canvas =

        document.createElement(
            "canvas"
        );


    canvas.width =
        1200;


    canvas.height =

        Math.round(

            1200 /

            pdfRatio

        );


    const context =

        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    context.fillStyle =

        "#ffffff";


    context.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    closedImage.src =

        canvas.toDataURL(

            "image/jpeg",

            0.96

        );


    count.textContent =

        "Back Cover";


    prevButton.disabled =

        false;


    nextButton.disabled =

        true;

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateCounter() {


    if (

        mode !== "open"

    ) {


        return;

    }


    const leftPdf =

        2 +

        (
            openSpread * 2
        );


    const rightPdf =

        leftPdf + 1;


    if (

        rightPdf <= totalPdfPages

    ) {


        count.textContent =

            `Pages ${leftPdf}–${rightPdf} / ${totalPdfPages}`;


    }

    else {


        count.textContent =

            `Page ${leftPdf} / ${totalPdfPages}`;

    }

}


/* =========================================================
   NEXT
========================================================= */

function next() {


    /* =====================================================
       FRONT -> OPEN
    ===================================================== */

    if (

        mode === "front"

    ) {


        showOpen(0);


        return;

    }


    /* =====================================================
       BACK
    ===================================================== */

    if (

        mode === "back"

    ) {


        return;

    }


    /* =====================================================
       MAXIMUM OPEN SPREAD
    ===================================================== */

    const maxSpread =

        Math.ceil(

            interiorImages.length / 2

        ) - 1;


    /* =====================================================
       LAST SPREAD -> CLOSE BACK
    ===================================================== */

    if (

        openSpread >= maxSpread

    ) {


        showBack();


        return;

    }


    /* =====================================================
       NORMAL PAGE FLIP
    ===================================================== */

    flip.flipNext(
        "bottom"
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previous() {


    /* =====================================================
       BACK -> REOPEN LAST SPREAD
    ===================================================== */

    if (

        mode === "back"

    ) {


        const maxSpread =

            Math.ceil(

                interiorImages.length / 2

            ) - 1;


        showOpen(

            maxSpread

        );


        return;

    }


    /* =====================================================
       FRONT
    ===================================================== */

    if (

        mode === "front"

    ) {


        return;

    }


    /* =====================================================
       FIRST SPREAD -> CLOSE FRONT
    ===================================================== */

    if (

        openSpread <= 0

    ) {


        showFront();


        return;

    }


    /* =====================================================
       NORMAL PREVIOUS FLIP
    ===================================================== */

    flip.flipPrev(
        "bottom"
    );

}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextButton.addEventListener(

    "click",

    next

);


/* =========================================================
   PREVIOUS BUTTON
========================================================= */

prevButton.addEventListener(

    "click",

    previous

);


/* =========================================================
   CLICK CLOSED BOOK
========================================================= */

closedView.addEventListener(

    "click",

    function () {


        /*
         * FRONT COVER:
         *
         * click = open
         */

        if (

            mode === "front"

        ) {


            next();


            return;

        }


        /*
         * BACK COVER:
         *
         * click = reopen
         */

        if (

            mode === "back"

        ) {


            previous();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function (
        event
    ) {


        if (

            event.key ===
            "ArrowRight"

        ) {


            next();

        }


        if (

            event.key ===
            "ArrowLeft"

        ) {


            previous();

        }

    }

);


/* =========================================================
   START APPLICATION
========================================================= */

start().catch(

    function (
        error
    ) {


        console.error(
            error
        );


        loading.textContent =

            "Could not load catalogue.pdf";

    }

);

</script>


</body>

</html>
