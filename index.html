<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INTERSPORT Digital Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #181818;

    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    position: relative;

    width: 100%;
    height: calc(100vh - 58px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #111 100%
        );
}


#viewer {
    position: relative;

    width: 100%;
    height: 100%;
}


/* =========================================================
   INTERSPORT INTRO
========================================================= */

#loading {
    position: absolute;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #191919 55%,
            #101010 100%
        );

    transition:
        opacity .6s ease,
        visibility .6s ease;
}


#loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


.introBrand {
    display: flex;
    flex-direction: column;
    align-items: center;

    animation:
        introAppear
        .8s
        ease
        forwards;
}


.introLogo {
    font-size: 34px;
    font-weight: 800;

    letter-spacing: 1px;

    color: #fff;
}


.introLine {
    width: 44px;
    height: 2px;

    margin: 16px 0 20px;

    background: #fff;

    opacity: .85;
}


.introTitle {
    font-size: 14px;
    font-weight: 600;

    letter-spacing: 4px;

    color: #eee;

    margin-bottom: 9px;
}


.introSubtitle {
    font-size: 12px;

    color: #888;

    letter-spacing: .7px;

    margin-bottom: 26px;
}


.loaderBar {
    position: relative;

    width: 190px;
    height: 2px;

    overflow: hidden;

    background: #333;

    border-radius: 10px;
}


.loaderProgress {
    position: absolute;

    width: 45%;
    height: 100%;

    left: -45%;

    background: #fff;

    animation:
        loadingMove
        1.2s
        ease-in-out
        infinite;
}


@keyframes loadingMove {

    0% {
        left: -45%;
    }

    100% {
        left: 100%;
    }
}


@keyframes introAppear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: absolute;

    background: #fff;

    overflow: hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 3px 8px rgba(0,0,0,.35);

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    cursor: pointer;

    z-index: 20;
}


#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}


#closedBook::before {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    left: 0;

    width: 9px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.20),
            rgba(0,0,0,.05),
            transparent
        );
}


#closedBook::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    right: 0;

    width: 7px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.14),
            transparent
        );
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: absolute;

    background: #fff;

    box-shadow:
        0 18px 45px rgba(0,0,0,.52);

    perspective: 2500px;

    transform-style: preserve-3d;

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    z-index: 10;
}


/* =========================================================
   STATIC PAGES
========================================================= */

.page {
    position: absolute;

    top: 0;

    overflow: hidden;

    background: #fff;
}


#leftPage {
    left: 0;
}


#rightPage {
    right: 0;
}


.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* left page inner shadow */

#leftPage::after {
    content: "";

    position: absolute;

    z-index: 10;

    top: 0;
    right: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* right page inner shadow */

#rightPage::after {
    content: "";

    position: absolute;

    z-index: 10;

    top: 0;
    left: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* =========================================================
   SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 50;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 16px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.13) 0%,
            rgba(0,0,0,.05) 25%,
            rgba(255,255,255,.18) 50%,
            rgba(0,0,0,.05) 75%,
            rgba(0,0,0,.13) 100%
        );
}


/* =========================================================
   FLIPPING PAGE
========================================================= */

#flipSheet {
    display: none;

    position: absolute;

    z-index: 100;

    top: 0;

    background: #fff;

    transform-style: preserve-3d;

    will-change: transform;
}


.flipFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: #fff;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


.flipFace canvas {
    display: block;

    width: 100%;
    height: 100%;
}


#flipBack {
    transform: rotateY(180deg);
}


#flipShade {
    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.02),
            rgba(0,0,0,.24)
        );
}


/* =========================================================
   NEXT PAGE
========================================================= */

#flipSheet.flip-next {
    left: 50%;

    transform-origin: left center;

    animation:
        flipNext
        400ms
        cubic-bezier(.45,.05,.20,1)
        forwards;
}


#flipSheet.flip-next #flipShade {
    animation:
        flipShade
        400ms
        ease-in-out
        forwards;
}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

#flipSheet.flip-prev {
    left: 0;

    transform-origin: right center;

    animation:
        flipPrev
        400ms
        cubic-bezier(.45,.05,.20,1)
        forwards;
}


#flipSheet.flip-prev #flipShade {
    animation:
        flipShade
        400ms
        ease-in-out
        forwards;
}


/* =========================================================
   PAGE FLIP ANIMATIONS
========================================================= */

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(-25deg);
    }

    45% {
        transform: rotateY(-72deg);
    }

    55% {
        transform: rotateY(-108deg);
    }

    80% {
        transform: rotateY(-155deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(25deg);
    }

    45% {
        transform: rotateY(72deg);
    }

    55% {
        transform: rotateY(108deg);
    }

    80% {
        transform: rotateY(155deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}


@keyframes flipShade {

    0% {
        opacity: 0;
    }

    30% {
        opacity: .16;
    }

    50% {
        opacity: .36;
    }

    70% {
        opacity: .16;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   THANK YOU SCREEN
========================================================= */

#thankYouScreen {
    display: none;

    position: absolute;

    inset: 0;

    z-index: 300;

    align-items: center;
    justify-content: center;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #191919 55%,
            #101010 100%
        );

    transition:
        opacity .55s ease;
}


#thankYouScreen.show {
    opacity: 1;
}


.thankYouContent {
    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}


.thankYouLogo {
    font-size: 34px;

    font-weight: 800;

    letter-spacing: 1px;

    color: #fff;
}


.thankYouLine {
    width: 44px;
    height: 2px;

    margin: 16px 0 25px;

    background: #fff;

    opacity: .85;
}


.thankYouTitle {
    font-size: 20px;

    font-weight: 600;

    letter-spacing: 5px;

    color: #fff;

    margin-bottom: 12px;
}


.thankYouText {
    font-size: 13px;

    color: #999;

    margin-bottom: 30px;
}


#restartCatalogue {
    width: auto;

    height: 40px;

    padding: 0 24px;

    border: 1px solid #666;

    border-radius: 5px;

    background: transparent;

    color: #fff;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}


#restartCatalogue:hover {
    background: #fff;

    color: #111;

    border-color: #fff;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 26px;

    background: #101010;

    border-top: 1px solid #333;
}


button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: #fff;

    font-size: 25px;

    cursor: pointer;
}


button:hover:not(:disabled) {
    background: #3b3b3b;
}


button:disabled {
    opacity: .25;

    cursor: default;
}


/* =========================================================
   PAGE SELECTOR
========================================================= */

#pageControl {
    min-width: 230px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    color: #ddd;

    font-size: 13px;
}


#pageLabel {
    color: #999;
}


#pageInput {
    width: 58px;
    height: 34px;

    padding: 0 6px;

    text-align: center;

    font-size: 14px;
    font-weight: 600;

    color: #fff;

    background: #202020;

    border: 1px solid #555;

    border-radius: 6px;

    outline: none;

    transition:
        border-color .2s ease,
        background .2s ease;
}


#pageInput:hover {
    border-color: #777;
}


#pageInput:focus {
    border-color: #aaa;

    background: #292929;
}


#pageTotal {
    min-width: 38px;

    text-align: left;
}


#pageInput::-webkit-inner-spin-button,
#pageInput::-webkit-outer-spin-button {
    -webkit-appearance: none;

    margin: 0;
}


#pageInput {
    -moz-appearance: textfield;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }


    footer {
        gap: 10px;
    }


    #pageControl {
        min-width: 145px;
    }


    #pageLabel {
        display: none;
    }


    .introLogo,
    .thankYouLogo {
        font-size: 28px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     MAIN STAGE
======================================================== -->

<div id="stage">


    <!-- ===================================================
         INTERSPORT INTRO
    ==================================================== -->

    <div id="loading">

        <div class="introBrand">

            <div class="introLogo">
                INTERSPORT
            </div>

            <div class="introLine"></div>

            <div class="introTitle">
                DIGITAL CATALOGUE
            </div>

            <div class="introSubtitle">
                Explore our latest collection
            </div>

            <div class="loaderBar">

                <div class="loaderProgress"></div>

            </div>

        </div>

    </div>


    <!-- ===================================================
         VIEWER
    ==================================================== -->

    <div id="viewer">


        <!-- CLOSED FRONT / BACK COVER -->

        <div id="closedBook">

            <canvas id="closedCanvas"></canvas>

        </div>


        <!-- OPEN BOOK -->

        <div id="openBook">


            <!-- LEFT PAGE -->

            <div
                id="leftPage"
                class="page"
            >

                <canvas id="leftCanvas"></canvas>

            </div>


            <!-- RIGHT PAGE -->

            <div
                id="rightPage"
                class="page"
            >

                <canvas id="rightCanvas"></canvas>

            </div>


            <!-- MOVING PAGE -->

            <div id="flipSheet">


                <div
                    id="flipFront"
                    class="flipFace"
                >

                    <canvas id="flipFrontCanvas"></canvas>

                </div>


                <div
                    id="flipBack"
                    class="flipFace"
                >

                    <canvas id="flipBackCanvas"></canvas>

                </div>


                <div id="flipShade"></div>


            </div>


            <div id="spine"></div>


        </div>


        <!-- =================================================
             THANK YOU
        ================================================== -->

        <div id="thankYouScreen">

            <div class="thankYouContent">


                <div class="thankYouLogo">
                    INTERSPORT
                </div>


                <div class="thankYouLine"></div>


                <div class="thankYouTitle">
                    THANK YOU
                </div>


                <div class="thankYouText">
                    Thank you for exploring our catalogue.
                </div>


                <button
                    id="restartCatalogue"
                    type="button"
                >
                    VIEW AGAIN
                </button>


            </div>

        </div>


    </div>

</div>


<!-- =======================================================
     FOOTER
======================================================== -->

<footer>


    <button
        id="prev"
        type="button"
        aria-label="Previous page"
    >
        ‹
    </button>


    <div id="pageControl">

        <span id="pageLabel">
            Page
        </span>


        <input
            id="pageInput"
            type="number"
            min="1"
            value="1"
            aria-label="Go to page"
        >


        <span id="pageTotal">
            / 0
        </span>

    </div>


    <button
        id="next"
        type="button"
        aria-label="Next page"
    >
        ›
    </button>


</footer>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
   PDF must be in the same folder.

   If you replace catalogue.pdf but keep the same name,
   change v=2 to v=3, v=4, etc.
*/

const PDF_FILE =
    "catalogue.pdf?v=2";


/* Interior page flip */

const TURN_TIME =
    400;


/* Cover/open/close transition */

const COVER_TIME =
    520;


/* Thank-you delay after back cover */

const END_DELAY =
    800;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");


const viewer =
    document.getElementById("viewer");


const loading =
    document.getElementById("loading");


const closedBook =
    document.getElementById("closedBook");


const closedCanvas =
    document.getElementById("closedCanvas");


const openBook =
    document.getElementById("openBook");


const leftPage =
    document.getElementById("leftPage");


const rightPage =
    document.getElementById("rightPage");


const leftCanvas =
    document.getElementById("leftCanvas");


const rightCanvas =
    document.getElementById("rightCanvas");


const flipSheet =
    document.getElementById("flipSheet");


const flipFrontCanvas =
    document.getElementById("flipFrontCanvas");


const flipBackCanvas =
    document.getElementById("flipBackCanvas");


const prevButton =
    document.getElementById("prev");


const nextButton =
    document.getElementById("next");


const pageInput =
    document.getElementById("pageInput");


const pageTotal =
    document.getElementById("pageTotal");


const pageLabel =
    document.getElementById("pageLabel");


const thankYouScreen =
    document.getElementById("thankYouScreen");


const restartCatalogue =
    document.getElementById("restartCatalogue");


/* =========================================================
   STATE
========================================================= */

let pdf =
    null;


let totalPages =
    0;


let pageRatio =
    1;


let displayWidth =
    0;


let displayHeight =
    0;


let leftPageNumber =
    2;


/*
   front
   open
   back
   thanks
*/

let mode =
    "front";


let isAnimating =
    false;


/* =========================================================
   HELPERS
========================================================= */

function wait(ms) {

    return new Promise(

        resolve =>
            setTimeout(
                resolve,
                ms
            )

    );

}


function nextFrame() {

    return new Promise(

        resolve =>

            requestAnimationFrame(

                () =>

                    requestAnimationFrame(
                        resolve
                    )

            )

    );

}


/* =========================================================
   PDF PAGE RATIO
========================================================= */

async function getPdfRatio() {

    const page =
        await pdf.getPage(1);


    const viewport =
        page.getViewport({

            scale: 1

        });


    pageRatio =
        viewport.width /
        viewport.height;

}


/* =========================================================
   SIZE
========================================================= */

function calculateSize() {

    const availableWidth =
        stage.clientWidth - 70;


    const availableHeight =
        stage.clientHeight - 40;


    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(

            availableHeight,

            heightFromWidth

        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(
            displayWidth
        );


    displayHeight =
        Math.floor(
            displayHeight
        );


    /* CLOSED BOOK */

    closedBook.style.width =
        displayWidth + "px";


    closedBook.style.height =
        displayHeight + "px";


    /* OPEN BOOK */

    openBook.style.width =
        (displayWidth * 2) + "px";


    openBook.style.height =
        displayHeight + "px";


    /* LEFT */

    leftPage.style.width =
        displayWidth + "px";


    leftPage.style.height =
        displayHeight + "px";


    /* RIGHT */

    rightPage.style.width =
        displayWidth + "px";


    rightPage.style.height =
        displayHeight + "px";


    /* MOVING PAGE */

    flipSheet.style.width =
        displayWidth + "px";


    flipSheet.style.height =
        displayHeight + "px";


    positionBooks();

}


/* =========================================================
   CENTER BOOK
========================================================= */

function positionBooks() {

    const centerX =
        viewer.clientWidth / 2;


    const centerY =
        viewer.clientHeight / 2;


    /* CLOSED SINGLE PAGE */

    closedBook.style.left =
        Math.round(

            centerX -
            displayWidth / 2

        ) + "px";


    closedBook.style.top =
        Math.round(

            centerY -
            displayHeight / 2

        ) + "px";


    /* OPEN TWO-PAGE BOOK */

    openBook.style.left =
        Math.round(

            centerX -
            displayWidth

        ) + "px";


    openBook.style.top =
        Math.round(

            centerY -
            displayHeight / 2

        ) + "px";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {

    if (

        pageNumber < 1 ||

        pageNumber > totalPages

    ) {

        clearCanvas(
            canvas
        );


        return;

    }


    const page =
        await pdf.getPage(
            pageNumber
        );


    const dpr =
        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    const baseViewport =
        page.getViewport({

            scale: 1

        });


    const scale =
        (
            displayWidth *
            dpr
        ) /
        baseViewport.width;


    const viewport =
        page.getViewport({

            scale: scale

        });


    canvas.width =
        Math.round(
            viewport.width
        );


    canvas.height =
        Math.round(
            viewport.height
        );


    canvas.style.width =
        displayWidth + "px";


    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;

}


/* =========================================================
   BLANK PAGE
========================================================= */

function clearCanvas(
    canvas
) {

    const dpr =
        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    canvas.width =
        Math.round(

            displayWidth *
            dpr

        );


    canvas.height =
        Math.round(

            displayHeight *
            dpr

        );


    canvas.style.width =
        displayWidth + "px";


    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

}


/* =========================================================
   RESET FLIP
========================================================= */

function resetFlip() {

    flipSheet.classList.remove(

        "flip-next",

        "flip-prev"

    );


    flipSheet.style.display =
        "none";


    flipSheet.style.transform =
        "";

}


/* =========================================================
   PAGE CONTROL
========================================================= */

function updatePageControl() {

    pageTotal.textContent =
        `/ ${totalPages}`;


    if (
        mode === "front"
    ) {

        pageLabel.textContent =
            "Page";


        pageInput.value =
            1;


        return;

    }


    if (
        mode === "back"
    ) {

        pageLabel.textContent =
            "Back";


        pageInput.value =
            totalPages;


        return;

    }


    if (
        mode === "thanks"
    ) {

        pageLabel.textContent =
            "Page";


        pageInput.value =
            totalPages;


        return;

    }


    pageLabel.textContent =
        "Page";


    pageInput.value =
        leftPageNumber;

}


/* =========================================================
   LAST SPREAD
========================================================= */

function getLastLeftPage() {

    let result;


    if (
        totalPages % 2 === 1
    ) {

        result =
            totalPages - 1;

    }

    else {

        result =
            totalPages;

    }


    if (
        result % 2 !== 0
    ) {

        result--;

    }


    return Math.max(

        2,

        result

    );

}


/* =========================================================
   RENDER SPREAD
========================================================= */

async function renderSpread(
    requestedLeft
) {

    requestedLeft =
        Math.max(

            2,

            requestedLeft

        );


    if (
        requestedLeft % 2 !== 0
    ) {

        requestedLeft--;

    }


    leftPageNumber =
        requestedLeft;


    await Promise.all([


        renderPage(

            leftPageNumber,

            leftCanvas

        ),


        renderPage(

            leftPageNumber + 1,

            rightCanvas

        )


    ]);


    updatePageControl();

}

/* =========================================================
   NEXT
========================================================= */

async function goNext() {

    if (
        isAnimating
    ) {

        return;

    }


    if (
        mode === "front"
    ) {

        await openFromFront();

        return;

    }


    if (
        mode === "back" ||
        mode === "thanks"
    ) {

        return;

    }


    const currentLeft =
        leftPageNumber;


    const currentRight =
        currentLeft + 1;


    const nextLeft =
        currentLeft + 2;


    const nextRight =
        currentLeft + 3;


    /*
       End of catalogue
    */

    if (
        nextLeft > totalPages
    ) {

        await closeToBack();

        return;

    }


    isAnimating =
        true;


    prevButton.disabled =
        true;


    nextButton.disabled =
        true;


    /*
       Moving page front:
       current right page.
    */

    await renderPage(

        currentRight,

        flipFrontCanvas

    );


    /*
       Moving page back:
       next left page.
    */

    await renderPage(

        nextLeft,

        flipBackCanvas

    );


    /*
       New right page underneath.
    */

    await renderPage(

        nextRight,

        rightCanvas

    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-next"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-next"
    );


    /*
       Change underlying left page
       slightly before halfway.
    */

    setTimeout(

        () => {

            renderPage(

                nextLeft,

                leftCanvas

            );

        },

        TURN_TIME * .48

    );


    await wait(
        TURN_TIME
    );


    leftPageNumber =
        nextLeft;


    resetFlip();


    updatePageControl();


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   PREVIOUS
========================================================= */

async function goPrevious() {

    if (
        isAnimating
    ) {

        return;

    }


    if (
        mode === "front" ||
        mode === "thanks"
    ) {

        return;

    }


    if (
        mode === "back"
    ) {

        await openFromBack();

        return;

    }


    if (
        leftPageNumber <= 2
    ) {

        await closeToFront();

        return;

    }


    isAnimating =
        true;


    prevButton.disabled =
        true;


    nextButton.disabled =
        true;


    const currentLeft =
        leftPageNumber;


    const previousLeft =
        currentLeft - 2;


    const previousRight =
        currentLeft - 1;


    await renderPage(

        currentLeft,

        flipFrontCanvas

    );


    await renderPage(

        previousRight,

        flipBackCanvas

    );


    await renderPage(

        previousLeft,

        leftCanvas

    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-prev"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-prev"
    );


    setTimeout(

        () => {

            renderPage(

                previousRight,

                rightCanvas

            );

        },

        TURN_TIME * .48

    );


    await wait(
        TURN_TIME
    );


    leftPageNumber =
        previousLeft;


    resetFlip();


    updatePageControl();


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   GO DIRECTLY TO PAGE
========================================================= */

async function goToPage(
    pageNumber
) {

    if (

        isAnimating ||

        !pdf ||

        mode === "thanks"

    ) {

        return;

    }


    pageNumber =
        parseInt(
            pageNumber,
            10
        );


    if (
        isNaN(pageNumber)
    ) {

        updatePageControl();

        return;

    }


    pageNumber =
        Math.max(

            1,

            Math.min(

                totalPages,

                pageNumber

            )

        );


    /*
       PAGE 1 = FRONT COVER
    */

    if (
        pageNumber === 1
    ) {

        await showFront();

        return;

    }


    /*
       Convert selected page to spread.

       2 -> 2 / 3
       3 -> 2 / 3
       4 -> 4 / 5
       5 -> 4 / 5
    */

    let spreadLeft =
        pageNumber;


    if (
        spreadLeft % 2 !== 0
    ) {

        spreadLeft--;

    }


    mode =
        "open";


    closedBook.style.display =
        "none";


    openBook.style.display =
        "block";


    await renderSpread(
        spreadLeft
    );


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;

}

========================================================= */

            event.key === "Enter"
        ) {

            event.preventDefault();


            await goToPage(
                pageInput.value
            );


            pageInput.blur();

        }

    }

);

    async () => {

        await goToPage(
            pageInput.value
        );

    }

);

   BUTTONS
========================================================= */

);


nextButton.addEventListener(

);

   CLICK CLOSED BOOK
========================================================= */

closedBook.addEventListener(

    "click",

    () => {

        if (
            mode === "front"
        ) {

            goNext();

        }

        else if (
            mode === "back"
        ) {

            goPrevious();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    event => {

        /*
           Don't change pages while user
           is typing a page number.
        */

        if (
            document.activeElement === pageInput
        ) {

            return;

        }


        if (
            event.key === "ArrowRight"
        ) {

            goNext();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            goPrevious();

        }

    }

);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(

    "resize",

    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(

                async () => {

                    if (

                        !pdf ||

                        isAnimating

                    ) {

                        return;

                    }


                    calculateSize();


                    if (
                        mode === "front"
                    ) {

                        await showFront();

                    }

                    else if (
                        mode === "back"
                    ) {

                        await showBack();

                    }

                    else if (
                        mode === "open"
                    ) {

                        await showSpread(
                            leftPageNumber
                        );

                    }

                },

                150

            );

    }

);


/* =========================================================
   START
========================================================= */

async function start() {

    try {


        pdf =

            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =
            pdf.numPages;


        pageInput.max =
            totalPages;


        pageTotal.textContent =
            `/ ${totalPages}`;


        await getPdfRatio();


        calculateSize();


        /*
           Render the front cover BEFORE
           removing the intro.
        */

        await showFront();


        /*
           Small pause so the intro feels intentional.
        */

        await wait(
            350
        );


        loading.classList.add(
            "hide"
        );


        setTimeout(

            () => {

                loading.style.display =
                    "none";

            },

            600

        );


    }

    catch(error) {


        console.error(
            error
        );


        loading.innerHTML =
            `
            <div style="
                text-align:center;
                color:#ddd;
                font-size:13px;
                line-height:1.7;
            ">
                <strong style="
                    font-size:18px;
                    color:#fff;
                ">
                    INTERSPORT
                </strong>
                <br>
                Could not load catalogue.pdf
            </div>
            `;

    }

}


start();
