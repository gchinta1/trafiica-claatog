<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}

/* =========================================================
   STAGE
========================================================= */

#stage {
    height: calc(100% - 54px);
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}

/* =========================================================
   BOOK
========================================================= */

#book {
    visibility: hidden;
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 14px;
    color: #ddd;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 54px;

    background: #101010;
    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}

/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 42px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;
    line-height: 30px;

    cursor: pointer;

    transition: background .15s ease;
}

button:hover {
    background: #3a3a3a;
}

button:active {
    background: #202020;
}

button:disabled {
    opacity: .35;
    cursor: default;
}

/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 200px;
    text-align: center;
    font-size: 13px;
    color: #ddd;
}
</style>
</head>

<body>

<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <div id="book"></div>

</div>

<footer>

    <button id="prev" aria-label="Previous page">
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button id="next" aria-label="Next page">
        ›
    </button>

</footer>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const book =
    document.getElementById("book");

const loading =
    document.getElementById("loading");

const count =
    document.getElementById("count");

const nextButton =
    document.getElementById("next");

const prevButton =
    document.getElementById("prev");


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

/*
 * Number of REAL PDF pages.
 */
let totalPdfPages = 0;

/*
 * Number of pages loaded into PageFlip.
 * This can be one larger than totalPdfPages if a blank page
 * is inserted before the back cover.
 */
let totalBookPages = 0;

let pageWidth = 0;
let pageHeight = 0;

/*
 * Index of the real PDF back cover inside PageFlip.
 */
let backCoverIndex = 0;

/*
 * True when we insert a blank page immediately before
 * the final PDF page.
 */
let hasInsertedBlank = false;


/* =========================================================
   CREATE BLANK PAGE
========================================================= */

function createBlankPage(width, height) {

    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const context =
        canvas.getContext("2d");

    context.fillStyle = "#ffffff";

    context.fillRect(
        0,
        0,
        width,
        height
    );

    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );
}


/* =========================================================
   START
========================================================= */

async function start() {

    /*
     * catalogue.pdf must be in the same folder
     * as this HTML file.
     */

    const pdf =
        await pdfjsLib
            .getDocument("catalogue.pdf")
            .promise;


    totalPdfPages =
        pdf.numPages;


    const images = [];

    let ratio = 0;

    let renderedWidth = 0;
    let renderedHeight = 0;


    /* =====================================================
       CONVERT PDF PAGES TO IMAGES
    ===================================================== */

    for (
        let n = 1;
        n <= totalPdfPages;
        n++
    ) {

        const page =
            await pdf.getPage(n);


        const viewport =
            page.getViewport({
                scale: 2
            });


        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement("canvas");


        canvas.width =
            Math.round(viewport.width);

        canvas.height =
            Math.round(viewport.height);


        renderedWidth =
            canvas.width;

        renderedHeight =
            canvas.height;


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        context.fillStyle =
            "#ffffff";

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext: context,

            viewport: viewport

        }).promise;


        images.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );

    }


    /* =====================================================
       FIX BOOK PAGE ORDER
    ===================================================== */

    /*
     * PageFlip with showCover:true works like a physical book:
     *
     * INDEX 0
     * FRONT COVER
     *
     * INDEX 1 + 2
     * first inside spread
     *
     * INDEX 3 + 4
     * second inside spread
     *
     * ...
     *
     * LAST INDEX
     * BACK COVER
     *
     *
     * Therefore the total number of PageFlip pages needs
     * to be EVEN:
     *
     * cover + inside pages + back cover.
     *
     * If the PDF contains an odd number of pages, we insert
     * ONE blank page immediately BEFORE the final PDF page.
     *
     * The final PDF page therefore ALWAYS remains the
     * physical back cover.
     */

    if (images.length % 2 !== 0) {

        const backCover =
            images.pop();

        const blank =
            createBlankPage(
                renderedWidth,
                renderedHeight
            );

        images.push(blank);

        images.push(backCover);

        hasInsertedBlank = true;

    }


    totalBookPages =
        images.length;


    backCoverIndex =
        totalBookPages - 1;


    /* =====================================================
       CALCULATE SIZE OF ONE PHYSICAL PAGE
    ===================================================== */

    /*
     * Size the book based on a full two-page spread.
     */

    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight * 0.90,

                (stage.clientWidth * 0.92) /
                (2 * ratio)

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                width:
                    pageWidth,

                height:
                    pageHeight,


                /*
                 * Keep the PDF page proportions.
                 */

                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,

                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /*
                 * CRITICAL:
                 *
                 * Page 1 becomes a SINGLE front cover.
                 *
                 * Last page becomes a SINGLE back cover.
                 */

                showCover:
                    true,


                /*
                 * Allows a closed book to occupy one page
                 * and an open book to occupy two pages.
                 */

                usePortrait:
                    true,


                autoSize:
                    true,


                drawShadow:
                    true,

                maxShadowOpacity:
                    0.55,


                flippingTime:
                    900,


                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                showPageCorners:
                    true,


                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD BOOK
    ===================================================== */

    flip.loadFromImages(
        images
    );


    /* =====================================================
       EVENTS
    ===================================================== */

    flip.on(
        "init",
        function () {

            updateBook();

        }
    );


    flip.on(
        "flip",
        function () {

            updateBook();

        }
    );


    flip.on(
        "changeOrientation",
        function () {

            updateBook();

        }
    );


    /* =====================================================
       SHOW
    ===================================================== */

    book.style.visibility =
        "visible";


    loading.style.display =
        "none";


    updateBook();

}


/* =========================================================
   CONVERT BOOK INDEX TO PDF PAGE
========================================================= */

function bookIndexToPdfPage(index) {

    /*
     * No blank was inserted:
     *
     * index 0 = PDF 1
     * index 1 = PDF 2
     * ...
     */

    if (!hasInsertedBlank) {

        return index + 1;

    }


    /*
     * If a blank was inserted, it is the page immediately
     * before the back cover.
     */

    const blankIndex =
        backCoverIndex - 1;


    if (index === blankIndex) {

        return null;

    }


    if (index < blankIndex) {

        return index + 1;

    }


    /*
     * Final PageFlip page = original final PDF page.
     */

    return totalPdfPages;

}


/* =========================================================
   UPDATE BOOK STATE
========================================================= */

function updateBook() {

    if (!flip) {
        return;
    }


    const index =
        flip.getCurrentPageIndex();


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (index <= 0) {

        count.textContent =
            `Front Cover · Page 1 / ${totalPdfPages}`;

        prevButton.disabled =
            true;

        nextButton.disabled =
            false;

        return;

    }


    /* =====================================================
       BACK COVER
    ===================================================== */

    if (index >= backCoverIndex) {

        count.textContent =
            `Back Cover · Page ${totalPdfPages} / ${totalPdfPages}`;

        prevButton.disabled =
            false;

        nextButton.disabled =
            true;

        return;

    }


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    /* =====================================================
       INSIDE SPREAD
    ===================================================== */

    /*
     * With showCover:true:
     *
     * index 1 = left page
     * index 2 = right page
     *
     * index 3 = left page
     * index 4 = right page
     *
     * etc.
     */

    let leftIndex;

    if (index % 2 === 1) {

        leftIndex =
            index;

    } else {

        leftIndex =
            index - 1;

    }


    const rightIndex =
        leftIndex + 1;


    const leftPdf =
        bookIndexToPdfPage(
            leftIndex
        );


    const rightPdf =
        bookIndexToPdfPage(
            rightIndex
        );


    /*
     * Do not include the physical back cover in an
     * inside-spread label.
     */

    if (
        rightIndex >= backCoverIndex
    ) {

        if (leftPdf !== null) {

            count.textContent =
                `Page ${leftPdf} / ${totalPdfPages}`;

        } else {

            count.textContent =
                "Inside Back Cover";

        }

        return;

    }


    /*
     * Blank page before back cover.
     */

    if (
        leftPdf === null &&
        rightPdf !== null
    ) {

        count.textContent =
            `Inside Cover · Page ${rightPdf} / ${totalPdfPages}`;

        return;

    }


    if (
        leftPdf !== null &&
        rightPdf === null
    ) {

        count.textContent =
            `Page ${leftPdf} / ${totalPdfPages} · Inside Cover`;

        return;

    }


    /*
     * Normal spread.
     */

    count.textContent =
        `Pages ${leftPdf}–${rightPdf} / ${totalPdfPages}`;

}


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    function () {

        if (!flip) {
            return;
        }

        flip.flipNext(
            "bottom"
        );

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(
    "click",
    function () {

        if (!flip) {
            return;
        }

        flip.flipPrev(
            "bottom"
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (!flip) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {

            flip.flipNext(
                "bottom"
            );

        }


        if (
            event.key === "ArrowLeft"
        ) {

            flip.flipPrev(
                "bottom"
            );

        }

    }
);


/* =========================================================
   LOAD
========================================================= */

start().catch(
    function (error) {

        console.error(error);

        loading.textContent =
            "Could not load catalogue.pdf";

    }
);

</script>

</body>
</html>
