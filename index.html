<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Catalogue</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;font-family:Arial,sans-serif;color:#eee}
#app{height:100%;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101010;border-bottom:1px solid #333}
.title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px}
button{border:1px solid #444;background:#292929;color:#fff;border-radius:6px;height:36px;min-width:38px;font-size:20px;cursor:pointer}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
background:radial-gradient(ellipse at center,#303030 0,#202020 48%,#121212 100%)}
#book{visibility:hidden}
.page{background:white;overflow:hidden}
.page img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
footer{height:54px;display:flex;align-items:center;justify-content:center;gap:15px;background:#101010;border-top:1px solid #333}
#counter{min-width:100px;text-align:center;font-size:13px}
footer button{font-size:25px}
@media(max-width:700px){.title{max-width:65vw;font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">Detection of Traffic Violations and Congestion Using Deep Learning</div>
  <div class="tools"><button id="full" title="Fullscreen">⛶</button></div>
</header>
<div id="stage">
  <div id="loading">Preparing pages…</div>
  <div id="book"></div>
</div>
<footer>
  <button id="prev">‹</button>
  <span id="counter">Page 1 / 13</span>
  <button id="next">›</button>
</footer>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const book=document.getElementById("book");
const loading=document.getElementById("loading");
const counter=document.getElementById("counter");
let flip,pdf,total=0;

async function makePages(){
  pdf=await pdfjsLib.getDocument("catalogue.pdf").promise;
  total=pdf.numPages;
  const first=await pdf.getPage(1);
  const v0=first.getViewport({scale:1});
  const ratio=v0.width/v0.height;

  // Render each PDF page to an image first. This avoids canvas/layout corruption while a sheet bends.
  const urls=[];
  for(let n=1;n<=total;n++){
    const p=await pdf.getPage(n);
    const vp=p.getViewport({scale:1.7});
    const c=document.createElement("canvas");
    c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    urls.push(c.toDataURL("image/jpeg",0.94));
  }

  // Add one blank page at the END only when needed so all inner views are true pairs.
  // 13 PDF pages -> 14 physical sheets => 7 complete two-page spreads.
  if(urls.length % 2 === 1){
    const c=document.createElement("canvas");
    c.width=1000; c.height=Math.round(1000/ratio);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
    urls.push(c.toDataURL("image/jpeg",0.92));
  }

  const stage=document.getElementById("stage");
  const maxH=stage.clientHeight*0.90;
  const maxBookW=stage.clientWidth*0.92;
  const pageH=Math.floor(Math.min(maxH,maxBookW/(2*ratio)));
  const pageW=Math.floor(pageH*ratio);

  flip=new St.PageFlip(book,{
    width:pageW,
    height:pageH,
    size:"fixed",
    drawShadow:true,
    flippingTime:900,
    usePortrait:false,
    autoSize:true,
    maxShadowOpacity:0.55,
    showCover:false,
    mobileScrollSupport:false,
    swipeDistance:20,
    useMouseEvents:true,
    showPageCorners:true,
    disableFlipByClick:false
  });

  // Image mode is deliberately used: the library owns the whole physical sheet during the flip.
  flip.loadFromImages(urls);
  flip.on("flip",e=>update(e.data));
  flip.on("init",e=>update(e.data.page ?? 0));
  book.style.visibility="visible";
  loading.style.display="none";
  update(0);
}

function update(i){
  // In landscape, index is the currently active physical page.
  const a=Math.min(i+1,total);
  const b=Math.min(i+2,total);
  if(i===0) counter.textContent=`Pages 1–2 / ${total}`;
  else if(a===b) counter.textContent=`Page ${a} / ${total}`;
  else counter.textContent=`Pages ${a}–${b} / ${total}`;
}
document.getElementById("prev").onclick=()=>flip&&flip.flipPrev("bottom");
document.getElementById("next").onclick=()=>flip&&flip.flipNext("bottom");
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"&&flip)flip.flipPrev("bottom");
 if(e.key==="ArrowRight"&&flip)flip.flipNext("bottom");
});
document.getElementById("full").onclick=async()=>{
 if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
 else await document.exitFullscreen();
};
makePages().catch(e=>{
 console.error(e);
 loading.textContent="Could not load catalogue.pdf";
});
</script>
</body>
</html>
