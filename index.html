<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    width: 100%;
    height: calc(100% - 54px);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}


/* =========================================================
   BOOK
========================================================= */

#book {
    visibility: hidden;
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 14px;
    color: #ddd;

    z-index: 10;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    width: 100%;
    height: 54px;

    background: #101010;

    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 42px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;
    line-height: 30px;

    cursor: pointer;

    transition:
        background .15s ease,
        opacity .15s ease;
}


button:hover:not(:disabled) {
    background: #3a3a3a;
}


button:active:not(:disabled) {
    background: #202020;
}


button:disabled {
    opacity: .30;
    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 210px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

</style>
</head>


<body>


<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <div id="book"></div>

</div>


<footer>

    <button
        id="prev"
        aria-label="Previous page"
    >
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button
        id="next"
        aria-label="Next page"
    >
        ›
    </button>

</footer>



<script>

/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const book =
    document.getElementById("book");

const loading =
    document.getElementById("loading");

const count =
    document.getElementById("count");

const nextButton =
    document.getElementById("next");

const prevButton =
    document.getElementById("prev");


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

let totalPdfPages = 0;

let totalBookPages = 0;

let pageWidth = 0;

let pageHeight = 0;


/* =========================================================
   CREATE WHITE BACK COVER
========================================================= */

function createBackCover(
    width,
    height
) {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    /*
     * White back cover.
     */

    context.fillStyle =
        "#ffffff";


    context.fillRect(
        0,
        0,
        width,
        height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );

}


/* =========================================================
   START
========================================================= */

async function start() {


    /* =====================================================
       LOAD PDF
    ===================================================== */

    const pdf =
        await pdfjsLib
            .getDocument(
                "catalogue.pdf"
            )
            .promise;


    totalPdfPages =
        pdf.numPages;


    const images = [];


    let ratio = 0;

    let renderedWidth = 0;

    let renderedHeight = 0;


    /* =====================================================
       RENDER ALL REAL PDF PAGES
    ===================================================== */

    for (
        let n = 1;
        n <= totalPdfPages;
        n++
    ) {


        const page =
            await pdf.getPage(n);


        /*
         * Higher scale =
         * better PDF quality.
         */

        const viewport =
            page.getViewport({
                scale: 2
            });


        /*
         * Calculate PDF aspect ratio
         * using first page.
         */

        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            Math.round(
                viewport.width
            );


        canvas.height =
            Math.round(
                viewport.height
            );


        renderedWidth =
            canvas.width;


        renderedHeight =
            canvas.height;


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
         * White page background.
         */

        context.fillStyle =
            "#ffffff";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * Render PDF page.
         */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /*
         * Convert PDF page into image.
         */

        images.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );

    }


    /* =====================================================
       ADD BACK COVER
    ===================================================== */

    /*
     * YOUR PDF:
     *
     * PDF 1
     * =
     * FRONT COVER
     *
     *
     * PDF 2 + 3
     * =
     * first open spread
     *
     * PDF 4 + 5
     *
     * PDF 6 + 7
     *
     * PDF 8 + 9
     *
     * PDF 10 + 11
     *
     * PDF 12 + 13
     * =
     * final open spread
     *
     *
     * EXTRA PAGE 14
     * =
     * BACK COVER
     */


    const backCover =
        createBackCover(
            renderedWidth,
            renderedHeight
        );


    images.push(
        backCover
    );


    totalBookPages =
        images.length;


    /* =====================================================
       CALCULATE PHYSICAL PAGE SIZE
    ===================================================== */

    /*
     * Calculate dimensions based on an
     * OPEN two-page book.
     */

    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight * 0.90,

                (
                    stage.clientWidth * 0.92
                )
                /
                (
                    2 * ratio
                )

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                /*
                 * ONE physical page.
                 */

                width:
                    pageWidth,

                height:
                    pageHeight,


                /*
                 * Fixed dimensions.
                 */

                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,


                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /*
                 * =================================================
                 * MOST IMPORTANT SETTING
                 * =================================================
                 *
                 * Page 1:
                 *
                 *      [ FRONT ]
                 *
                 *
                 * Then:
                 *
                 * [ 2 ][ 3 ]
                 *
                 * [ 4 ][ 5 ]
                 *
                 * ...
                 *
                 * [12 ][13 ]
                 *
                 *
                 * Last:
                 *
                 *      [ BACK ]
                 */

                showCover:
                    true,


                /*
                 * Keep desktop in proper
                 * two-page landscape mode.
                 */

                usePortrait:
                    false,


                /*
                 * PageFlip manages its own
                 * container.
                 */

                autoSize:
                    true,


                /*
                 * Book shadow.
                 */

                drawShadow:
                    true,


                maxShadowOpacity:
                    0.55,


                /*
                 * Flip animation.
                 */

                flippingTime:
                    900,


                /*
                 * Mouse.
                 */

                useMouseEvents:
                    true,


                /*
                 * Mobile.
                 */

                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                /*
                 * Page corners.
                 */

                showPageCorners:
                    true,


                /*
                 * Allow clicking pages
                 * to turn them.
                 */

                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD PAGES
    ===================================================== */

    flip.loadFromImages(
        images
    );


    /* =====================================================
       PAGEFLIP EVENTS
    ===================================================== */

    flip.on(
        "init",
        function () {

            updateBook();

        }
    );


    flip.on(
        "flip",
        function () {

            updateBook();

        }
    );


    flip.on(
        "changeOrientation",
        function () {

            updateBook();

        }
    );


    /* =====================================================
       SHOW BOOK
    ===================================================== */

    book.style.visibility =
        "visible";


    loading.style.display =
        "none";


    updateBook();

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateBook() {


    if (
        !flip ||
        !totalPdfPages
    ) {

        return;

    }


    /*
     * PageFlip uses zero-based indexes.
     *
     * 0  = PDF 1
     * 1  = PDF 2
     * 2  = PDF 3
     * ...
     * 12 = PDF 13
     * 13 = generated back cover
     */

    const index =
        flip.getCurrentPageIndex();


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (
        index <= 0
    ) {


        count.textContent =
            `Front Cover · Page 1 / ${totalPdfPages}`;


        prevButton.disabled =
            true;


        nextButton.disabled =
            false;


        return;

    }


    /* =====================================================
       GENERATED BACK COVER
    ===================================================== */

    if (
        index >= totalBookPages - 1
    ) {


        count.textContent =
            "Back Cover";


        prevButton.disabled =
            false;


        nextButton.disabled =
            true;


        return;

    }


    /* =====================================================
       NORMAL OPEN BOOK
    ===================================================== */

    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    /*
     * PageFlip structure with showCover:true:
     *
     * INDEX 1 = PDF 2 LEFT
     * INDEX 2 = PDF 3 RIGHT
     *
     * INDEX 3 = PDF 4 LEFT
     * INDEX 4 = PDF 5 RIGHT
     *
     * etc.
     */


    let leftIndex;


    if (
        index % 2 === 1
    ) {

        leftIndex =
            index;

    } else {

        leftIndex =
            index - 1;

    }


    const rightIndex =
        leftIndex + 1;


    /*
     * Convert PageFlip indexes
     * to PDF page numbers.
     */

    const leftPage =
        leftIndex + 1;


    const rightPage =
        rightIndex + 1;


    /*
     * Make sure generated back cover
     * is never displayed as a PDF number.
     */

    if (
        rightPage > totalPdfPages
    ) {


        count.textContent =
            `Page ${leftPage} / ${totalPdfPages}`;


        return;

    }


    count.textContent =
        `Pages ${leftPage}–${rightPage} / ${totalPdfPages}`;

}


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            nextButton.disabled
        ) {

            return;

        }


        flip.flipNext(
            "bottom"
        );

    }

);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            prevButton.disabled
        ) {

            return;

        }


        flip.flipPrev(
            "bottom"
        );

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function (event) {


        if (!flip) {

            return;

        }


        /* RIGHT */

        if (
            event.key ===
            "ArrowRight"
        ) {


            if (
                !nextButton.disabled
            ) {


                flip.flipNext(
                    "bottom"
                );

            }

        }


        /* LEFT */

        if (
            event.key ===
            "ArrowLeft"
        ) {


            if (
                !prevButton.disabled
            ) {


                flip.flipPrev(
                    "bottom"
                );

            }

        }

    }

);


/* =========================================================
   LOAD
========================================================= */

start().catch(

    function (error) {


        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";

    }

);

</script>


</body>
</html>
