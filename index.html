<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #181818;

    font-family: Arial, sans-serif;
    color: white;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    position: relative;

    width: 100%;
    height: calc(100vh - 58px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #151515 100%
        );
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;

    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 15px;
    color: #ddd;
}


/* =========================================================
   VIEWER
========================================================= */

#viewer {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: relative;

    background: white;

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 2px 5px rgba(0,0,0,.35);

    transform-origin: center center;

    animation: closedAppear .25s ease;
}


#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* =========================================================
   CLOSED BOOK DEPTH
========================================================= */

#closedBook::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 8px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.22),
            rgba(255,255,255,.08)
        );
}


@keyframes closedAppear {

    from {
        opacity: .75;
        transform: scale(.99);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: relative;

    align-items: stretch;
    justify-content: center;

    background: transparent;

    box-shadow:
        0 18px 45px rgba(0,0,0,.50);

    perspective: 2200px;

    transform-style: preserve-3d;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    position: relative;

    overflow: hidden;

    flex: 0 0 auto;

    background: white;

    backface-visibility: hidden;

    transform-style: preserve-3d;
}


/* =========================================================
   PAGE CANVAS
========================================================= */

.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* =========================================================
   LEFT PAGE
========================================================= */

#leftPage {
    box-shadow:
        inset -14px 0 22px -18px rgba(0,0,0,.85);
}


/* =========================================================
   RIGHT PAGE
========================================================= */

#rightPage {
    box-shadow:
        inset 14px 0 22px -18px rgba(0,0,0,.85);
}


/* =========================================================
   CENTER SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 20;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 22px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,

            rgba(0,0,0,.16) 0%,

            rgba(0,0,0,.08) 22%,

            rgba(255,255,255,.15) 47%,

            rgba(0,0,0,.06) 70%,

            rgba(0,0,0,.16) 100%
        );
}


/* =========================================================
   NEXT PAGE TURN

   RIGHT PAGE -> LEFT
========================================================= */

#rightPage.turning-next {
    z-index: 50;

    transform-origin: left center;

    animation:
        pageTurnNext
        700ms
        cubic-bezier(.42,.05,.20,1)
        forwards;
}


@keyframes pageTurnNext {

    0% {

        transform:
            rotateY(0deg);

        filter:
            brightness(1);

        box-shadow:
            0 0 0 rgba(0,0,0,0);
    }


    20% {

        transform:
            rotateY(-28deg);

        filter:
            brightness(.98);

        box-shadow:
            -10px 4px 18px rgba(0,0,0,.12);
    }


    45% {

        transform:
            rotateY(-72deg);

        filter:
            brightness(.90);

        box-shadow:
            -22px 5px 30px rgba(0,0,0,.26);
    }


    55% {

        transform:
            rotateY(-95deg);

        filter:
            brightness(.86);

        box-shadow:
            -28px 5px 35px rgba(0,0,0,.32);
    }


    78% {

        transform:
            rotateY(-145deg);

        filter:
            brightness(.94);

        box-shadow:
            -12px 3px 20px rgba(0,0,0,.18);
    }


    100% {

        transform:
            rotateY(-180deg);

        filter:
            brightness(1);

        box-shadow:
            0 0 0 rgba(0,0,0,0);
    }
}


/* =========================================================
   PREVIOUS PAGE TURN

   LEFT PAGE -> RIGHT
========================================================= */

#leftPage.turning-prev {
    z-index: 50;

    transform-origin: right center;

    animation:
        pageTurnPrev
        700ms
        cubic-bezier(.42,.05,.20,1)
        forwards;
}


@keyframes pageTurnPrev {

    0% {

        transform:
            rotateY(0deg);

        filter:
            brightness(1);

        box-shadow:
            0 0 0 rgba(0,0,0,0);
    }


    20% {

        transform:
            rotateY(28deg);

        filter:
            brightness(.98);

        box-shadow:
            10px 4px 18px rgba(0,0,0,.12);
    }


    45% {

        transform:
            rotateY(72deg);

        filter:
            brightness(.90);

        box-shadow:
            22px 5px 30px rgba(0,0,0,.26);
    }


    55% {

        transform:
            rotateY(95deg);

        filter:
            brightness(.86);

        box-shadow:
            28px 5px 35px rgba(0,0,0,.32);
    }


    78% {

        transform:
            rotateY(145deg);

        filter:
            brightness(.94);

        box-shadow:
            12px 3px 20px rgba(0,0,0,.18);
    }


    100% {

        transform:
            rotateY(180deg);

        filter:
            brightness(1);

        box-shadow:
            0 0 0 rgba(0,0,0,0);
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 28px;

    background: #101010;

    border-top: 1px solid #333;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: white;

    font-size: 25px;

    cursor: pointer;

    transition:
        background .15s ease,
        opacity .15s ease;
}


button:hover:not(:disabled) {
    background: #3b3b3b;
}


button:active:not(:disabled) {
    background: #222;
}


button:disabled {
    opacity: .25;

    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#counter {
    min-width: 230px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }

    #counter {
        min-width: 150px;
    }

    footer {
        gap: 12px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     STAGE
======================================================== -->

<div id="stage">


    <div id="loading">
        Loading catalogue...
    </div>


    <div id="viewer">


        <!-- =================================================
             CLOSED BOOK
        ================================================== -->

        <div id="closedBook">

            <canvas id="closedCanvas"></canvas>

        </div>


        <!-- =================================================
             OPEN BOOK
        ================================================== -->

        <div id="openBook">


            <!-- LEFT PAGE -->

            <div
                id="leftPage"
                class="page"
            >

                <canvas id="leftCanvas"></canvas>

            </div>


            <!-- RIGHT PAGE -->

            <div
                id="rightPage"
                class="page"
            >

                <canvas id="rightCanvas"></canvas>

            </div>


            <!-- CENTER -->

            <div id="spine"></div>


        </div>


    </div>

</div>


<!-- =======================================================
     CONTROLS
======================================================== -->

<footer>


    <button
        id="prev"
        type="button"
        aria-label="Previous"
    >
        ‹
    </button>


    <div id="counter">
        Loading...
    </div>


    <button
        id="next"
        type="button"
        aria-label="Next"
    >
        ›
    </button>


</footer>


<script>

/* =========================================================
   CONFIG
========================================================= */

const PDF_FILE =
    "catalogue.pdf";


const TURN_TIME =
    700;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =

    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");


const loading =
    document.getElementById("loading");


const closedBook =
    document.getElementById("closedBook");


const closedCanvas =
    document.getElementById("closedCanvas");


const openBook =
    document.getElementById("openBook");


const leftPage =
    document.getElementById("leftPage");


const rightPage =
    document.getElementById("rightPage");


const leftCanvas =
    document.getElementById("leftCanvas");


const rightCanvas =
    document.getElementById("rightCanvas");


const prevButton =
    document.getElementById("prev");


const nextButton =
    document.getElementById("next");


const counter =
    document.getElementById("counter");


/* =========================================================
   STATE
========================================================= */

let pdf = null;


let totalPages = 0;


let pageRatio = 1;


let displayWidth = 0;


let displayHeight = 0;


/*
    front
    open
    back
*/

let mode =
    "front";


/*
    Current LEFT PDF page.

    2 -> pages 2 + 3
    4 -> pages 4 + 5
    6 -> pages 6 + 7
*/

let leftPageNumber =
    2;


/*
    Prevent double-clicks while a page is moving.
*/

let isAnimating =
    false;


/* =========================================================
   GET PDF RATIO
========================================================= */

async function getPdfRatio() {


    const firstPage =

        await pdf.getPage(1);


    const viewport =

        firstPage.getViewport({

            scale: 1

        });


    pageRatio =

        viewport.width /
        viewport.height;

}


/* =========================================================
   CALCULATE SIZE
========================================================= */

function calculateSize() {


    const availableWidth =

        stage.clientWidth - 60;


    const availableHeight =

        stage.clientHeight - 40;


    /*
        TWO COMPLETE PAGES must fit.

        No cropping.
        No zoom.
    */

    const heightFromWidth =

        availableWidth /
        (
            2 * pageRatio
        );


    displayHeight =

        Math.min(

            availableHeight,

            heightFromWidth

        );


    displayWidth =

        displayHeight *
        pageRatio;


    displayWidth =

        Math.floor(
            displayWidth
        );


    displayHeight =

        Math.floor(
            displayHeight
        );


    /* =====================================================
       CLOSED BOOK
    ===================================================== */

    closedBook.style.width =

        displayWidth + "px";


    closedBook.style.height =

        displayHeight + "px";


    /* =====================================================
       OPEN BOOK
    ===================================================== */

    openBook.style.width =

        (
            displayWidth * 2
        ) + "px";


    openBook.style.height =

        displayHeight + "px";


    /* =====================================================
       LEFT PAGE
    ===================================================== */

    leftPage.style.width =

        displayWidth + "px";


    leftPage.style.height =

        displayHeight + "px";


    /* =====================================================
       RIGHT PAGE
    ===================================================== */

    rightPage.style.width =

        displayWidth + "px";


    rightPage.style.height =

        displayHeight + "px";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {


    if (

        pageNumber < 1 ||

        pageNumber > totalPages

    ) {


        clearCanvas(
            canvas
        );


        return;

    }


    const page =

        await pdf.getPage(
            pageNumber
        );


    /*
        Maximum DPR = 2.

        Keeps text sharp without creating enormous canvases.
    */

    const dpr =

        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    const baseViewport =

        page.getViewport({

            scale: 1

        });


    /*
        Scale based ONLY on page width.

        Therefore the COMPLETE page keeps its
        original PDF aspect ratio.
    */

    const renderScale =

        (
            displayWidth *
            dpr
        ) /

        baseViewport.width;


    const viewport =

        page.getViewport({

            scale: renderScale

        });


    canvas.width =

        Math.round(
            viewport.width
        );


    canvas.height =

        Math.round(
            viewport.height
        );


    canvas.style.width =

        displayWidth + "px";


    canvas.style.height =

        displayHeight + "px";


    const ctx =

        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    /* White background */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    /* Render complete PDF page */

    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;

}


/* =========================================================
   CLEAR PAGE
========================================================= */

function clearCanvas(
    canvas
) {


    const dpr =

        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    canvas.width =

        Math.round(

            displayWidth *
            dpr

        );


    canvas.height =

        Math.round(

            displayHeight *
            dpr

        );


    canvas.style.width =

        displayWidth + "px";


    canvas.style.height =

        displayHeight + "px";


    const ctx =

        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =

        "#ffffff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

}


/* =========================================================
   CLEAN ANIMATION CLASSES
========================================================= */

function cleanAnimations() {


    rightPage.classList.remove(
        "turning-next"
    );


    leftPage.classList.remove(
        "turning-prev"
    );


    /*
        Reset transforms explicitly.
    */

    rightPage.style.transform =
        "";


    leftPage.style.transform =
        "";

}


/* =========================================================
   FRONT COVER
========================================================= */

async function showFront() {


    cleanAnimations();


    mode =
        "front";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    await renderPage(

        1,

        closedCanvas

    );


    counter.textContent =

        `Front Cover · Page 1 / ${totalPages}`;


    prevButton.disabled =
        true;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   OPEN SPREAD
========================================================= */

async function showSpread(
    requestedLeftPage
) {


    cleanAnimations();


    mode =
        "open";


    requestedLeftPage =

        Math.max(

            2,

            requestedLeftPage

        );


    /*
        Left side must always be:

        2
        4
        6
        8
        ...
    */

    if (

        requestedLeftPage % 2 !== 0

    ) {


        requestedLeftPage--;

    }


    leftPageNumber =

        requestedLeftPage;


    closedBook.style.display =

        "none";


    openBook.style.display =

        "flex";


    /* =====================================================
       RENDER BOTH COMPLETE PAGES
    ===================================================== */

    await Promise.all([


        renderPage(

            leftPageNumber,

            leftCanvas

        ),


        renderPage(

            leftPageNumber + 1,

            rightCanvas

        )


    ]);


    /* =====================================================
       COUNTER
    ===================================================== */

    if (

        leftPageNumber + 1 <=
        totalPages

    ) {


        counter.textContent =

            `Pages ${leftPageNumber}–${leftPageNumber + 1} / ${totalPages}`;


    }

    else {


        counter.textContent =

            `Page ${leftPageNumber} / ${totalPages}`;

    }


    prevButton.disabled =

        false;


    nextButton.disabled =

        false;


    isAnimating =

        false;

}


/* =========================================================
   BACK COVER
========================================================= */

function showBack() {


    cleanAnimations();


    mode =
        "back";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    /*
        WHITE BACK COVER
    */

    clearCanvas(
        closedCanvas
    );


    counter.textContent =
        "Back Cover";


    /*
        LEFT MUST STILL WORK.
    */

    prevButton.disabled =
        false;


    nextButton.disabled =
        true;


    isAnimating =
        false;

}


/* =========================================================
   GET LAST LEFT PAGE
========================================================= */

function getLastLeftPage() {


    let lastLeft;


    /*
        Example:

        13 PDF pages

        final spread = 12 + 13
    */

    if (

        totalPages % 2 === 1

    ) {


        lastLeft =

            totalPages - 1;


    }

    else {


        lastLeft =

            totalPages;

    }


    if (

        lastLeft % 2 !== 0

    ) {


        lastLeft--;

    }


    return Math.max(

        2,

        lastLeft

    );

}


/* =========================================================
   NEXT
========================================================= */

async function goNext() {


    if (
        isAnimating
    ) {

        return;

    }


    /* =====================================================
       FRONT -> FIRST SPREAD
    ===================================================== */

    if (

        mode === "front"

    ) {


        isAnimating =
            true;


        await showSpread(
            2
        );


        return;

    }


    /* =====================================================
       BACK
    ===================================================== */

    if (

        mode === "back"

    ) {


        return;

    }


    const nextLeft =

        leftPageNumber + 2;


    /* =====================================================
       LAST SPREAD -> BACK COVER
    ===================================================== */

    if (

        nextLeft >
        totalPages

    ) {


        isAnimating =
            true;


        /*
            Animate last right page first.
        */

        rightPage.classList.remove(
            "turning-next"
        );


        void rightPage.offsetWidth;


        rightPage.classList.add(
            "turning-next"
        );


        setTimeout(

            function() {


                showBack();


            },

            TURN_TIME - 80

        );


        return;

    }


    /* =====================================================
       NORMAL NEXT PAGE TURN
    ===================================================== */

    isAnimating =
        true;


    rightPage.classList.remove(
        "turning-next"
    );


    void rightPage.offsetWidth;


    rightPage.classList.add(
        "turning-next"
    );


    /*
        Wait until the page has almost completed
        the rotation.
    */

    setTimeout(

        async function() {


            await showSpread(
                nextLeft
            );


        },

        TURN_TIME - 80

    );

}


/* =========================================================
   PREVIOUS
========================================================= */

async function goPrevious() {


    if (
        isAnimating
    ) {

        return;

    }


    /* =====================================================
       FRONT
    ===================================================== */

    if (

        mode === "front"

    ) {


        return;

    }


    /* =====================================================
       BACK -> LAST OPEN SPREAD
    ===================================================== */

    if (

        mode === "back"

    ) {


        isAnimating =
            true;


        const lastLeft =

            getLastLeftPage();


        await showSpread(
            lastLeft
        );


        return;

    }


    /* =====================================================
       FIRST SPREAD -> FRONT
    ===================================================== */

    if (

        leftPageNumber <= 2

    ) {


        isAnimating =
            true;


        leftPage.classList.remove(
            "turning-prev"
        );


        void leftPage.offsetWidth;


        leftPage.classList.add(
            "turning-prev"
        );


        setTimeout(

            async function() {


                await showFront();


            },

            TURN_TIME - 80

        );


        return;

    }


    /* =====================================================
       NORMAL PREVIOUS
    ===================================================== */

    const previousLeft =

        leftPageNumber - 2;


    isAnimating =
        true;


    leftPage.classList.remove(
        "turning-prev"
    );


    void leftPage.offsetWidth;


    leftPage.classList.add(
        "turning-prev"
    );


    setTimeout(

        async function() {


            await showSpread(
                previousLeft
            );


        },

        TURN_TIME - 80

    );

}


/* =========================================================
   BUTTONS
========================================================= */

prevButton.addEventListener(

    "click",

    function(event) {


        event.preventDefault();


        goPrevious();

    }

);


nextButton.addEventListener(

    "click",

    function(event) {


        event.preventDefault();


        goNext();

    }

);


/* =========================================================
   CLICK COVER
========================================================= */

closedBook.addEventListener(

    "click",

    function() {


        if (

            mode === "front"

        ) {


            goNext();


        }

        else if (

            mode === "back"

        ) {


            goPrevious();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key ===
            "ArrowRight"

        ) {


            goNext();

        }


        if (

            event.key ===
            "ArrowLeft"

        ) {


            goPrevious();

        }

    }

);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(

    "resize",

    function() {


        clearTimeout(
            resizeTimer
        );


        resizeTimer =

            setTimeout(

                async function() {


                    if (
                        !pdf
                    ) {

                        return;

                    }


                    calculateSize();


                    if (

                        mode === "front"

                    ) {


                        await showFront();


                    }

                    else if (

                        mode === "back"

                    ) {


                        showBack();


                    }

                    else {


                        await showSpread(
                            leftPageNumber
                        );

                    }


                },

                150

            );

    }

);


/* =========================================================
   START
========================================================= */

async function start() {


    try {


        pdf =

            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =

            pdf.numPages;


        await getPdfRatio();


        calculateSize();


        loading.style.display =

            "none";


        await showFront();


    }

    catch(error) {


        console.error(
            error
        );


        loading.textContent =

            "Could not load catalogue.pdf";

    }

}


start();

</script>

</body>

</html>
