<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    height: calc(100% - 54px);
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}


/* =========================================================
   BOOK
========================================================= */

#book {
    visibility: hidden;

    /*
     * This transform is changed automatically depending
     * on whether the book is:
     *
     * front cover
     * open
     * back cover
     */

    transition: transform 0.30s ease;
}


/*
 * FRONT COVER
 *
 * PageFlip keeps the cover on the RIGHT side of its
 * two-page container.
 *
 * Move the complete PageFlip container LEFT by half
 * one page so the visible cover is centered.
 */

#book.front-closed {
    transform:
        translateX(
            calc(-1 * var(--half-page))
        );
}


/*
 * OPEN BOOK
 *
 * Normal two-page spread.
 */

#book.book-open {
    transform:
        translateX(0);
}


/*
 * BACK COVER
 *
 * Back cover sits on the LEFT side.
 *
 * Move the complete container RIGHT by half one page
 * so the visible back cover is centered.
 */

#book.back-closed {
    transform:
        translateX(
            var(--half-page)
        );
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 14px;

    color: #ddd;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 54px;

    background: #101010;

    border-top:
        1px solid #333;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 42px;
    height: 38px;

    border:
        1px solid #444;

    border-radius: 6px;

    background: #292929;

    color: #fff;

    font-size: 24px;

    line-height: 30px;

    cursor: pointer;

    transition:
        background .15s ease,
        opacity .15s ease;
}


button:hover:not(:disabled) {
    background: #3a3a3a;
}


button:active:not(:disabled) {
    background: #202020;
}


button:disabled {
    opacity: .30;
    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 220px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

</style>
</head>


<body>


<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <div id="book"></div>

</div>


<footer>

    <button
        id="prev"
        aria-label="Previous page"
    >
        ‹
    </button>


    <span id="count">
        Front Cover
    </span>


    <button
        id="next"
        aria-label="Next page"
    >
        ›
    </button>

</footer>



<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );


const book =
    document.getElementById(
        "book"
    );


const loading =
    document.getElementById(
        "loading"
    );


const count =
    document.getElementById(
        "count"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;


/*
 * Number of REAL PDF pages.
 */

let totalPdfPages = 0;


/*
 * Number of pages actually given to PageFlip.
 */

let totalBookPages = 0;


/*
 * Dimensions of one physical page.
 */

let pageWidth = 0;

let pageHeight = 0;


/*
 * PageFlip index of physical back cover.
 */

let backCoverIndex = 0;


/*
 * We may need to insert one blank inside page
 * to keep the physical book structure correct.
 */

let insertedBlank = false;

let blankIndex = -1;


/* =========================================================
   CREATE BLANK PAGE
========================================================= */

function createBlankPage(
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext(
            "2d"
        );


    context.fillStyle =
        "#ffffff";


    context.fillRect(
        0,
        0,
        width,
        height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );

}


/* =========================================================
   START
========================================================= */

async function start() {


    /* =====================================================
       LOAD PDF
    ===================================================== */

    const pdf =
        await pdfjsLib
            .getDocument(
                "catalogue.pdf"
            )
            .promise;


    totalPdfPages =
        pdf.numPages;


    /*
     * A physical book needs at least:
     *
     * page 1 = front
     * page 2 = back
     */

    if (totalPdfPages < 2) {

        throw new Error(
            "The PDF needs at least 2 pages."
        );

    }


    const originalImages = [];


    let ratio = 0;

    let renderedWidth = 0;

    let renderedHeight = 0;


    /* =====================================================
       RENDER PDF
    ===================================================== */

    for (
        let n = 1;
        n <= totalPdfPages;
        n++
    ) {


        const page =
            await pdf.getPage(
                n
            );


        /*
         * Scale 2 gives a good balance between
         * quality and loading time.
         */

        const viewport =
            page.getViewport({
                scale: 2
            });


        /*
         * Get page aspect ratio.
         */

        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            Math.round(
                viewport.width
            );


        canvas.height =
            Math.round(
                viewport.height
            );


        renderedWidth =
            canvas.width;


        renderedHeight =
            canvas.height;


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
         * White PDF background.
         */

        context.fillStyle =
            "#ffffff";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /*
         * Convert PDF page to image.
         */

        originalImages.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );

    }


    /* =====================================================
       BUILD PHYSICAL BOOK
    ===================================================== */

    /*
     * IMPORTANT:
     *
     * PDF PAGE 1
     * =
     * FRONT COVER
     *
     *
     * PDF PAGE 2...
     * =
     * INSIDE PAGES
     *
     *
     * FINAL PDF PAGE
     * =
     * BACK COVER
     */


    const frontCover =
        originalImages[0];


    const backCover =
        originalImages[
            originalImages.length - 1
        ];


    let insidePages =
        originalImages.slice(
            1,
            -1
        );


    /*
     * Inside pages must form complete
     * LEFT + RIGHT spreads.
     *
     *
     * Example:
     *
     * FRONT
     *
     * 2 | 3
     * 4 | 5
     * 6 | 7
     *
     * BACK
     *
     *
     * If there is an odd number of inside pages,
     * insert a blank immediately BEFORE the final
     * inside page.
     *
     * This prevents a blank page appearing after
     * the final content page.
     */


    if (
        insidePages.length % 2 !== 0
    ) {


        const blank =
            createBlankPage(
                renderedWidth,
                renderedHeight
            );


        /*
         * Put blank before last inside page.
         */

        const insertPosition =
            Math.max(
                0,
                insidePages.length - 1
            );


        insidePages.splice(
            insertPosition,
            0,
            blank
        );


        insertedBlank =
            true;


        /*
         * +1 because PageFlip index 0
         * is the front cover.
         */

        blankIndex =
            insertPosition + 1;

    }


    /*
     * Final PageFlip pages.
     */

    const images = [

        frontCover,

        ...insidePages,

        backCover

    ];


    totalBookPages =
        images.length;


    backCoverIndex =
        totalBookPages - 1;


    /* =====================================================
       CALCULATE BOOK SIZE
    ===================================================== */

    /*
     * Calculate using a TWO-PAGE spread.
     *
     * The open book should fit inside the screen.
     */


    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight
                    * 0.90,

                (
                    stage.clientWidth
                    * 0.92
                )
                /
                (
                    2 * ratio
                )

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /*
     * Used to center front/back cover.
     */

    book.style.setProperty(

        "--half-page",

        `${pageWidth / 2}px`

    );


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {


                /* ONE PAGE */

                width:
                    pageWidth,

                height:
                    pageHeight,


                /* FIXED SIZE */

                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,

                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /* =========================================
                   CRITICAL BOOK SETTING
                ========================================= */

                /*
                 * TRUE means:
                 *
                 * FIRST PAGE =
                 * single front cover
                 *
                 * LAST PAGE =
                 * single back cover
                 */

                showCover:
                    true,


                /*
                 * Allow closed/open presentation.
                 */

                usePortrait:
                    true,


                /*
                 * Automatically size PageFlip container.
                 */

                autoSize:
                    true,


                /* SHADOW */

                drawShadow:
                    true,


                maxShadowOpacity:
                    0.55,


                /* FLIP SPEED */

                flippingTime:
                    900,


                /* MOUSE */

                useMouseEvents:
                    true,


                /* MOBILE */

                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                /* CORNERS */

                showPageCorners:
                    true,


                /*
                 * Clicking a page turns it.
                 */

                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD IMAGES
    ===================================================== */

    flip.loadFromImages(
        images
    );


    /* =====================================================
       EVENTS
    ===================================================== */

    flip.on(
        "init",
        function () {

            updateBook();

        }
    );


    flip.on(
        "flip",
        function () {

            updateBook();

        }
    );


    flip.on(
        "changeOrientation",
        function () {

            updateBook();

        }
    );


    /* =====================================================
       SHOW BOOK
    ===================================================== */

    book.style.visibility =
        "visible";


    loading.style.display =
        "none";


    updateBook();

}


/* =========================================================
   PAGEFLIP INDEX -> REAL PDF PAGE
========================================================= */

function bookIndexToPdfPage(
    index
) {


    /*
     * No inserted blank.
     */

    if (!insertedBlank) {

        return index + 1;

    }


    /*
     * This is the artificial blank.
     */

    if (
        index === blankIndex
    ) {

        return null;

    }


    /*
     * Before blank:
     * index 0 = PDF 1
     * index 1 = PDF 2
     * etc.
     */

    if (
        index < blankIndex
    ) {

        return index + 1;

    }


    /*
     * After blank, compensate by -1.
     */

    return index;

}


/* =========================================================
   CENTER FRONT / OPEN / BACK
========================================================= */

function updateBookPosition() {


    if (!flip) {

        return;

    }


    const index =
        flip.getCurrentPageIndex();


    /*
     * Remove previous state.
     */

    book.classList.remove(

        "front-closed",

        "book-open",

        "back-closed"

    );


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (
        index <= 0
    ) {


        book.classList.add(
            "front-closed"
        );


        return;

    }


    /* =====================================================
       BACK COVER
    ===================================================== */

    if (
        index >= backCoverIndex
    ) {


        book.classList.add(
            "back-closed"
        );


        return;

    }


    /* =====================================================
       OPEN BOOK
    ===================================================== */

    book.classList.add(
        "book-open"
    );

}


/* =========================================================
   UPDATE COUNTER + POSITION
========================================================= */

function updateBook() {


    if (
        !flip ||
        !totalPdfPages
    ) {

        return;

    }


    const index =
        flip.getCurrentPageIndex();


    /*
     * Update physical position first.
     */

    updateBookPosition();


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (
        index <= 0
    ) {


        count.textContent =
            `Front Cover · Page 1 / ${totalPdfPages}`;


        prevButton.disabled =
            true;


        nextButton.disabled =
            false;


        return;

    }


    /* =====================================================
       BACK COVER
    ===================================================== */

    if (
        index >= backCoverIndex
    ) {


        count.textContent =
            `Back Cover · Page ${totalPdfPages} / ${totalPdfPages}`;


        prevButton.disabled =
            false;


        nextButton.disabled =
            true;


        return;

    }


    /*
     * Normal open book.
     */

    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    /* =====================================================
       FIND LEFT PAGE OF CURRENT SPREAD
    ===================================================== */

    let leftIndex;


    /*
     * With showCover:true:
     *
     * 1 = LEFT
     * 2 = RIGHT
     *
     * 3 = LEFT
     * 4 = RIGHT
     *
     * etc.
     */


    if (
        index % 2 === 1
    ) {


        leftIndex =
            index;


    } else {


        leftIndex =
            index - 1;

    }


    const rightIndex =
        leftIndex + 1;


    const leftPdf =
        bookIndexToPdfPage(
            leftIndex
        );


    const rightPdf =
        bookIndexToPdfPage(
            rightIndex
        );


    /* =====================================================
       COUNTER
    ===================================================== */


    if (
        leftPdf === null &&
        rightPdf !== null
    ) {


        count.textContent =
            `Page ${rightPdf} / ${totalPdfPages}`;


        return;

    }


    if (
        leftPdf !== null &&
        rightPdf === null
    ) {


        count.textContent =
            `Page ${leftPdf} / ${totalPdfPages}`;


        return;

    }


    if (
        leftPdf !== null &&
        rightPdf !== null
    ) {


        count.textContent =
            `Pages ${leftPdf}–${rightPdf} / ${totalPdfPages}`;


        return;

    }


    count.textContent =
        "Inside Cover";

}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            nextButton.disabled
        ) {

            return;

        }


        flip.flipNext(
            "bottom"
        );

    }

);


/* =========================================================
   PREVIOUS BUTTON
========================================================= */

prevButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            prevButton.disabled
        ) {

            return;

        }


        flip.flipPrev(
            "bottom"
        );

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function (event) {


        if (!flip) {

            return;

        }


        /*
         * RIGHT ARROW
         */

        if (
            event.key ===
            "ArrowRight"
        ) {


            if (
                !nextButton.disabled
            ) {


                flip.flipNext(
                    "bottom"
                );

            }

        }


        /*
         * LEFT ARROW
         */

        if (
            event.key ===
            "ArrowLeft"
        ) {


            if (
                !prevButton.disabled
            ) {


                flip.flipPrev(
                    "bottom"
                );

            }

        }

    }

);


/* =========================================================
   START
========================================================= */

start().catch(

    function (error) {


        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";

    }

);

</script>

</body>
</html>
