<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}

/* =========================================================
   STAGE
========================================================= */

#stage {
    height: calc(100% - 54px);
    width: 100%;
    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0,
            #222 50%,
            #151515 100%
        );
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 50;
}

/* =========================================================
   TRUE CLOSED BOOK

   This is NOT PageFlip.

   It is physically only ONE PAGE wide.

   Therefore:
   - no blank left side
   - no blank right side
   - perfectly centered
========================================================= */

#closedView {
    display: none;

    position: relative;
    overflow: hidden;

    background: #fff;

    box-shadow:
        0 16px 45px rgba(0,0,0,.48),
        0 0 0 1px rgba(0,0,0,.16);

    cursor: pointer;

    transform-origin: center center;
}

#closedView img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: fill;

    user-select: none;
    -webkit-user-drag: none;
}

/* small animation when book closes */

#closedView.front {
    animation: coverIn .28s ease both;
}

#closedView.back {
    animation: coverIn .28s ease both;
}

@keyframes coverIn {

    from {
        opacity: .65;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================================
   OPEN BOOK

   PageFlip is used ONLY here.

   It NEVER controls the front/back closed covers.
========================================================= */

#openView {
    display: none;

    position: relative;

    filter:
        drop-shadow(
            0 16px 32px rgba(0,0,0,.40)
        );
}

#book {
    visibility: hidden;
}

/* =========================================================
   CENTRE BOOK SHADOW / GUTTER
========================================================= */

#openView::after {
    content: "";

    pointer-events: none;

    position: absolute;

    z-index: 30;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 28px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.16),
            rgba(255,255,255,.12) 42%,
            rgba(0,0,0,.14)
        );

    opacity: .55;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 54px;

    background: #101010;

    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}

/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 46px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;

    cursor: pointer;
}

button:hover:not(:disabled) {
    background: #3a3a3a;
}

button:disabled {
    opacity: .25;
    cursor: default;
}

/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 240px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

@media(max-width:700px) {

    #count {
        min-width: 150px;
    }

    button {
        width: 40px;
    }
}

</style>
</head>

<body>

<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <!-- ===================================================
         REAL SINGLE-PAGE CLOSED BOOK

         Used for:
         FRONT COVER
         BACK COVER
    ==================================================== -->

    <div
        id="closedView"
        aria-label="Closed catalogue"
    >

        <img
            id="closedImage"
            alt="Catalogue cover"
        >

    </div>


    <!-- ===================================================
         OPEN TWO-PAGE BOOK
    ==================================================== -->

    <div id="openView">

        <div id="book"></div>

    </div>

</div>


<footer>

    <button
        id="prev"
        aria-label="Previous"
    >
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button
        id="next"
        aria-label="Next"
    >
        ›
    </button>

</footer>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const loading =
    document.getElementById(
        "loading"
    );

const closedView =
    document.getElementById(
        "closedView"
    );

const closedImage =
    document.getElementById(
        "closedImage"
    );

const openView =
    document.getElementById(
        "openView"
    );

const book =
    document.getElementById(
        "book"
    );

const prevButton =
    document.getElementById(
        "prev"
    );

const nextButton =
    document.getElementById(
        "next"
    );

const count =
    document.getElementById(
        "count"
    );


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

let pdfImages = [];

let interiorImages = [];

let totalPdfPages = 0;

let pageWidth = 0;

let pageHeight = 0;


/*
 * Possible modes:
 *
 * front
 * open
 * back
 */

let mode =
    "front";


/*
 * 0 = PDF pages 2-3
 * 1 = PDF pages 4-5
 * 2 = PDF pages 6-7
 * ...
 */

let openSpread = 0;


/* =========================================================
   CREATE WHITE PAGE
========================================================= */

function makeWhiteBackCover(
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        width;

    canvas.height =
        height;

    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );

    context.fillStyle =
        "#ffffff";

    context.fillRect(
        0,
        0,
        width,
        height
    );

    return canvas.toDataURL(
        "image/jpeg",
        .96
    );
}


/* =========================================================
   SIZE BOOK
========================================================= */

function sizeViews(
    ratio
) {

    /*
     * Calculate size based on OPEN book.
     *
     * Two pages must fit horizontally.
     */

    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight
                    * .90,

                (
                    stage.clientWidth
                    * .92
                )
                /
                (
                    2 * ratio
                )

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /*
     * CLOSED book:
     *
     * EXACTLY ONE PAGE.
     */

    closedView.style.width =
        pageWidth + "px";

    closedView.style.height =
        pageHeight + "px";


    /*
     * OPEN book:
     *
     * EXACTLY TWO PAGES.
     */

    openView.style.width =
        (pageWidth * 2) + "px";

    openView.style.height =
        pageHeight + "px";

}


/* =========================================================
   START
========================================================= */

async function start() {


    /* =====================================================
       LOAD PDF
    ===================================================== */

    const pdf =
        await pdfjsLib
            .getDocument(
                "catalogue.pdf"
            )
            .promise;


    totalPdfPages =
        pdf.numPages;


    let ratio = 0;

    let renderedWidth = 0;

    let renderedHeight = 0;


    /* =====================================================
       CONVERT PDF TO IMAGES
    ===================================================== */

    for (
        let n = 1;
        n <= totalPdfPages;
        n++
    ) {


        const page =
            await pdf.getPage(n);


        const viewport =
            page.getViewport({
                scale: 2
            });


        /*
         * Get page ratio.
         */

        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            Math.round(
                viewport.width
            );


        canvas.height =
            Math.round(
                viewport.height
            );


        renderedWidth =
            canvas.width;


        renderedHeight =
            canvas.height;


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
         * White PDF background.
         */

        context.fillStyle =
            "#ffffff";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * Render.
         */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /*
         * Save image.
         */

        pdfImages.push(

            canvas.toDataURL(
                "image/jpeg",
                .96
            )

        );

    }


    /* =====================================================
       SIZE EVERYTHING
    ===================================================== */

    sizeViews(
        ratio
    );


    /* =====================================================
       IMPORTANT BOOK STRUCTURE
    ===================================================== */

    /*
     *
     * PDF PAGE 1
     *
     * IS NOT GIVEN TO PAGEFLIP.
     *
     * It is displayed separately as:
     *
     *       ┌───────────┐
     *       │  PAGE 1   │
     *       │   COVER   │
     *       └───────────┘
     *
     *
     * PageFlip receives:
     *
     * PDF 2
     * PDF 3
     * ...
     * PDF 13
     *
     *
     * Therefore:
     *
     * ┌───────┬───────┐
     * │   2   │   3   │
     * └───────┴───────┘
     *
     * ┌───────┬───────┐
     * │   4   │   5   │
     * └───────┴───────┘
     *
     * etc.
     */


    interiorImages =
        pdfImages.slice(1);


    /*
     * Generic protection.
     *
     * If another PDF has an odd number
     * of inside pages, complete the final
     * spread.
     *
     * Your current 13-page PDF gives:
     *
     * 12 inside pages
     *
     * so NO blank is added.
     */

    if (
        interiorImages.length % 2 !== 0
    ) {

        interiorImages.push(

            makeWhiteBackCover(
                renderedWidth,
                renderedHeight
            )

        );

    }


    /* =====================================================
       CREATE PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                width:
                    pageWidth,

                height:
                    pageHeight,


                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,


                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /*
                 * VERY IMPORTANT:
                 *
                 * PageFlip contains ONLY
                 * inside pages.
                 *
                 * Therefore:
                 *
                 * NO cover handling.
                 */

                showCover:
                    false,


                /*
                 * Always two pages
                 * on desktop.
                 */

                usePortrait:
                    false,


                /*
                 * We control dimensions.
                 */

                autoSize:
                    false,


                /*
                 * Book effects.
                 */

                drawShadow:
                    true,


                maxShadowOpacity:
                    .55,


                flippingTime:
                    850,


                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                showPageCorners:
                    true,


                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD INTERIOR PAGES
    ===================================================== */

    flip.loadFromImages(
        interiorImages
    );


    /* =====================================================
       PAGEFLIP INITIALIZED
    ===================================================== */

    flip.on(
        "init",
        function () {

            book.style.visibility =
                "visible";

        }
    );


    /* =====================================================
       PAGE TURNED
    ===================================================== */

    flip.on(
        "flip",
        function () {


            if (
                mode !== "open"
            ) {

                return;

            }


            /*
             * PageFlip indexes:
             *
             * 0 = PDF 2
             * 1 = PDF 3
             * 2 = PDF 4
             * 3 = PDF 5
             * etc.
             */

            const index =
                flip.getCurrentPageIndex();


            openSpread =
                Math.floor(
                    index / 2
                );


            updateCounter();

        }
    );


    /* =====================================================
       FINISHED LOADING
    ===================================================== */

    loading.style.display =
        "none";


    /*
     * START CLOSED.
     */

    showFront();

}


/* =========================================================
   SHOW FRONT COVER
========================================================= */

function showFront() {


    mode =
        "front";


    /*
     * Hide open book.
     */

    openView.style.display =
        "none";


    /*
     * Show real one-page cover.
     */

    closedView.style.display =
        "block";


    closedView.className =
        "front";


    /*
     * REAL PDF PAGE 1.
     */

    closedImage.src =
        pdfImages[0];


    count.textContent =
        `Front Cover · Page 1 / ${totalPdfPages}`;


    prevButton.disabled =
        true;


    nextButton.disabled =
        false;

}


/* =========================================================
   SHOW OPEN BOOK
========================================================= */

function showOpen(
    spreadIndex = 0
) {


    mode =
        "open";


    /*
     * Hide closed cover.
     */

    closedView.style.display =
        "none";


    /*
     * Show PageFlip.
     */

    openView.style.display =
        "block";


    /*
     * Maximum spread.
     */

    const maxSpread =
        Math.max(

            0,

            Math.ceil(
                interiorImages.length / 2
            ) - 1

        );


    openSpread =
        Math.max(

            0,

            Math.min(
                spreadIndex,
                maxSpread
            )

        );


    /*
     * Convert spread number to
     * PageFlip page index.
     *
     * Spread 0 -> index 0
     * Spread 1 -> index 2
     * Spread 2 -> index 4
     */

    const target =
        openSpread * 2;


    /*
     * Jump to left page.
     */

    flip.turnToPage(
        target
    );


    updateCounter();


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;

}


/* =========================================================
   SHOW BACK COVER
========================================================= */

function showBack() {


    mode =
        "back";


    /*
     * Hide open book.
     */

    openView.style.display =
        "none";


    /*
     * Show one-page closed book.
     */

    closedView.style.display =
        "block";


    closedView.className =
        "back";


    /* =====================================================
       CREATE WHITE BACK COVER
    ===================================================== */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1200;


    canvas.height =
        Math.round(

            1200 *
            (
                pageHeight /
                pageWidth
            )

        );


    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    context.fillStyle =
        "#ffffff";


    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    closedImage.src =
        canvas.toDataURL(
            "image/jpeg",
            .96
        );


    count.textContent =
        "Back Cover";


    prevButton.disabled =
        false;


    nextButton.disabled =
        true;

}


/* =========================================================
   UPDATE PAGE COUNTER
========================================================= */

function updateCounter() {


    if (
        mode !== "open"
    ) {

        return;

    }


    /*
     * Spread 0:
     *
     * PDF 2 + 3
     *
     *
     * Spread 1:
     *
     * PDF 4 + 5
     *
     * etc.
     */

    const leftPdf =
        2 +
        (
            openSpread * 2
        );


    const rightPdf =
        leftPdf + 1;


    if (
        rightPdf <= totalPdfPages
    ) {


        count.textContent =
            `Pages ${leftPdf}–${rightPdf} / ${totalPdfPages}`;


    } else {


        count.textContent =
            `Page ${leftPdf} / ${totalPdfPages}`;

    }

}


/* =========================================================
   NEXT
========================================================= */

function next() {


    /* =====================================================
       FRONT -> OPEN
    ===================================================== */

    if (
        mode === "front"
    ) {


        /*
         * Opens directly to:
         *
         * PAGE 2 | PAGE 3
         */

        showOpen(0);

        return;

    }


    /* =====================================================
       ALREADY AT BACK
    ===================================================== */

    if (
        mode === "back"
    ) {

        return;

    }


    /* =====================================================
       OPEN BOOK
    ===================================================== */

    const maxSpread =
        Math.ceil(
            interiorImages.length / 2
        ) - 1;


    /*
     * LAST OPEN SPREAD?
     *
     * For your PDF:
     *
     * PAGE 12 | PAGE 13
     *
     * Next click closes the book.
     */

    if (
        openSpread >= maxSpread
    ) {


        showBack();

        return;

    }


    /*
     * Normal animated page flip.
     */

    flip.flipNext(
        "bottom"
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previous() {


    /* =====================================================
       BACK -> LAST SPREAD
    ===================================================== */

    if (
        mode === "back"
    ) {


        const maxSpread =
            Math.ceil(
                interiorImages.length / 2
            ) - 1;


        /*
         * Reopen:
         *
         * PAGE 12 | PAGE 13
         */

        showOpen(
            maxSpread
        );


        return;

    }


    /* =====================================================
       ALREADY FRONT
    ===================================================== */

    if (
        mode === "front"
    ) {

        return;

    }


    /* =====================================================
       FIRST OPEN SPREAD?
    ===================================================== */

    if (
        openSpread <= 0
    ) {


        /*
         * PAGE 2 | PAGE 3
         *
         * Previous closes to PAGE 1.
         */

        showFront();

        return;

    }


    /*
     * Normal previous page animation.
     */

    flip.flipPrev(
        "bottom"
    );

}


/* =========================================================
   BUTTONS
========================================================= */

nextButton.addEventListener(
    "click",
    next
);


prevButton.addEventListener(
    "click",
    previous
);


/* =========================================================
   CLICK CLOSED COVER
========================================================= */

closedView.addEventListener(

    "click",

    function () {


        /*
         * Click front:
         *
         * OPEN BOOK.
         */

        if (
            mode === "front"
        ) {

            next();

            return;

        }


        /*
         * Click back:
         *
         * REOPEN BOOK.
         */

        if (
            mode === "back"
        ) {

            previous();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function (
        event
    ) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            next();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previous();

        }

    }

);


/* =========================================================
   START
========================================================= */

start().catch(

    function (
        error
    ) {


        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";

    }

);

</script>

</body>
</html>
