<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    width: 100%;
    height: calc(100% - 54px);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #303030 0%,
            #222 50%,
            #151515 100%
        );
}


/* =========================================================
   WRAPPER

   IMPORTANT:
   We move THIS wrapper when the book is closed.
   We do NOT transform PageFlip itself.
========================================================= */

#book-positioner {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: transform 0.35s ease;
}


/* =========================================================
   PAGEFLIP
========================================================= */

#book {
    visibility: hidden;
}


/* =========================================================
   CLOSED BOOK POSITIONS
========================================================= */

/*
 * PageFlip's front cover occupies the RIGHT half
 * of its two-page area.
 *
 * Therefore move the whole PageFlip area LEFT
 * by half of one page.
 */

#book-positioner.front-cover {
    transform:
        translateX(
            calc(var(--page-width) / -2)
        );
}


/*
 * Normal open book.
 */

#book-positioner.open-book {
    transform:
        translateX(0);
}


/*
 * Back cover occupies the LEFT half.
 *
 * Therefore move the PageFlip area RIGHT
 * by half of one page.
 */

#book-positioner.back-cover {
    transform:
        translateX(
            calc(var(--page-width) / 2)
        );
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 100;

    font-size: 14px;

    color: #ddd;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    width: 100%;
    height: 54px;

    background: #101010;

    border-top: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 46px;
    height: 38px;

    border: 1px solid #444;
    border-radius: 6px;

    background: #292929;
    color: #fff;

    font-size: 24px;

    cursor: pointer;

    transition:
        background .15s ease,
        opacity .15s ease;
}


button:hover:not(:disabled) {
    background: #3a3a3a;
}


button:disabled {
    opacity: .25;
    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#count {
    min-width: 220px;

    text-align: center;

    font-size: 13px;

    color: #ddd;
}

</style>
</head>


<body>


<div id="stage">

    <div id="loading">
        Preparing catalogue…
    </div>

    <div id="book-positioner">

        <div id="book"></div>

    </div>

</div>


<footer>

    <button id="prev">
        ‹
    </button>

    <span id="count">
        Front Cover
    </span>

    <button id="next">
        ›
    </button>

</footer>



<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");


const positioner =
    document.getElementById("book-positioner");


const book =
    document.getElementById("book");


const loading =
    document.getElementById("loading");


const count =
    document.getElementById("count");


const nextButton =
    document.getElementById("next");


const prevButton =
    document.getElementById("prev");


/* =========================================================
   VARIABLES
========================================================= */

let flip = null;

let totalPdfPages = 0;

let totalBookPages = 0;

let pageWidth = 0;

let pageHeight = 0;


/* =========================================================
   CREATE BACK COVER
========================================================= */

function createBackCover(
    width,
    height
) {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    /*
     * White physical back cover.
     */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );

}


/* =========================================================
   START
========================================================= */

async function start() {


    /* =====================================================
       LOAD PDF
    ===================================================== */

    const pdf =
        await pdfjsLib
            .getDocument(
                "catalogue.pdf"
            )
            .promise;


    totalPdfPages =
        pdf.numPages;


    const images = [];


    let ratio = 0;

    let renderedWidth = 0;

    let renderedHeight = 0;


    /* =====================================================
       RENDER PDF
    ===================================================== */

    for (
        let n = 1;
        n <= totalPdfPages;
        n++
    ) {


        const page =
            await pdf.getPage(n);


        const viewport =
            page.getViewport({
                scale: 2
            });


        if (!ratio) {

            ratio =
                viewport.width /
                viewport.height;

        }


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            Math.round(
                viewport.width
            );


        canvas.height =
            Math.round(
                viewport.height
            );


        renderedWidth =
            canvas.width;


        renderedHeight =
            canvas.height;


        const ctx =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext:
                ctx,

            viewport:
                viewport

        }).promise;


        images.push(

            canvas.toDataURL(
                "image/jpeg",
                0.96
            )

        );

    }


    /* =====================================================
       ADD PHYSICAL BACK COVER
    ===================================================== */

    /*
     * Your PDF has 13 pages.
     *
     * PAGE 1
     * front cover
     *
     * PAGE 2 - 13
     * actual paper
     *
     * PAGE 14
     * generated white back cover
     */


    images.push(

        createBackCover(
            renderedWidth,
            renderedHeight
        )

    );


    totalBookPages =
        images.length;


    /* =====================================================
       CALCULATE PAGE SIZE
    ===================================================== */

    /*
     * OPEN book must fit on screen.
     */

    pageHeight =
        Math.floor(

            Math.min(

                stage.clientHeight * 0.90,

                (
                    stage.clientWidth * 0.90
                )
                /
                (
                    2 * ratio
                )

            )

        );


    pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /*
     * Make page width available to CSS.
     */

    positioner.style.setProperty(

        "--page-width",

        `${pageWidth}px`

    );


    /* =====================================================
       PAGEFLIP
    ===================================================== */

    flip =
        new St.PageFlip(

            book,

            {

                width:
                    pageWidth,

                height:
                    pageHeight,


                size:
                    "fixed",


                minWidth:
                    pageWidth,

                maxWidth:
                    pageWidth,


                minHeight:
                    pageHeight,

                maxHeight:
                    pageHeight,


                /*
                 * FIRST + LAST PAGE
                 * become covers.
                 */

                showCover:
                    true,


                /*
                 * Desktop physical-book mode.
                 */

                usePortrait:
                    false,


                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    0.55,


                flippingTime:
                    900,


                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                swipeDistance:
                    20,


                showPageCorners:
                    true,


                disableFlipByClick:
                    false

            }

        );


    /* =====================================================
       LOAD PAGES
    ===================================================== */

    flip.loadFromImages(
        images
    );


    /* =====================================================
       EVENTS
    ===================================================== */

    flip.on(
        "init",
        function () {

            updateBookState();

        }
    );


    flip.on(
        "flip",
        function () {

            updateBookState();

        }
    );


    flip.on(
        "changeOrientation",
        function () {

            updateBookState();

        }
    );


    /* =====================================================
       SHOW
    ===================================================== */

    book.style.visibility =
        "visible";


    loading.style.display =
        "none";


    updateBookState();

}


/* =========================================================
   UPDATE BOOK
========================================================= */

function updateBookState() {


    if (!flip) {
        return;
    }


    const index =
        flip.getCurrentPageIndex();


    /* =====================================================
       RESET
    ===================================================== */

    positioner.classList.remove(
        "front-cover",
        "open-book",
        "back-cover"
    );


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (
        index === 0
    ) {


        /*
         * CLOSED BOOK.
         */

        positioner.classList.add(
            "front-cover"
        );


        count.textContent =
            `Front Cover · Page 1 / ${totalPdfPages}`;


        prevButton.disabled =
            true;


        nextButton.disabled =
            false;


        return;

    }


    /* =====================================================
       BACK COVER
    ===================================================== */

    if (
        index >= totalBookPages - 1
    ) {


        /*
         * CLOSED BOOK.
         */

        positioner.classList.add(
            "back-cover"
        );


        count.textContent =
            "Back Cover";


        prevButton.disabled =
            false;


        nextButton.disabled =
            true;


        return;

    }


    /* =====================================================
       OPEN BOOK
    ===================================================== */

    positioner.classList.add(
        "open-book"
    );


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    /* =====================================================
       FIND CURRENT SPREAD
    ===================================================== */

    let leftIndex;


    if (
        index % 2 === 1
    ) {

        leftIndex =
            index;

    } else {

        leftIndex =
            index - 1;

    }


    const rightIndex =
        leftIndex + 1;


    const leftPage =
        leftIndex + 1;


    const rightPage =
        rightIndex + 1;


    /* =====================================================
       COUNTER
    ===================================================== */

    if (
        rightPage <= totalPdfPages
    ) {


        count.textContent =
            `Pages ${leftPage}–${rightPage} / ${totalPdfPages}`;


    } else {


        count.textContent =
            `Page ${leftPage} / ${totalPdfPages}`;

    }

}


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            nextButton.disabled
        ) {

            return;

        }


        flip.flipNext(
            "bottom"
        );

    }

);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(

    "click",

    function () {


        if (
            !flip ||
            prevButton.disabled
        ) {

            return;

        }


        flip.flipPrev(
            "bottom"
        );

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function (event) {


        if (!flip) {
            return;
        }


        if (
            event.key ===
            "ArrowRight" &&
            !nextButton.disabled
        ) {


            flip.flipNext(
                "bottom"
            );

        }


        if (
            event.key ===
            "ArrowLeft" &&
            !prevButton.disabled
        ) {


            flip.flipPrev(
                "bottom"
            );

        }

    }

);


/* =========================================================
   LOAD
========================================================= */

start().catch(

    function (error) {


        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";

    }

);

</script>

</body>
</html>
