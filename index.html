<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #181818;

    font-family: Arial, sans-serif;
    color: white;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    width: 100%;
    height: calc(100vh - 58px);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #151515 100%
        );
}


/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;

    z-index: 500;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #ddd;

    font-size: 15px;
}


/* =========================================================
   VIEWER
========================================================= */

#viewer {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: relative;

    background: white;

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 2px 5px rgba(0,0,0,.35);
}


#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* Small book depth */

#closedBook::after {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 8px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.22),
            rgba(255,255,255,.05),
            transparent
        );
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: relative;

    background: white;

    box-shadow:
        0 18px 45px rgba(0,0,0,.50);

    perspective: 2500px;

    transform-style: preserve-3d;
}


/* =========================================================
   STATIC BOOK PAGES
========================================================= */

.page {
    position: absolute;

    top: 0;

    overflow: hidden;

    background: white;
}


#leftPage {
    left: 0;
}


#rightPage {
    right: 0;
}


.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* =========================================================
   LEFT PAGE SPINE SHADOW
========================================================= */

#leftPage::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    right: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.16),
            rgba(0,0,0,.05),
            transparent
        );
}


/* =========================================================
   RIGHT PAGE SPINE SHADOW
========================================================= */

#rightPage::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    left: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.16),
            rgba(0,0,0,.05),
            transparent
        );
}


/* =========================================================
   CENTER SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 80;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 18px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,

            rgba(0,0,0,.12) 0%,

            rgba(0,0,0,.05) 25%,

            rgba(255,255,255,.13) 48%,

            rgba(0,0,0,.05) 72%,

            rgba(0,0,0,.12) 100%
        );
}


/* =========================================================
   NORMAL TURNING SHEET
========================================================= */

#flipSheet {
    display: none;

    position: absolute;

    z-index: 100;

    top: 0;

    background: white;

    transform-style: preserve-3d;

    will-change: transform;
}


/* =========================================================
   TURNING SHEET FACES
========================================================= */

.flipFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


.flipFace canvas {
    display: block;

    width: 100%;
    height: 100%;
}


#flipBack {
    transform: rotateY(180deg);
}


/* =========================================================
   NORMAL SHEET SHADOW
========================================================= */

#flipShade {
    position: absolute;

    z-index: 10;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.02),
            rgba(0,0,0,.30)
        );
}


/* =========================================================
   NEXT SHEET TURN
========================================================= */

#flipSheet.flip-next {
    left: 50%;

    transform-origin: left center;

    animation:
        flipNext
        850ms
        cubic-bezier(.45,.02,.20,1)
        forwards;
}


#flipSheet.flip-next #flipShade {
    animation:
        flipShade
        850ms
        ease
        forwards;
}


@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    18% {
        transform: rotateY(-22deg);
    }

    40% {
        transform: rotateY(-65deg);
    }

    50% {
        transform: rotateY(-90deg);
    }

    70% {
        transform: rotateY(-135deg);
    }

    88% {
        transform: rotateY(-168deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


/* =========================================================
   PREVIOUS SHEET TURN
========================================================= */

#flipSheet.flip-prev {
    left: 0;

    transform-origin: right center;

    animation:
        flipPrev
        850ms
        cubic-bezier(.45,.02,.20,1)
        forwards;
}


#flipSheet.flip-prev #flipShade {
    animation:
        flipShade
        850ms
        ease
        forwards;
}


@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    18% {
        transform: rotateY(22deg);
    }

    40% {
        transform: rotateY(65deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    70% {
        transform: rotateY(135deg);
    }

    88% {
        transform: rotateY(168deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}


@keyframes flipShade {

    0% {
        opacity: 0;
    }

    40% {
        opacity: .42;
    }

    55% {
        opacity: .46;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   COVER TRANSITION
========================================================= */

#coverTransition {
    display: none;

    position: absolute;

    z-index: 200;

    top: 0;

    background: white;

    transform-style: preserve-3d;

    will-change: transform;
}


/* =========================================================
   COVER FACES
========================================================= */

.coverFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: white;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


.coverFace canvas {
    display: block;

    width: 100%;
    height: 100%;
}


#coverBack {
    transform: rotateY(180deg);
}


/* =========================================================
   COVER SHADOW
========================================================= */

#coverShadow {
    position: absolute;

    z-index: 10;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.03),
            rgba(0,0,0,.35)
        );
}


/* =========================================================
   FRONT COVER OPEN

   CLOSED FRONT
          ↓
   COVER OPENS LEFT
========================================================= */

#coverTransition.open-front {
    left: 50%;

    transform-origin: left center;

    animation:
        openFrontCover
        1000ms
        cubic-bezier(.42,.02,.18,1)
        forwards;
}


#coverTransition.open-front #coverShadow {
    animation:
        coverShade
        1000ms
        ease
        forwards;
}


@keyframes openFrontCover {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(-15deg);
    }

    35% {
        transform: rotateY(-50deg);
    }

    50% {
        transform: rotateY(-90deg);
    }

    70% {
        transform: rotateY(-130deg);
    }

    88% {
        transform: rotateY(-165deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


/* =========================================================
   FRONT COVER CLOSE

   FIRST SPREAD
          ↓
   CLOSED FRONT
========================================================= */

#coverTransition.close-front {
    left: 0;

    transform-origin: right center;

    animation:
        closeFrontCover
        1000ms
        cubic-bezier(.42,.02,.18,1)
        forwards;
}


#coverTransition.close-front #coverShadow {
    animation:
        coverShade
        1000ms
        ease
        forwards;
}


@keyframes closeFrontCover {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(15deg);
    }

    35% {
        transform: rotateY(50deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    70% {
        transform: rotateY(130deg);
    }

    88% {
        transform: rotateY(165deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}


/* =========================================================
   BACK COVER CLOSE

   LAST SPREAD
        ↓
   CLOSED BACK
========================================================= */

#coverTransition.close-back {
    left: 0;

    transform-origin: right center;

    animation:
        closeBackCover
        1000ms
        cubic-bezier(.42,.02,.18,1)
        forwards;
}


#coverTransition.close-back #coverShadow {
    animation:
        coverShade
        1000ms
        ease
        forwards;
}


@keyframes closeBackCover {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(15deg);
    }

    35% {
        transform: rotateY(50deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    70% {
        transform: rotateY(130deg);
    }

    88% {
        transform: rotateY(165deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}


/* =========================================================
   BACK COVER OPEN

   CLOSED BACK
        ↓
   LAST SPREAD
========================================================= */

#coverTransition.open-back {
    left: 50%;

    transform-origin: left center;

    animation:
        openBackCover
        1000ms
        cubic-bezier(.42,.02,.18,1)
        forwards;
}


#coverTransition.open-back #coverShadow {
    animation:
        coverShade
        1000ms
        ease
        forwards;
}


@keyframes openBackCover {

    0% {
        transform: rotateY(0deg);
    }

    15% {
        transform: rotateY(-15deg);
    }

    35% {
        transform: rotateY(-50deg);
    }

    50% {
        transform: rotateY(-90deg);
    }

    70% {
        transform: rotateY(-130deg);
    }

    88% {
        transform: rotateY(-165deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


/* =========================================================
   COVER SHADOW ANIMATION
========================================================= */

@keyframes coverShade {

    0% {
        opacity: 0;
    }

    42% {
        opacity: .48;
    }

    58% {
        opacity: .42;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 28px;

    background: #101010;

    border-top: 1px solid #333;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


button:hover:not(:disabled) {
    background: #3b3b3b;
}


button:disabled {
    opacity: .25;

    cursor: default;
}


/* =========================================================
   COUNTER
========================================================= */

#counter {
    min-width: 230px;

    text-align: center;

    color: #ddd;

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }

    footer {
        gap: 12px;
    }

    #counter {
        min-width: 150px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     VIEWER
======================================================== -->

<div id="stage">


    <div id="loading">
        Loading catalogue...
    </div>


    <div id="viewer">


        <!-- =================================================
             CLOSED BOOK
        ================================================== -->

        <div id="closedBook">

            <canvas id="closedCanvas"></canvas>

        </div>


        <!-- =================================================
             OPEN BOOK
        ================================================== -->

        <div id="openBook">


            <!-- STATIC LEFT PAGE -->

            <div
                id="leftPage"
                class="page"
            >

                <canvas id="leftCanvas"></canvas>

            </div>


            <!-- STATIC RIGHT PAGE -->

            <div
                id="rightPage"
                class="page"
            >

                <canvas id="rightCanvas"></canvas>

            </div>


            <!-- =================================================
                 NORMAL PAGE TURN
            ================================================== -->

            <div id="flipSheet">


                <div
                    id="flipFront"
                    class="flipFace"
                >

                    <canvas id="flipFrontCanvas"></canvas>

                </div>


                <div
                    id="flipBack"
                    class="flipFace"
                >

                    <canvas id="flipBackCanvas"></canvas>

                </div>


                <div id="flipShade"></div>


            </div>


            <!-- =================================================
                 FRONT / BACK COVER TRANSITION
            ================================================== -->

            <div id="coverTransition">


                <div
                    id="coverFront"
                    class="coverFace"
                >

                    <canvas id="coverFrontCanvas"></canvas>

                </div>


                <div
                    id="coverBack"
                    class="coverFace"
                >

                    <canvas id="coverBackCanvas"></canvas>

                </div>


                <div id="coverShadow"></div>


            </div>


            <!-- CENTER SPINE -->

            <div id="spine"></div>


        </div>


    </div>

</div>


<!-- =======================================================
     CONTROLS
======================================================== -->

<footer>


    <button
        id="prev"
        type="button"
        aria-label="Previous"
    >
        ‹
    </button>


    <div id="counter">
        Loading...
    </div>


    <button
        id="next"
        type="button"
        aria-label="Next"
    >
        ›
    </button>


</footer>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PDF_FILE =
    "catalogue.pdf";


const TURN_TIME =
    850;


const COVER_TIME =
    1000;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");


const loading =
    document.getElementById("loading");


const closedBook =
    document.getElementById("closedBook");


const closedCanvas =
    document.getElementById("closedCanvas");


const openBook =
    document.getElementById("openBook");


const leftPage =
    document.getElementById("leftPage");


const rightPage =
    document.getElementById("rightPage");


const leftCanvas =
    document.getElementById("leftCanvas");


const rightCanvas =
    document.getElementById("rightCanvas");


const flipSheet =
    document.getElementById("flipSheet");


const flipFrontCanvas =
    document.getElementById("flipFrontCanvas");


const flipBackCanvas =
    document.getElementById("flipBackCanvas");


const coverTransition =
    document.getElementById("coverTransition");


const coverFrontCanvas =
    document.getElementById("coverFrontCanvas");


const coverBackCanvas =
    document.getElementById("coverBackCanvas");


const prevButton =
    document.getElementById("prev");


const nextButton =
    document.getElementById("next");


const counter =
    document.getElementById("counter");


/* =========================================================
   STATE
========================================================= */

let pdf =
    null;


let totalPages =
    0;


let pageRatio =
    1;


let displayWidth =
    0;


let displayHeight =
    0;


/*
    front
    open
    back
*/

let mode =
    "front";


/*
    Current LEFT page.

    2 = 2 + 3
    4 = 4 + 5
    6 = 6 + 7
*/

let leftPageNumber =
    2;


let isAnimating =
    false;


/* =========================================================
   GET ORIGINAL PDF PAGE RATIO
========================================================= */

async function getPdfRatio() {


    const firstPage =
        await pdf.getPage(1);


    const viewport =
        firstPage.getViewport({

            scale: 1

        });


    pageRatio =
        viewport.width /
        viewport.height;

}


/* =========================================================
   CALCULATE DISPLAY SIZE
========================================================= */

function calculateSize() {


    const availableWidth =
        stage.clientWidth - 60;


    const availableHeight =
        stage.clientHeight - 40;


    /*
        TWO complete pages must fit horizontally.
    */

    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(

            availableHeight,

            heightFromWidth

        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(
            displayWidth
        );


    displayHeight =
        Math.floor(
            displayHeight
        );


    /* =====================================================
       CLOSED BOOK
    ===================================================== */

    closedBook.style.width =
        displayWidth + "px";


    closedBook.style.height =
        displayHeight + "px";


    /* =====================================================
       OPEN BOOK
    ===================================================== */

    openBook.style.width =
        (displayWidth * 2) + "px";


    openBook.style.height =
        displayHeight + "px";


    /* =====================================================
       LEFT
    ===================================================== */

    leftPage.style.width =
        displayWidth + "px";


    leftPage.style.height =
        displayHeight + "px";


    /* =====================================================
       RIGHT
    ===================================================== */

    rightPage.style.width =
        displayWidth + "px";


    rightPage.style.height =
        displayHeight + "px";


    /* =====================================================
       NORMAL FLIP SHEET
    ===================================================== */

    flipSheet.style.width =
        displayWidth + "px";


    flipSheet.style.height =
        displayHeight + "px";


    /* =====================================================
       COVER SHEET
    ===================================================== */

    coverTransition.style.width =
        displayWidth + "px";


    coverTransition.style.height =
        displayHeight + "px";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {


    if (

        pageNumber < 1 ||

        pageNumber > totalPages

    ) {


        clearCanvas(
            canvas
        );


        return;

    }


    const page =
        await pdf.getPage(
            pageNumber
        );


    const dpr =
        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    const baseViewport =
        page.getViewport({

            scale: 1

        });


    const renderScale =
        (
            displayWidth *
            dpr
        ) /
        baseViewport.width;


    const viewport =
        page.getViewport({

            scale: renderScale

        });


    canvas.width =
        Math.round(
            viewport.width
        );


    canvas.height =
        Math.round(
            viewport.height
        );


    canvas.style.width =
        displayWidth + "px";


    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;

}


/* =========================================================
   CLEAR CANVAS
========================================================= */

function clearCanvas(
    canvas
) {


    const dpr =
        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    canvas.width =
        Math.round(

            displayWidth *
            dpr

        );


    canvas.height =
        Math.round(

            displayHeight *
            dpr

        );


    canvas.style.width =
        displayWidth + "px";


    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

}


/* =========================================================
   RESET NORMAL PAGE TURN
========================================================= */

function resetFlip() {


    flipSheet.classList.remove(

        "flip-next",

        "flip-prev"

    );


    flipSheet.style.display =
        "none";


    flipSheet.style.transform =
        "";

}


/* =========================================================
   RESET COVER TRANSITION
========================================================= */

function resetCoverTransition() {


    coverTransition.classList.remove(

        "open-front",

        "close-front",

        "close-back",

        "open-back"

    );


    coverTransition.style.display =
        "none";


    coverTransition.style.transform =
        "";

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateSpreadCounter() {


    if (

        leftPageNumber + 1 <=
        totalPages

    ) {


        counter.textContent =

            `Pages ${leftPageNumber}–${leftPageNumber + 1} / ${totalPages}`;


    }

    else {


        counter.textContent =

            `Page ${leftPageNumber} / ${totalPages}`;

    }

}


/* =========================================================
   FRONT COVER
========================================================= */

async function showFront() {


    resetFlip();

    resetCoverTransition();


    mode =
        "front";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    await renderPage(

        1,

        closedCanvas

    );


    counter.textContent =

        `Front Cover · Page 1 / ${totalPages}`;


    prevButton.disabled =
        true;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   RENDER OPEN SPREAD
========================================================= */

async function renderSpread(
    requestedLeft
) {


    requestedLeft =
        Math.max(

            2,

            requestedLeft

        );


    /*
        Force even left page.
    */

    if (

        requestedLeft % 2 !== 0

    ) {


        requestedLeft--;

    }


    leftPageNumber =
        requestedLeft;


    await Promise.all([


        renderPage(

            leftPageNumber,

            leftCanvas

        ),


        renderPage(

            leftPageNumber + 1,

            rightCanvas

        )


    ]);


    updateSpreadCounter();

}


/* =========================================================
   SHOW OPEN SPREAD
========================================================= */

async function showSpread(
    requestedLeft
) {


    resetFlip();

    resetCoverTransition();


    mode =
        "open";


    closedBook.style.display =
        "none";


    openBook.style.display =
        "block";


    await renderSpread(
        requestedLeft
    );


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   BACK COVER
========================================================= */

function showBack() {


    resetFlip();

    resetCoverTransition();


    mode =
        "back";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    /*
        Back cover is white.

        If you later have a real back cover,
        render that image/page here.
    */

    clearCanvas(
        closedCanvas
    );


    counter.textContent =
        "Back Cover";


    prevButton.disabled =
        false;


    nextButton.disabled =
        true;


    isAnimating =
        false;

}


/* =========================================================
   GET LAST LEFT PAGE
========================================================= */

function getLastLeftPage() {


    let lastLeft;


    if (

        totalPages % 2 === 1

    ) {


        /*
            Example:

            13 pages -> 12 + 13
        */

        lastLeft =
            totalPages - 1;


    }

    else {


        lastLeft =
            totalPages;

    }


    if (

        lastLeft % 2 !== 0

    ) {


        lastLeft--;

    }


    return Math.max(

        2,

        lastLeft

    );

}


/* =========================================================
   FRONT COVER -> OPEN BOOK
========================================================= */

async function openFrontCover() {


    isAnimating =
        true;


    /*
        Hide closed single cover.
    */

    closedBook.style.display =
        "none";


    /*
        Show full book underneath.
    */

    openBook.style.display =
        "block";


    mode =
        "open";


    /*
        First visible interior.

        Blank left side.
        PDF page 2 on right.
    */

    clearCanvas(
        leftCanvas
    );


    await renderPage(

        2,

        rightCanvas

    );


    /*
        Front of moving cover = PDF page 1.
    */

    await renderPage(

        1,

        coverFrontCanvas

    );


    /*
        Inside of front cover = white.
    */

    clearCanvas(
        coverBackCanvas
    );


    coverTransition.style.display =
        "block";


    coverTransition.classList.remove(
        "open-front"
    );


    void coverTransition.offsetWidth;


    coverTransition.classList.add(
        "open-front"
    );


    /*
        Finish with normal 2–3 spread.
    */

    setTimeout(

        async function() {


            resetCoverTransition();


            await renderSpread(
                2
            );


            mode =
                "open";


            prevButton.disabled =
                false;


            nextButton.disabled =
                false;


            isAnimating =
                false;


        },

        COVER_TIME

    );

}


/* =========================================================
   FIRST SPREAD -> FRONT COVER
========================================================= */

async function closeFrontCover() {


    isAnimating =
        true;


    /*
        Interior underneath.
    */

    clearCanvas(
        leftCanvas
    );


    await renderPage(

        2,

        rightCanvas

    );


    /*
        Inside cover.
    */

    clearCanvas(
        coverFrontCanvas
    );


    /*
        Outside/front = PDF page 1.
    */

    await renderPage(

        1,

        coverBackCanvas

    );


    coverTransition.style.display =
        "block";


    coverTransition.classList.remove(
        "close-front"
    );


    void coverTransition.offsetWidth;


    coverTransition.classList.add(
        "close-front"
    );


    setTimeout(

        async function() {


            resetCoverTransition();


            await showFront();


        },

        COVER_TIME

    );

}


/* =========================================================
   LAST SPREAD -> CLOSED BACK COVER
========================================================= */

async function closeBackCover() {


    isAnimating =
        true;


    /*
        White inside/outside back cover.
    */

    clearCanvas(
        coverFrontCanvas
    );


    clearCanvas(
        coverBackCanvas
    );


    coverTransition.style.display =
        "block";


    coverTransition.classList.remove(
        "close-back"
    );


    void coverTransition.offsetWidth;


    coverTransition.classList.add(
        "close-back"
    );


    setTimeout(

        function() {


            resetCoverTransition();


            showBack();


        },

        COVER_TIME

    );

}


/* =========================================================
   CLOSED BACK -> LAST SPREAD
========================================================= */

async function openBackCover() {


    isAnimating =
        true;


    const lastLeft =
        getLastLeftPage();


    closedBook.style.display =
        "none";


    openBook.style.display =
        "block";


    mode =
        "open";


    /*
        Last spread waiting underneath.
    */

    await renderSpread(
        lastLeft
    );


    /*
        Back cover.
    */

    clearCanvas(
        coverFrontCanvas
    );


    clearCanvas(
        coverBackCanvas
    );


    coverTransition.style.display =
        "block";


    coverTransition.classList.remove(
        "open-back"
    );


    void coverTransition.offsetWidth;


    coverTransition.classList.add(
        "open-back"
    );


    setTimeout(

        function() {


            resetCoverTransition();


            prevButton.disabled =
                false;


            nextButton.disabled =
                false;


            isAnimating =
                false;


        },

        COVER_TIME

    );

}


/* =========================================================
   NEXT
========================================================= */

async function goNext() {


    if (
        isAnimating
    ) {

        return;

    }


    /* =====================================================
       FRONT COVER
    ===================================================== */

    if (

        mode === "front"

    ) {


        await openFrontCover();


        return;

    }


    /* =====================================================
       ALREADY AT BACK
    ===================================================== */

    if (

        mode === "back"

    ) {


        return;

    }


    const currentLeft =
        leftPageNumber;


    const currentRight =
        currentLeft + 1;


    const nextLeft =
        currentLeft + 2;


    const nextRight =
        currentLeft + 3;


    /* =====================================================
       LAST SPREAD -> BACK COVER
    ===================================================== */

    if (

        nextLeft >
        totalPages

    ) {


        await closeBackCover();


        return;

    }


    /* =====================================================
       NORMAL NEXT PAGE
    ===================================================== */

    isAnimating =
        true;


    /*
        Moving sheet front:

        current RIGHT page.
    */

    await renderPage(

        currentRight,

        flipFrontCanvas

    );


    /*
        Moving sheet back:

        next LEFT page.
    */

    await renderPage(

        nextLeft,

        flipBackCanvas

    );


    /*
        New RIGHT page waits underneath.
    */

    await renderPage(

        nextRight,

        rightCanvas

    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-next"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-next"
    );


    /*
        Once sheet crosses center,
        replace underlying left page.
    */

    setTimeout(

        async function() {


            await renderPage(

                nextLeft,

                leftCanvas

            );


        },

        TURN_TIME * 0.53

    );


    /*
        Finish.
    */

    setTimeout(

        function() {


            leftPageNumber =
                nextLeft;


            resetFlip();


            updateSpreadCounter();


            isAnimating =
                false;


        },

        TURN_TIME

    );

}


/* =========================================================
   PREVIOUS
========================================================= */

async function goPrevious() {


    if (
        isAnimating
    ) {

        return;

    }


    /* =====================================================
       FRONT
    ===================================================== */

    if (

        mode === "front"

    ) {


        return;

    }


    /* =====================================================
       BACK COVER -> LAST SPREAD
    ===================================================== */

    if (

        mode === "back"

    ) {


        await openBackCover();


        return;

    }


    /* =====================================================
       FIRST SPREAD -> FRONT COVER
    ===================================================== */

    if (

        leftPageNumber <= 2

    ) {


        await closeFrontCover();


        return;

    }


    /* =====================================================
       NORMAL PREVIOUS
    ===================================================== */

    isAnimating =
        true;


    const currentLeft =
        leftPageNumber;


    const previousLeft =
        currentLeft - 2;


    const previousRight =
        currentLeft - 1;


    /*
        Moving sheet front:

        current LEFT page.
    */

    await renderPage(

        currentLeft,

        flipFrontCanvas

    );


    /*
        Moving sheet back:

        previous RIGHT page.
    */

    await renderPage(

        previousRight,

        flipBackCanvas

    );


    /*
        Previous LEFT waits underneath.
    */

    await renderPage(

        previousLeft,

        leftCanvas

    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-prev"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-prev"
    );


    /*
        Cross center.
    */

    setTimeout(

        async function() {


            await renderPage(

                previousRight,

                rightCanvas

            );


        },

        TURN_TIME * 0.53

    );


    /*
        Finish.
    */

    setTimeout(

        function() {


            leftPageNumber =
                previousLeft;


            resetFlip();


            updateSpreadCounter();


            isAnimating =
                false;


        },

        TURN_TIME

    );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

prevButton.addEventListener(

    "click",

    function(event) {


        event.preventDefault();


        goPrevious();

    }

);


nextButton.addEventListener(

    "click",

    function(event) {


        event.preventDefault();


        goNext();

    }

);


/* =========================================================
   CLICK CLOSED BOOK
========================================================= */

closedBook.addEventListener(

    "click",

    function() {


        if (

            mode === "front"

        ) {


            goNext();


        }

        else if (

            mode === "back"

        ) {


            goPrevious();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key ===
            "ArrowRight"

        ) {


            goNext();

        }


        if (

            event.key ===
            "ArrowLeft"

        ) {


            goPrevious();

        }

    }

);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(

    "resize",

    function() {


        clearTimeout(
            resizeTimer
        );


        resizeTimer =

            setTimeout(

                async function() {


                    if (

                        !pdf ||

                        isAnimating

                    ) {


                        return;

                    }


                    calculateSize();


                    if (

                        mode === "front"

                    ) {


                        await showFront();


                    }

                    else if (

                        mode === "back"

                    ) {


                        showBack();


                    }

                    else {


                        await showSpread(

                            leftPageNumber

                        );

                    }


                },

                150

            );

    }

);


/* =========================================================
   START
========================================================= */

async function start() {


    try {


        pdf =

            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =
            pdf.numPages;


        await getPdfRatio();


        calculateSize();


        loading.style.display =
            "none";


        await showFront();


    }

    catch(error) {


        console.error(
            error
        );


        loading.textContent =
            "Could not load catalogue.pdf";

    }

}


start();

</script>
