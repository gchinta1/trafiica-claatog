<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #eee;
}

#stage {
    height: calc(100% - 54px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
        radial-gradient(
            ellipse at center,
            #303030 0,
            #222 50%,
            #151515 100%
        );
}

#book {
    visibility: hidden;
}

#loading {
    position: absolute;
}

footer {
    height: 54px;
    background: #101010;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

button {
    width: 42px;
    height: 38px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #292929;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
}

button:hover {
    background: #383838;
}

#count {
    min-width: 170px;
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="stage">
    <div id="loading">Preparing catalogue…</div>
    <div id="book"></div>
</div>

<footer>
    <button id="prev">‹</button>
    <span id="count">Cover</span>
    <button id="next">›</button>
</footer>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const stage = document.getElementById("stage");
const book = document.getElementById("book");
const count = document.getElementById("count");

let flip;
let total = 0;


/* =========================================
   LOAD PDF
========================================= */

async function start() {

    const pdf = await pdfjsLib
        .getDocument("catalogue.pdf")
        .promise;

    total = pdf.numPages;

    const images = [];

    let ratio = 0;


    /* =====================================
       CONVERT PDF PAGES TO IMAGES
    ===================================== */

    for (let n = 1; n <= total; n++) {

        const page = await pdf.getPage(n);

        const viewport =
            page.getViewport({ scale: 2 });

        if (!ratio) {
            ratio =
                viewport.width /
                viewport.height;
        }

        const canvas =
            document.createElement("canvas");

        canvas.width =
            Math.round(viewport.width);

        canvas.height =
            Math.round(viewport.height);

        await page.render({
            canvasContext:
                canvas.getContext("2d"),
            viewport: viewport
        }).promise;

        images.push(
            canvas.toDataURL(
                "image/jpeg",
                0.96
            )
        );
    }


    /* =====================================
       BOOK SIZE
    ===================================== */

    const pageHeight =
        Math.floor(
            Math.min(
                stage.clientHeight * 0.90,
                (stage.clientWidth * 0.92) /
                (2 * ratio)
            )
        );

    const pageWidth =
        Math.floor(
            pageHeight * ratio
        );


    /* =====================================
       CREATE BOOK
    ===================================== */

    flip = new St.PageFlip(
        book,
        {
            width: pageWidth,
            height: pageHeight,

            size: "fixed",

            minWidth: pageWidth,
            maxWidth: pageWidth,

            minHeight: pageHeight,
            maxHeight: pageHeight,

            /*
             * IMPORTANT
             *
             * Page 1 = single front cover
             * Last page = single back cover
             */
            showCover: true,

            /*
             * Desktop book mode
             */
            usePortrait: false,

            autoSize: true,

            drawShadow: true,
            maxShadowOpacity: 0.58,

            flippingTime: 950,

            useMouseEvents: true,

            mobileScrollSupport: false,

            swipeDistance: 20,

            showPageCorners: true,

            disableFlipByClick: false
        }
    );


    /* =====================================
       LOAD PAGES
    ===================================== */

    flip.loadFromImages(images);


    /* =====================================
       EVENTS
    ===================================== */

    flip.on("flip", e => {
        updateCounter(e.data);
    });

    flip.on("init", e => {
        updateCounter(0);
    });


    book.style.visibility =
        "visible";

    document
        .getElementById("loading")
        .style.display = "none";

    updateCounter(0);
}


/* =========================================
   PAGE COUNTER
========================================= */

function updateCounter(index) {

    index = Number(index || 0);


    /* FRONT COVER */

    if (index === 0) {

        count.textContent =
            `Front Cover · Page 1 / ${total}`;

        return;
    }


    /* BACK COVER */

    if (index >= total - 1) {

        count.textContent =
            `Back Cover · Page ${total} / ${total}`;

        return;
    }


    /*
     * INSIDE SPREADS
     *
     * PDF:
     *
     * 1     = cover
     * 2–3   = spread
     * 4–5   = spread
     * 6–7   = spread
     * ...
     */

    let leftPage = index + 1;

    if (leftPage % 2 !== 0) {
        leftPage--;
    }

    const rightPage =
        Math.min(
            leftPage + 1,
            total
        );

    count.textContent =
        `Pages ${leftPage}–${rightPage} / ${total}`;
}


/* =========================================
   CONTROLS
========================================= */

document
    .getElementById("next")
    .onclick = () => {

        if (flip) {
            flip.flipNext("bottom");
        }

    };


document
    .getElementById("prev")
    .onclick = () => {

        if (flip) {
            flip.flipPrev("bottom");
        }

    };


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    e => {

        if (!flip) return;

        if (e.key === "ArrowRight") {
            flip.flipNext("bottom");
        }

        if (e.key === "ArrowLeft") {
            flip.flipPrev("bottom");
        }

    }
);


/* =========================================
   START
========================================= */

start().catch(error => {

    console.error(error);

    document
        .getElementById("loading")
        .textContent =
        "Could not load catalogue.pdf";

});

</script>

</body>
</html>
