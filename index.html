<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #181818;
    font-family: Arial, sans-serif;
    color: #fff;
}

#stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #151515 100%
        );
}

#loading {
    position: absolute;
    z-index: 1000;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #ddd;
}

#viewer {
    position: relative;
    width: 100%;
    height: 100%;
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;
    position: absolute;

    background: #fff;
    overflow: hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 3px 8px rgba(0,0,0,.35);

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    cursor: pointer;

    z-index: 20;
}

#closedCanvas {
    display: block;
    width: 100%;
    height: 100%;
}

#closedBook::before {
    content: "";
    position: absolute;
    z-index: 5;

    top: 0;
    left: 0;

    width: 10px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.20),
            rgba(0,0,0,.05),
            transparent
        );
}

#closedBook::after {
    content: "";
    position: absolute;
    z-index: 5;

    top: 0;
    right: 0;

    width: 8px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.15),
            transparent
        );
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: absolute;

    background: #fff;

    box-shadow:
        0 18px 45px rgba(0,0,0,.52);

    perspective: 2500px;
    transform-style: preserve-3d;

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    z-index: 10;
}


/* =========================================================
   STATIC PAGES
========================================================= */

.page {
    position: absolute;
    top: 0;

    overflow: hidden;

    background: #fff;
}

#leftPage {
    left: 0;
}

#rightPage {
    right: 0;
}

.page canvas {
    display: block;
    width: 100%;
    height: 100%;
}


/* LEFT INNER SHADOW */

#leftPage::after {
    content: "";

    position: absolute;
    z-index: 10;

    top: 0;
    right: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* RIGHT INNER SHADOW */

#rightPage::after {
    content: "";

    position: absolute;
    z-index: 10;

    top: 0;
    left: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* =========================================================
   CENTER SPINE
========================================================= */

#spine {
    position: absolute;
    z-index: 50;

    top: 0;
    bottom: 0;
    left: 50%;

    width: 16px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.13) 0%,
            rgba(0,0,0,.05) 25%,
            rgba(255,255,255,.18) 50%,
            rgba(0,0,0,.05) 75%,
            rgba(0,0,0,.13) 100%
        );
}


/* =========================================================
   FLIPPING PAGE
========================================================= */

#flipSheet {
    display: none;

    position: absolute;

    z-index: 100;

    top: 0;

    background: #fff;

    transform-style: preserve-3d;

    will-change: transform;
}

.flipFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: #fff;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flipFace canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#flipBack {
    transform: rotateY(180deg);
}

#flipShade {
    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.02),
            rgba(0,0,0,.24)
        );
}


/* =========================================================
   NEXT PAGE
========================================================= */

#flipSheet.flip-next {
    left: 50%;

    transform-origin: left center;

    animation:
        flipNext
        400ms
        cubic-bezier(.45,.05,.20,1)
        forwards;
}

#flipSheet.flip-next #flipShade {
    animation:
        flipShade
        400ms
        ease-in-out
        forwards;
}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

#flipSheet.flip-prev {
    left: 0;

    transform-origin: right center;

    animation:
        flipPrev
        400ms
        cubic-bezier(.45,.05,.20,1)
        forwards;
}

#flipSheet.flip-prev #flipShade {
    animation:
        flipShade
        400ms
        ease-in-out
        forwards;
}


/* =========================================================
   PAGE ANIMATIONS
========================================================= */

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(-25deg);
    }

    45% {
        transform: rotateY(-72deg);
    }

    55% {
        transform: rotateY(-108deg);
    }

    80% {
        transform: rotateY(-155deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}

@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(25deg);
    }

    45% {
        transform: rotateY(72deg);
    }

    55% {
        transform: rotateY(108deg);
    }

    80% {
        transform: rotateY(155deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}

@keyframes flipShade {

    0% {
        opacity: 0;
    }

    30% {
        opacity: .16;
    }

    50% {
        opacity: .36;
    }

    70% {
        opacity: .16;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 28px;

    background: #101010;

    border-top: 1px solid #333;
}

button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: #fff;

    font-size: 25px;

    cursor: pointer;
}

button:hover:not(:disabled) {
    background: #3b3b3b;
}

button:disabled {
    opacity: .25;
    cursor: default;
}

#counter {
    min-width: 230px;

    text-align: center;

    color: #ddd;

    font-size: 13px;
}


@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }

    footer {
        gap: 12px;
    }

    #counter {
        min-width: 150px;
    }
}
</style>
</head>


<body>

<div id="stage">

    <div id="loading">
        Loading catalogue...
    </div>

    <div id="viewer">


        <!-- SINGLE CLOSED FRONT / BACK COVER -->

        <div id="closedBook">
            <canvas id="closedCanvas"></canvas>
        </div>


        <!-- OPEN BOOK -->

        <div id="openBook">

            <div
                id="leftPage"
                class="page"
            >
                <canvas id="leftCanvas"></canvas>
            </div>

            <div
                id="rightPage"
                class="page"
            >
                <canvas id="rightCanvas"></canvas>
            </div>


            <!-- PAGE THAT ACTUALLY TURNS -->

            <div id="flipSheet">

                <div
                    id="flipFront"
                    class="flipFace"
                >
                    <canvas id="flipFrontCanvas"></canvas>
                </div>

                <div
                    id="flipBack"
                    class="flipFace"
                >
                    <canvas id="flipBackCanvas"></canvas>
                </div>

                <div id="flipShade"></div>

            </div>

            <div id="spine"></div>

        </div>

    </div>

</div>


<footer>

    <button
        id="prev"
        type="button"
        aria-label="Previous"
    >
        ‹
    </button>

    <div id="counter">
        Loading...
    </div>

    <button
        id="next"
        type="button"
        aria-label="Next"
    >
        ›
    </button>

</footer>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
   Keep your PDF in the same folder as index.html.

   When you replace the PDF but keep the same filename,
   change v=2 to v=3, v=4 etc. to avoid browser cache.
*/

const PDF_FILE = "catalogue.pdf?v=2";


/* Internal page turn */
const TURN_TIME = 400;


/* Front/back cover opening */
const COVER_TIME = 520;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const viewer =
    document.getElementById("viewer");

const loading =
    document.getElementById("loading");

const closedBook =
    document.getElementById("closedBook");

const closedCanvas =
    document.getElementById("closedCanvas");

const openBook =
    document.getElementById("openBook");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const leftCanvas =
    document.getElementById("leftCanvas");

const rightCanvas =
    document.getElementById("rightCanvas");

const flipSheet =
    document.getElementById("flipSheet");

const flipFrontCanvas =
    document.getElementById("flipFrontCanvas");

const flipBackCanvas =
    document.getElementById("flipBackCanvas");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const counter =
    document.getElementById("counter");


/* =========================================================
   STATE
========================================================= */

let pdf = null;

let totalPages = 0;

let pageRatio = 1;

let displayWidth = 0;

let displayHeight = 0;

let leftPageNumber = 2;

let mode = "front";

let isAnimating = false;


/* =========================================================
   HELPERS
========================================================= */

function wait(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


function nextFrame() {

    return new Promise(
        resolve =>
            requestAnimationFrame(
                () =>
                    requestAnimationFrame(resolve)
            )
    );

}


/* =========================================================
   GET PDF PAGE RATIO
========================================================= */

async function getPdfRatio() {

    const page =
        await pdf.getPage(1);

    const viewport =
        page.getViewport({
            scale: 1
        });

    pageRatio =
        viewport.width /
        viewport.height;

}


/* =========================================================
   CALCULATE BOOK SIZE
========================================================= */

function calculateSize() {

    const availableWidth =
        stage.clientWidth - 70;

    const availableHeight =
        stage.clientHeight - 40;


    /*
       Calculate the maximum size of TWO pages
       while keeping the original PDF aspect ratio.
    */

    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(
            availableHeight,
            heightFromWidth
        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(displayWidth);

    displayHeight =
        Math.floor(displayHeight);


    /* CLOSED BOOK */

    closedBook.style.width =
        displayWidth + "px";

    closedBook.style.height =
        displayHeight + "px";


    /* OPEN BOOK */

    openBook.style.width =
        (displayWidth * 2) + "px";

    openBook.style.height =
        displayHeight + "px";


    leftPage.style.width =
        displayWidth + "px";

    leftPage.style.height =
        displayHeight + "px";


    rightPage.style.width =
        displayWidth + "px";

    rightPage.style.height =
        displayHeight + "px";


    flipSheet.style.width =
        displayWidth + "px";

    flipSheet.style.height =
        displayHeight + "px";


    positionBooks();

}


/* =========================================================
   CENTER BOOK
========================================================= */

function positionBooks() {

    const centerX =
        viewer.clientWidth / 2;

    const centerY =
        viewer.clientHeight / 2;


    /* SINGLE COVER */

    closedBook.style.left =
        Math.round(
            centerX -
            displayWidth / 2
        ) + "px";

    closedBook.style.top =
        Math.round(
            centerY -
            displayHeight / 2
        ) + "px";


    /* OPEN TWO-PAGE BOOK */

    openBook.style.left =
        Math.round(
            centerX -
            displayWidth
        ) + "px";

    openBook.style.top =
        Math.round(
            centerY -
            displayHeight / 2
        ) + "px";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(
    pageNumber,
    canvas
) {

    if (
        pageNumber < 1 ||
        pageNumber > totalPages
    ) {

        clearCanvas(canvas);

        return;
    }


    const page =
        await pdf.getPage(pageNumber);


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const baseViewport =
        page.getViewport({
            scale: 1
        });


    /*
       Scale according to PAGE WIDTH.

       This prevents the zoom/cropping problem.
    */

    const scale =
        (displayWidth * dpr) /
        baseViewport.width;


    const viewport =
        page.getViewport({
            scale: scale
        });


    canvas.width =
        Math.round(viewport.width);

    canvas.height =
        Math.round(viewport.height);


    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    await page.render({

        canvasContext: ctx,
        viewport: viewport

    }).promise;

}


/* =========================================================
   BLANK PAGE
========================================================= */

function clearCanvas(canvas) {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            displayWidth * dpr
        );

    canvas.height =
        Math.round(
            displayHeight * dpr
        );


    canvas.style.width =
        displayWidth + "px";

    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   RESET FLIP PAGE
========================================================= */

function resetFlip() {

    flipSheet.classList.remove(
        "flip-next",
        "flip-prev"
    );

    flipSheet.style.display =
        "none";

    flipSheet.style.transform =
        "";

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter() {

    if (
        mode === "front"
    ) {

        counter.textContent =
            `Front Cover · Page 1 / ${totalPages}`;

        return;
    }


    if (
        mode === "back"
    ) {

        counter.textContent =
            "Back Cover";

        return;
    }


    if (
        leftPageNumber + 1 <= totalPages
    ) {

        counter.textContent =
            `Pages ${leftPageNumber}–${leftPageNumber + 1} / ${totalPages}`;

    }

    else {

        counter.textContent =
            `Page ${leftPageNumber} / ${totalPages}`;

    }

}


/* =========================================================
   FIND LAST SPREAD
========================================================= */

function getLastLeftPage() {

    let result;


    if (
        totalPages % 2 === 1
    ) {

        result =
            totalPages - 1;

    }

    else {

        result =
            totalPages;

    }


    if (
        result % 2 !== 0
    ) {

        result--;

    }


    return Math.max(
        2,
        result
    );

}


/* =========================================================
   RENDER OPEN SPREAD
========================================================= */

async function renderSpread(
    requestedLeft
) {

    requestedLeft =
        Math.max(
            2,
            requestedLeft
        );


    if (
        requestedLeft % 2 !== 0
    ) {

        requestedLeft--;

    }


    leftPageNumber =
        requestedLeft;


    await Promise.all([

        renderPage(
            leftPageNumber,
            leftCanvas
        ),

        renderPage(
            leftPageNumber + 1,
            rightCanvas
        )

    ]);


    updateCounter();

}


/* =========================================================
   SHOW FRONT COVER
========================================================= */

async function showFront() {

    resetFlip();


    mode =
        "front";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    await renderPage(
        1,
        closedCanvas
    );


    updateCounter();


    prevButton.disabled =
        true;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   SHOW NORMAL SPREAD
========================================================= */

async function showSpread(
    page
) {

    resetFlip();


    mode =
        "open";


    closedBook.style.display =
        "none";


    openBook.style.display =
        "block";


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    await renderSpread(page);


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   SHOW BACK COVER
========================================================= */

function showBack() {

    resetFlip();


    mode =
        "back";


    openBook.style.display =
        "none";


    closedBook.style.display =
        "block";


    clearCanvas(
        closedCanvas
    );


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        true;


    isAnimating =
        false;

}


/* =========================================================
   FRONT COVER -> OPEN BOOK
========================================================= */

async function openFromFront() {

    if (isAnimating) {
        return;
    }


    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    /*
       Prepare pages 2 and 3 before animation.
    */

    await renderSpread(2);


    openBook.style.display =
        "block";


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "0";

    openBook.style.transform =
        "translateX(24px) scale(.965)";


    closedBook.style.display =
        "block";

    closedBook.style.zIndex =
        "30";


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    await nextFrame();


    /*
       Smooth opening.

       No 180 degree cover rotation.
       This avoids the giant triangle / white page bug.
    */

    closedBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .72}ms ease
        `;


    openBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .82}ms ease
        `;


    closedBook.style.transform =
        `translateX(${-displayWidth * .47}px) scale(.985)`;

    closedBook.style.opacity =
        "0";


    openBook.style.transform =
        "translateX(0) scale(1)";

    openBook.style.opacity =
        "1";


    await wait(
        COVER_TIME
    );


    closedBook.style.display =
        "none";

    closedBook.style.zIndex =
        "20";


    closedBook.style.transition =
        "";

    openBook.style.transition =
        "";


    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    mode =
        "open";

    leftPageNumber =
        2;


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   FIRST SPREAD -> FRONT COVER
========================================================= */

async function closeToFront() {

    if (isAnimating) {
        return;
    }


    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    await renderPage(
        1,
        closedCanvas
    );


    closedBook.style.display =
        "block";

    closedBook.style.zIndex =
        "30";


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "0";

    closedBook.style.transform =
        `translateX(${-displayWidth * .47}px) scale(.985)`;


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    await nextFrame();


    closedBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .80}ms ease
        `;


    openBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .70}ms ease
        `;


    openBook.style.transform =
        "translateX(24px) scale(.965)";

    openBook.style.opacity =
        "0";


    closedBook.style.transform =
        "translateX(0) scale(1)";

    closedBook.style.opacity =
        "1";


    await wait(
        COVER_TIME
    );


    openBook.style.display =
        "none";


    openBook.style.transition =
        "";

    closedBook.style.transition =
        "";


    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    closedBook.style.zIndex =
        "20";


    mode =
        "front";


    updateCounter();


    prevButton.disabled =
        true;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   LAST SPREAD -> BACK COVER
========================================================= */

async function closeToBack() {

    if (isAnimating) {
        return;
    }


    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    /*
       Blank white back cover.
       If your PDF contains an actual back-cover page,
       see the note below.
    */

    clearCanvas(
        closedCanvas
    );


    closedBook.style.display =
        "block";

    closedBook.style.zIndex =
        "30";


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "0";

    closedBook.style.transform =
        `translateX(${displayWidth * .47}px) scale(.985)`;


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    await nextFrame();


    closedBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .80}ms ease
        `;


    openBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .72}ms ease
        `;


    openBook.style.transform =
        "translateX(-24px) scale(.965)";

    openBook.style.opacity =
        "0";


    closedBook.style.transform =
        "translateX(0) scale(1)";

    closedBook.style.opacity =
        "1";


    await wait(
        COVER_TIME
    );


    openBook.style.display =
        "none";


    openBook.style.transition =
        "";

    closedBook.style.transition =
        "";


    openBook.style.opacity =
        "1";

    openBook.style.transform =
        "translateX(0) scale(1)";


    closedBook.style.zIndex =
        "20";


    mode =
        "back";


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        true;


    isAnimating =
        false;

}


/* =========================================================
   BACK COVER -> LAST SPREAD
========================================================= */

async function openFromBack() {

    if (isAnimating) {
        return;
    }


    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    const lastLeft =
        getLastLeftPage();


    await renderSpread(
        lastLeft
    );


    openBook.style.display =
        "block";


    openBook.style.transition =
        "none";

    openBook.style.opacity =
        "0";

    openBook.style.transform =
        "translateX(-24px) scale(.965)";


    closedBook.style.display =
        "block";

    closedBook.style.zIndex =
        "30";


    closedBook.style.transition =
        "none";

    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    await nextFrame();


    openBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .82}ms ease
        `;


    closedBook.style.transition =
        `
        transform ${COVER_TIME}ms cubic-bezier(.22,.8,.25,1),
        opacity ${COVER_TIME * .70}ms ease
        `;


    closedBook.style.transform =
        `translateX(${displayWidth * .47}px) scale(.985)`;

    closedBook.style.opacity =
        "0";


    openBook.style.transform =
        "translateX(0) scale(1)";

    openBook.style.opacity =
        "1";


    await wait(
        COVER_TIME
    );


    closedBook.style.display =
        "none";

    closedBook.style.zIndex =
        "20";


    openBook.style.transition =
        "";

    closedBook.style.transition =
        "";


    closedBook.style.opacity =
        "1";

    closedBook.style.transform =
        "translateX(0) scale(1)";


    mode =
        "open";

    leftPageNumber =
        lastLeft;


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   NEXT PAGE
========================================================= */

async function goNext() {

    if (isAnimating) {
        return;
    }


    /*
       FRONT COVER -> FIRST SPREAD
    */

    if (
        mode === "front"
    ) {

        await openFromFront();

        return;
    }


    /*
       Already at back cover
    */

    if (
        mode === "back"
    ) {

        return;
    }


    const currentLeft =
        leftPageNumber;

    const currentRight =
        currentLeft + 1;

    const nextLeft =
        currentLeft + 2;

    const nextRight =
        currentLeft + 3;


    /*
       END OF PDF -> BACK COVER
    */

    if (
        nextLeft > totalPages
    ) {

        await closeToBack();

        return;
    }


    /*
       NORMAL PAGE TURN
    */

    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    /*
       Front of moving sheet =
       current RIGHT page.
    */

    await renderPage(
        currentRight,
        flipFrontCanvas
    );


    /*
       Back of moving sheet =
       next LEFT page.
    */

    await renderPage(
        nextLeft,
        flipBackCanvas
    );


    /*
       Prepare new right page underneath.
    */

    await renderPage(
        nextRight,
        rightCanvas
    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-next"
    );


    /*
       Force animation restart.
    */

    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-next"
    );


    /*
       At approximately the middle of the turn,
       replace the left static page.
    */

    setTimeout(

        () => {

            renderPage(
                nextLeft,
                leftCanvas
            );

        },

        TURN_TIME * .48

    );


    await wait(
        TURN_TIME
    );


    leftPageNumber =
        nextLeft;


    resetFlip();


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

async function goPrevious() {

    if (isAnimating) {
        return;
    }


    /*
       Already at front cover.
    */

    if (
        mode === "front"
    ) {

        return;
    }


    /*
       BACK COVER -> LAST SPREAD
    */

    if (
        mode === "back"
    ) {

        await openFromBack();

        return;
    }


    /*
       FIRST SPREAD -> FRONT COVER
    */

    if (
        leftPageNumber <= 2
    ) {

        await closeToFront();

        return;
    }


    /*
       NORMAL BACKWARD TURN
    */

    isAnimating =
        true;


    prevButton.disabled =
        true;

    nextButton.disabled =
        true;


    const currentLeft =
        leftPageNumber;

    const previousLeft =
        currentLeft - 2;

    const previousRight =
        currentLeft - 1;


    /*
       Current left page becomes
       the moving sheet.
    */

    await renderPage(
        currentLeft,
        flipFrontCanvas
    );


    /*
       Back side of moving sheet.
    */

    await renderPage(
        previousRight,
        flipBackCanvas
    );


    /*
       Prepare previous left page underneath.
    */

    await renderPage(
        previousLeft,
        leftCanvas
    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-prev"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-prev"
    );


    /*
       Swap right page around the midpoint.
    */

    setTimeout(

        () => {

            renderPage(
                previousRight,
                rightCanvas
            );

        },

        TURN_TIME * .48

    );


    await wait(
        TURN_TIME
    );


    leftPageNumber =
        previousLeft;


    resetFlip();


    updateCounter();


    prevButton.disabled =
        false;

    nextButton.disabled =
        false;


    isAnimating =
        false;

}


/* =========================================================
   BUTTONS
========================================================= */

prevButton.addEventListener(
    "click",
    goPrevious
);


nextButton.addEventListener(
    "click",
    goNext
);


/* =========================================================
   CLICK CLOSED COVER
========================================================= */

closedBook.addEventListener(

    "click",

    () => {

        if (
            mode === "front"
        ) {

            goNext();

        }

        else if (
            mode === "back"
        ) {

            goPrevious();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    event => {

        if (
            event.key === "ArrowRight"
        ) {

            goNext();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            goPrevious();

        }

    }

);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(

    "resize",

    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(

                async () => {

                    if (
                        !pdf ||
                        isAnimating
                    ) {

                        return;
                    }


                    calculateSize();


                    if (
                        mode === "front"
                    ) {

                        await showFront();

                    }

                    else if (
                        mode === "back"
                    ) {

                        showBack();

                    }

                    else {

                        await showSpread(
                            leftPageNumber
                        );

                    }

                },

                150

            );

    }

);


/* =========================================================
   LOAD PDF
========================================================= */

async function start() {

    try {

        pdf =
            await pdfjsLib
                .getDocument(
                    PDF_FILE
                )
                .promise;


        totalPages =
            pdf.numPages;


        await getPdfRatio();


        calculateSize();


        loading.style.display =
            "none";


        await showFront();

    }

    catch(error) {

        console.error(error);


        loading.textContent =
            "Could not load catalogue.pdf";

    }

}


start();

</script>
