
<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INTERSPORT Digital Catalogue</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #181818;

    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    position: relative;

    width: 100%;
    height: calc(100vh - 58px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            ellipse at center,
            #292929 0%,
            #1c1c1c 60%,
            #111 100%
        );
}


#viewer {
    position: relative;

    width: 100%;
    height: 100%;
}


/* =========================================================
   INTERSPORT INTRO
========================================================= */

#loading {
    position: absolute;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #191919 55%,
            #101010 100%
        );

    transition:
        opacity .6s ease,
        visibility .6s ease;
}


#loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


.introBrand {
    display: flex;
    flex-direction: column;
    align-items: center;

    animation:
        introAppear
        .8s
        ease
        forwards;
}


.introLogo {
    font-size: 34px;
    font-weight: 800;

    letter-spacing: 1px;

    color: #fff;
}


.introLine {
    width: 44px;
    height: 2px;

    margin: 16px 0 20px;

    background: #fff;

    opacity: .85;
}


.introTitle {
    font-size: 14px;
    font-weight: 600;

    letter-spacing: 4px;

    color: #eee;

    margin-bottom: 9px;
}


.introSubtitle {
    font-size: 12px;

    color: #888;

    letter-spacing: .7px;

    margin-bottom: 26px;
}


.loaderBar {
    position: relative;

    width: 190px;
    height: 2px;

    overflow: hidden;

    background: #333;

    border-radius: 10px;
}


.loaderProgress {
    position: absolute;

    width: 45%;
    height: 100%;

    left: -45%;

    background: #fff;

    animation:
        loadingMove
        1.2s
        ease-in-out
        infinite;
}


@keyframes loadingMove {

    0% {
        left: -45%;
    }

    100% {
        left: 100%;
    }
}


@keyframes introAppear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   CLOSED BOOK
========================================================= */

#closedBook {
    display: none;

    position: absolute;

    background: #fff;

    overflow: hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.55),
        0 3px 8px rgba(0,0,0,.35);

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    cursor: pointer;

    z-index: 20;
}


#closedCanvas {
    display: block;

    width: 100%;
    height: 100%;
}


#closedBook::before {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    left: 0;

    width: 9px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.20),
            rgba(0,0,0,.05),
            transparent
        );
}


#closedBook::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;
    right: 0;

    width: 7px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.14),
            transparent
        );
}


/* =========================================================
   OPEN BOOK
========================================================= */

#openBook {
    display: none;

    position: absolute;

    background: #fff;

    box-shadow:
        0 18px 45px rgba(0,0,0,.52);

    perspective: 2500px;

    transform-style: preserve-3d;

    transform-origin: center center;

    will-change:
        transform,
        opacity;

    z-index: 10;
}


/* =========================================================
   STATIC PAGES
========================================================= */

.page {
    position: absolute;

    top: 0;

    overflow: hidden;

    background: #fff;
}


#leftPage {
    left: 0;
}


#rightPage {
    right: 0;
}


.page canvas {
    display: block;

    width: 100%;
    height: 100%;
}


/* left page inner shadow */

#leftPage::after {
    content: "";

    position: absolute;

    z-index: 10;

    top: 0;
    right: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* right page inner shadow */

#rightPage::after {
    content: "";

    position: absolute;

    z-index: 10;

    top: 0;
    left: 0;

    width: 30px;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05),
            transparent
        );
}


/* =========================================================
   SPINE
========================================================= */

#spine {
    position: absolute;

    z-index: 50;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 16px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.13) 0%,
            rgba(0,0,0,.05) 25%,
            rgba(255,255,255,.18) 50%,
            rgba(0,0,0,.05) 75%,
            rgba(0,0,0,.13) 100%
        );
}


/* =========================================================
   FLIPPING PAGE
========================================================= */

#flipSheet {
    display: none;

    position: absolute;

    z-index: 100;

    top: 0;

    background: #fff;

    transform-style: preserve-3d;

    will-change: transform;
}


.flipFace {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: #fff;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


.flipFace canvas {
    display: block;

    width: 100%;
    height: 100%;
}


#flipBack {
    transform: rotateY(180deg);
}


#flipShade {
    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.02),
            rgba(0,0,0,.24)
        );
}


/* =========================================================
   NEXT PAGE
========================================================= */

#flipSheet.flip-next {
    left: 50%;

    transform-origin: left center;

    animation:
        flipNext
        650ms
        cubic-bezier(.42,0,.20,1)
        forwards;
}


#flipSheet.flip-next #flipShade {
    animation:
        flipShade
        650ms
        ease-in-out
        forwards;
}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

#flipSheet.flip-prev {
    left: 0;

    transform-origin: right center;

    animation:
        flipPrev
        650ms
        cubic-bezier(.42,0,.20,1)
        forwards;
}


#flipSheet.flip-prev #flipShade {
    animation:
        flipShade
        650ms
        ease-in-out
        forwards;
}


/* =========================================================
   PAGE FLIP ANIMATIONS
========================================================= */

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(-25deg);
    }

    45% {
        transform: rotateY(-72deg);
    }

    55% {
        transform: rotateY(-108deg);
    }

    80% {
        transform: rotateY(-155deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    20% {
        transform: rotateY(25deg);
    }

    45% {
        transform: rotateY(72deg);
    }

    55% {
        transform: rotateY(108deg);
    }

    80% {
        transform: rotateY(155deg);
    }

    100% {
        transform: rotateY(180deg);
    }
}


@keyframes flipShade {

    0% {
        opacity: 0;
    }

    30% {
        opacity: .12;
    }

    50% {
        opacity: .24;
    }

    70% {
        opacity: .12;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   THANK YOU SCREEN
========================================================= */

#thankYouScreen {
    display: none;

    position: absolute;

    inset: 0;

    z-index: 300;

    align-items: center;
    justify-content: center;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #191919 55%,
            #101010 100%
        );

    transition:
        opacity .55s ease;
}


#thankYouScreen.show {
    opacity: 1;
}


.thankYouContent {
    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}


.thankYouLogo {
    font-size: 34px;

    font-weight: 800;

    letter-spacing: 1px;

    color: #fff;
}


.thankYouLine {
    width: 44px;
    height: 2px;

    margin: 16px 0 25px;

    background: #fff;

    opacity: .85;
}


.thankYouTitle {
    font-size: 20px;

    font-weight: 600;

    letter-spacing: 5px;

    color: #fff;

    margin-bottom: 12px;
}


.thankYouText {
    font-size: 13px;

    color: #999;

    margin-bottom: 30px;
}


#restartCatalogue {
    width: auto;

    height: 40px;

    padding: 0 24px;

    border: 1px solid #666;

    border-radius: 5px;

    background: transparent;

    color: #fff;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}


#restartCatalogue:hover {
    background: #fff;

    color: #111;

    border-color: #fff;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 26px;

    background: #101010;

    border-top: 1px solid #333;
}


button {
    width: 48px;
    height: 40px;

    border: 1px solid #444;

    border-radius: 7px;

    background: #292929;

    color: #fff;

    font-size: 25px;

    cursor: pointer;
}


button:hover:not(:disabled) {
    background: #3b3b3b;
}


button:disabled {
    opacity: .25;

    cursor: default;
}


/* =========================================================
   PAGE SELECTOR
========================================================= */

#pageControl {
    min-width: 230px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    color: #ddd;

    font-size: 13px;
}


#pageLabel {
    color: #999;
}


#pageInput {
    width: 58px;
    height: 34px;

    padding: 0 6px;

    text-align: center;

    font-size: 14px;
    font-weight: 600;

    color: #fff;

    background: #202020;

    border: 1px solid #555;

    border-radius: 6px;

    outline: none;

    transition:
        border-color .2s ease,
        background .2s ease;
}


#pageInput:hover {
    border-color: #777;
}


#pageInput:focus {
    border-color: #aaa;

    background: #292929;
}


#pageTotal {
    min-width: 38px;

    text-align: left;
}


#pageInput::-webkit-inner-spin-button,
#pageInput::-webkit-outer-spin-button {
    -webkit-appearance: none;

    margin: 0;
}


#pageInput {
    -moz-appearance: textfield;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #stage {
        padding: 8px;
    }


    footer {
        gap: 10px;
    }


    #pageControl {
        min-width: 145px;
    }


    #pageLabel {
        display: none;
    }


    .introLogo,
    .thankYouLogo {
        font-size: 28px;
    }

}


/* Detail viewer: scrollable high-resolution single PDF page */
#detailOverlay {position:fixed;inset:0;z-index:5000;background:#151515;display:none;flex-direction:column;color:white}
#detailToolbar {height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;background:#101010;border-bottom:1px solid #444}
#detailToolbar button {font-size:16px;width:auto;min-width:42px;padding:0 12px}
#detailScroll {flex:1;overflow:auto;text-align:center;padding:22px;overscroll-behavior:contain}
#detailCanvas {display:block;margin:0 auto;box-shadow:0 10px 32px #0009;max-width:none;background:white}
#zoomOpen {width:auto;padding:0 15px;font-size:14px}
@media(max-width:700px){#detailToolbar{gap:5px}#detailToolbar button{padding:0 8px;min-width:35px}#detailScroll{padding:8px}}
</style>

</head>


<body>


<!-- =======================================================
     MAIN STAGE
======================================================== -->

<div id="stage">


    <!-- ===================================================
         INTERSPORT INTRO
    ==================================================== -->

    <div id="loading">

        <div class="introBrand">

            <div class="introLogo">
                INTERSPORT
            </div>

            <div class="introLine"></div>

            <div class="introTitle">
                DIGITAL CATALOGUE
            </div>

            <div class="introSubtitle">
                Explore our latest collection
            </div>

            <div class="loaderBar">

                <div class="loaderProgress"></div>

            </div>

        </div>

    </div>


    <!-- ===================================================
         VIEWER
    ==================================================== -->

    <div id="viewer">


        <!-- CLOSED FRONT / BACK COVER -->

        <div id="closedBook">

            <canvas id="closedCanvas"></canvas>

        </div>


        <!-- OPEN BOOK -->

        <div id="openBook">


            <!-- LEFT PAGE -->

            <div
                id="leftPage"
                class="page"
            >

                <canvas id="leftCanvas"></canvas>

            </div>


            <!-- RIGHT PAGE -->

            <div
                id="rightPage"
                class="page"
            >

                <canvas id="rightCanvas"></canvas>

            </div>


            <!-- MOVING PAGE -->

            <div id="flipSheet">


                <div
                    id="flipFront"
                    class="flipFace"
                >

                    <canvas id="flipFrontCanvas"></canvas>

                </div>


                <div
                    id="flipBack"
                    class="flipFace"
                >

                    <canvas id="flipBackCanvas"></canvas>

                </div>


                <div id="flipShade"></div>


            </div>


            <div id="spine"></div>


        </div>


        <!-- =================================================
             THANK YOU
        ================================================== -->

        <div id="thankYouScreen">

            <div class="thankYouContent">


                <div class="thankYouLogo">
                    INTERSPORT
                </div>


                <div class="thankYouLine"></div>


                <div class="thankYouTitle">
                    THANK YOU
                </div>


                <div class="thankYouText">
                    Thank you for exploring our catalogue.
                </div>


                <button
                    id="restartCatalogue"
                    type="button"
                >
                    VIEW AGAIN
                </button>


            </div>

        </div>


    </div>

</div>


<!-- =======================================================
     FOOTER
======================================================== -->

<footer>


    <button
        id="prev"
        type="button"
        aria-label="Previous page"
    >
        ‹
    </button>


    <div id="pageControl">

        <span id="pageLabel">
            Page
        </span>


        <input
            id="pageInput"
            type="number"
            min="1"
            value="1"
            aria-label="Go to page"
        >


        <span id="pageTotal">
            / 0
        </span>

    </div>


    <button
        id="next"
        type="button"
        aria-label="Next page"
    >
        ›
    </button>


<button id="zoomOpen" type="button" aria-label="Zoom catalogue page">Zoom +</button>
</footer>



<div id="detailOverlay" role="dialog" aria-modal="true" aria-label="Catalogue page zoom">
  <div id="detailToolbar">
    <button id="detailPrev" aria-label="Previous detail page">‹</button>
    <span id="detailCounter" style="font-size:13px;min-width:70px;text-align:center"></span>
    <button id="detailNext" aria-label="Next detail page">›</button>
    <button id="detailMinus" aria-label="Zoom out">−</button>
    <span id="detailZoomLabel" style="font-size:13px;min-width:45px;text-align:center">40%</span>
    <button id="detailPlus" aria-label="Zoom in">+</button>
    <button id="detailClose" aria-label="Close zoom">✕</button>
  </div>
  <div id="detailScroll"><canvas id="detailCanvas"></canvas></div>
</div>
<script>

/* =========================================================
   CONFIG
========================================================= */

/*
   PDF must be in the same folder.

   If you replace ADIDAS_Teamwear_Catalog_2026.pdf but keep the same name,
   change v=2 to v=3, v=4, etc.
*/

const PDF_FILE =
    "./ADIDAS_Teamwear_Catalog_2026.pdf?v=3";


/* Interior page flip */

const TURN_TIME =
    650;


/* Cover/open/close transition */

const COVER_TIME =
    650;


/* Thank-you delay after back cover */

const END_DELAY =
    800;


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");


const viewer =
    document.getElementById("viewer");


const loading =
    document.getElementById("loading");


const closedBook =
    document.getElementById("closedBook");


const closedCanvas =
    document.getElementById("closedCanvas");


const openBook =
    document.getElementById("openBook");


const leftPage =
    document.getElementById("leftPage");


const rightPage =
    document.getElementById("rightPage");


const leftCanvas =
    document.getElementById("leftCanvas");


const rightCanvas =
    document.getElementById("rightCanvas");


const flipSheet =
    document.getElementById("flipSheet");


const flipFrontCanvas =
    document.getElementById("flipFrontCanvas");


const flipBackCanvas =
    document.getElementById("flipBackCanvas");


const prevButton =
    document.getElementById("prev");


const nextButton =
    document.getElementById("next");


const pageInput =
    document.getElementById("pageInput");


const pageTotal =
    document.getElementById("pageTotal");


const pageLabel =
    document.getElementById("pageLabel");


const thankYouScreen =
    document.getElementById("thankYouScreen");


const restartCatalogue =
    document.getElementById("restartCatalogue");


/* =========================================================
   STATE
========================================================= */

let pdf =
    null;


let totalPages =
    0;


let pageRatio =
    1;


let displayWidth =
    0;


let displayHeight =
    0;


let leftPageNumber =
    2;


/*
   front
   open
   back
   thanks
*/

let mode =
    "front";


let isAnimating =
    false;


/* =========================================================
   HELPERS
========================================================= */

function wait(ms) {

    return new Promise(

        resolve =>
            setTimeout(
                resolve,
                ms
            )

    );

}


function nextFrame() {

    return new Promise(

        resolve =>

            requestAnimationFrame(

                () =>

                    requestAnimationFrame(
                        resolve
                    )

            )

    );

}


/* =========================================================
   PDF PAGE RATIO
========================================================= */

async function getPdfRatio() {

    const page =
        await pdf.getPage(1);


    const viewport =
        page.getViewport({

            scale: 1

        });


    pageRatio =
        viewport.width /
        viewport.height;

}


/* =========================================================
   SIZE
========================================================= */

function calculateSize() {

    const availableWidth =
        stage.clientWidth - 70;


    const availableHeight =
        stage.clientHeight - 40;


    const heightFromWidth =
        availableWidth /
        (2 * pageRatio);


    displayHeight =
        Math.min(

            availableHeight,

            heightFromWidth

        );


    displayWidth =
        displayHeight *
        pageRatio;


    displayWidth =
        Math.floor(
            displayWidth
        );


    displayHeight =
        Math.floor(
            displayHeight
        );


    /* CLOSED BOOK */

    closedBook.style.width =
        displayWidth + "px";


    closedBook.style.height =
        displayHeight + "px";


    /* OPEN BOOK */

    openBook.style.width =
        (displayWidth * 2) + "px";


    openBook.style.height =
        displayHeight + "px";


    /* LEFT */

    leftPage.style.width =
        displayWidth + "px";


    leftPage.style.height =
        displayHeight + "px";


    /* RIGHT */

    rightPage.style.width =
        displayWidth + "px";


    rightPage.style.height =
        displayHeight + "px";


    /* MOVING PAGE */

    flipSheet.style.width =
        displayWidth + "px";


    flipSheet.style.height =
        displayHeight + "px";


    positionBooks();

}


/* =========================================================
   CENTER BOOK
========================================================= */

function positionBooks() {

    const centerX =
        viewer.clientWidth / 2;


    const centerY =
        viewer.clientHeight / 2;


    /* CLOSED SINGLE PAGE */

    closedBook.style.left =
        Math.round(

            centerX -
            displayWidth / 2

        ) + "px";


    closedBook.style.top =
        Math.round(

            centerY -
            displayHeight / 2

        ) + "px";


    /* OPEN TWO-PAGE BOOK */

    openBook.style.left =
        Math.round(

            centerX -
            displayWidth

        ) + "px";


    openBook.style.top =
        Math.round(

            centerY -
            displayHeight / 2

        ) + "px";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

/* Virtual single pages: original PDF has portrait covers and landscape spreads. */
function virtualPage(n) {
    if (n === 1) return {source:1, half:null};
    if (n === totalPages) return {source:pdf.numPages, half:null};
    return {source:Math.floor((n-2)/2)+2, half:(n%2===0 ? 'left' : 'right')};
}

async function renderPage(
    pageNumber,
    canvas
) {

    if (

        pageNumber < 1 ||

        pageNumber > totalPages

    ) {

        clearCanvas(
            canvas
        );


        return;

    }


    const mapped = virtualPage(pageNumber);
    const page = await pdf.getPage(mapped.source);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const base = page.getViewport({scale:1});
    const sourceWidth = mapped.half ? base.width / 2 : base.width;
    const scale = displayWidth * dpr / sourceWidth;
    const widthPx = Math.round(displayWidth * dpr);
    const heightPx = Math.round(displayHeight * dpr);
    const viewport = page.getViewport({
        scale,
        offsetX: mapped.half === 'right' ? -base.width * scale / 2 : 0
    });
    canvas.width = widthPx;
    canvas.height = heightPx;
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';

    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    await page.render({

        canvasContext:
            ctx,

        viewport:
            viewport

    }).promise;

}


/* =========================================================
   BLANK PAGE
========================================================= */

function clearCanvas(
    canvas
) {

    const dpr =
        Math.min(

            window.devicePixelRatio || 1,

            2

        );


    canvas.width =
        Math.round(

            displayWidth *
            dpr

        );


    canvas.height =
        Math.round(

            displayHeight *
            dpr

        );


    canvas.style.width =
        displayWidth + "px";


    canvas.style.height =
        displayHeight + "px";


    const ctx =
        canvas.getContext(

            "2d",

            {
                alpha: false
            }

        );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

}

========================================================= */

function updatePageControl() {

    pageTotal.textContent =
        `/ ${totalPages}`;


    if (
        mode === "front"

        pageLabel.textContent =
            "Page";


        pageInput.value =
            1;


        return;

    }


    if (
        mode === "back"
    ) {

        pageLabel.textContent =
            "Back";


        pageInput.value =
            totalPages;


        return;

    }


    if (
        mode === "thanks"
    ) {

        pageLabel.textContent =

        pageInput.value =

        return;

    }


    pageLabel.textContent =
        "Page";


    pageInput.value =
        leftPageNumber;

}


/* =========================================================
   LAST SPREAD
========================================================= */

function getLastLeftPage() {

    let result;


    if (
        totalPages % 2 === 1
    ) {

        result =
            totalPages - 1;

    }

    else {

        result =
            totalPages;

    }


    if (
        result % 2 !== 0
    ) {

        result--;

    }


    return Math.max(

        2,

        result

    );

}


/* =========================================================
   RENDER SPREAD
========================================================= */

async function renderSpread(
    requestedLeft
) {

    requestedLeft =
        Math.max(

            2,

            requestedLeft

        );


    if (
        requestedLeft % 2 !== 0
    ) {

        requestedLeft--;

    }


    leftPageNumber =
        requestedLeft;


    await Promise.all([


        renderPage(

            leftPageNumber,

            leftCanvas

        ),


        renderPage(

            leftPageNumber + 1,

            rightCanvas

        )


    ]);


    updatePageControl();

}

/* =========================================================
   NEXT
========================================================= */

async function goNext() {

    if (
        isAnimating
    ) {

        return;

    }


    if (
        mode === "front"
    ) {

        await openFromFront();

        return;

    }


    if (
        mode === "back" ||
        mode === "thanks"
    ) {

        return;

    }


    const currentLeft =
        leftPageNumber;


    const currentRight =
        currentLeft + 1;


    const nextLeft =
        currentLeft + 2;


    const nextRight =
        currentLeft + 3;


    /*
       End of catalogue
    */

    if (
        nextLeft > totalPages
    ) {

        await closeToBack();

        return;

    }


    isAnimating =
        true;


    prevButton.disabled =
        true;


    nextButton.disabled =
        true;


    /*
       Moving page front:
       current right page.
    */

    await renderPage(

        currentRight,

        flipFrontCanvas

    );


    /*
       Moving page back:
       next left page.
    */

    await renderPage(

        nextLeft,

        flipBackCanvas

    );


    /*
       New right page underneath.
    */

    await renderPage(

        nextRight,

        rightCanvas

    );


    flipSheet.style.display =
        "block";


    flipSheet.classList.remove(
        "flip-next"
    );


    void flipSheet.offsetWidth;


    flipSheet.classList.add(
        "flip-next"
    );


    /*
       Change underlying left page
       slightly before halfway.
    */

    setTimeout(

        () => {

            renderPage(

                nextLeft,

                leftCanvas

            );

        },

        TURN_TIME * .48

    );


    await wait(
        TURN_TIME
    );


    leftPageNumber =
        nextLeft;


    resetFlip();


    updatePageControl();


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;


    isAnimating =
        false;

}

/* =========================================================
   GO DIRECTLY TO PAGE
========================================================= */

async function goToPage(
    pageNumber
) {

    if (

        isAnimating ||

        !pdf ||

        mode === "thanks"

    ) {

        return;

    }


    pageNumber =
        parseInt(
            pageNumber,
            10
        );


    if (
        isNaN(pageNumber)
    ) {

        updatePageControl();

        return;

    }


    pageNumber =
        Math.max(

            1,

            Math.min(

                totalPages,

                pageNumber

            )

        );


    /*
       PAGE 1 = FRONT COVER
    */

    if (
        pageNumber === 1
    ) {

        await showFront();

        return;

    }


    /*
       Convert selected page to spread.

       2 -> 2 / 3
       3 -> 2 / 3
       4 -> 4 / 5
       5 -> 4 / 5
    */

    let spreadLeft =
        pageNumber;


    if (
        spreadLeft % 2 !== 0
    ) {

        spreadLeft--;

    }


    mode =
        "open";


    closedBook.style.display =
        "none";


    openBook.style.display =
        "block";


    await renderSpread(
        spreadLeft
    );


    prevButton.disabled =
        false;


    nextButton.disabled =
        false;

}

/* =========================================================
   START
========================================================= */

async function start() {

    try {


        // Check the actual HTTP response before passing the file to PDF.js.
        const response = await fetch(PDF_FILE, { cache: "no-store" });
        if (!response.ok) {
            throw new Error(`PDF request failed: HTTP ${response.status} ${response.statusText}. URL: ${new URL(PDF_FILE, location.href).href}`);
        }
        const pdfBytes = new Uint8Array(await response.arrayBuffer());
        if (pdfBytes.length < 5 || String.fromCharCode(...pdfBytes.slice(0, 5)) !== "%PDF-") {
            throw new Error(`The URL returned a non-PDF response (${response.headers.get("content-type") || "unknown type"}). Check GitHub Pages deployment and the PDF path.`);
        }
        pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;


        totalPages =
            (pdf.numPages - 2) * 2 + 2;


        pageInput.max =
            totalPages;


        pageTotal.textContent =
            `/ ${totalPages}`;


        await getPdfRatio();


        calculateSize();


        /*
           Render the front cover BEFORE
           removing the intro.
        */

        await showFront();


        /*
           Small pause so the intro feels intentional.
        */

        await wait(
            350
        );


        loading.classList.add(
            "hide"
        );


        setTimeout(

            () => {

                loading.style.display =
                    "none";

            },

            600

        );


    }

    catch(error) {


        console.error(
            error
        );


        loading.innerHTML = "";
        const panel = document.createElement("div");
        panel.style.cssText = "max-width:650px;padding:24px;text-align:center;color:#ddd;font-size:14px;line-height:1.7";
        const heading = document.createElement("strong");
        heading.style.cssText = "font-size:22px;color:#fff";
        heading.textContent = "INTERSPORT";
        const message = document.createElement("p");
        message.textContent = "Could not load Adidas catalogue: " + (error?.message || String(error));
        const link = document.createElement("a");
        link.href = PDF_FILE;
        link.textContent = "Open PDF directly to test";
        link.target = "_blank";
        link.rel = "noopener";
        link.style.cssText = "color:#fff;text-decoration:underline";
        panel.append(heading, message, link);
        loading.append(panel);

    }

}



/* Zoom viewer: render each PDF source to an isolated canvas, then crop its half. */
const detailOverlay = document.getElementById('detailOverlay');
const detailCanvas = document.getElementById('detailCanvas');
const detailScroll = document.getElementById('detailScroll');
let detailPage = 1;
let detailZoom = 0.4;
let detailRenderSerial = 0;
let detailRenderTask = null;
let detailRenderPromise = Promise.resolve();

function renderDetail() {
    const serial = ++detailRenderSerial;
    if (detailRenderTask) { try { detailRenderTask.cancel(); } catch (_) {} }
    // Serializing renders prevents two PDF.js tasks from painting the same canvas.
    detailRenderPromise = detailRenderPromise.catch(()=>{}).then(async () => {
        if (!pdf || detailOverlay.style.display !== 'flex' || serial !== detailRenderSerial) return;
        document.getElementById('detailZoomLabel').textContent = Math.round(detailZoom * 100) + '%';
        if (detailZoom === 0) {
            detailCanvas.style.display = 'none';
            document.getElementById('detailCounter').textContent = detailPage + ' / ' + totalPages;
            return;
        }
        detailCanvas.style.display = 'block';
        const mapped = virtualPage(detailPage);
        const page = await pdf.getPage(mapped.source);
        if (serial !== detailRenderSerial) return;
        const base = page.getViewport({scale:1});
        const fraction = mapped.half ? .5 : 1;
        const pageRatio = (base.width * fraction) / base.height;
        const available = Math.max(240, detailScroll.clientWidth - 44);
        const cssWidth = Math.max(1, Math.round(available * detailZoom));
        const cssHeight = Math.round(cssWidth / pageRatio);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        // Avoid enormous PDF canvas allocations, particularly on high-DPI screens.
        const rasterScale = Math.min(dpr, 4096 / Math.max(cssWidth / fraction, cssHeight));
        const outputWidth = Math.max(1, Math.round(cssWidth * rasterScale));
        const outputHeight = Math.max(1, Math.round(cssHeight * rasterScale));
        const sourceCanvas = document.createElement('canvas');
        sourceCanvas.width = mapped.half ? outputWidth * 2 : outputWidth;
        sourceCanvas.height = outputHeight;
        const viewport = page.getViewport({scale: sourceCanvas.width / base.width});
        const ctx = sourceCanvas.getContext('2d', {alpha:false});
        detailRenderTask = page.render({canvasContext:ctx, viewport});
        try { await detailRenderTask.promise; }
        catch (e) { if (e.name !== 'RenderingCancelledException') console.error('Zoom render:', e); return; }
        finally { detailRenderTask = null; }
        if (serial !== detailRenderSerial || detailOverlay.style.display !== 'flex') return;
        detailCanvas.width = outputWidth;
        detailCanvas.height = outputHeight;
        detailCanvas.style.width = cssWidth + 'px';
        detailCanvas.style.height = cssHeight + 'px';
        const target = detailCanvas.getContext('2d', {alpha:false});
        const x = mapped.half === 'right' ? outputWidth : 0;
        target.drawImage(sourceCanvas, x, 0, outputWidth, outputHeight, 0, 0, outputWidth, outputHeight);
        document.getElementById('detailCounter').textContent = detailPage + ' / ' + totalPages;
        document.getElementById('detailZoomLabel').textContent = Math.round(detailZoom * 100) + '%';
    });
    return detailRenderPromise;
}
function openDetail(n) {
    if (!pdf || isAnimating) return;
    detailPage = Math.max(1,Math.min(totalPages,n));
    detailZoom = 0.4;
    detailOverlay.style.display = 'flex';
    detailScroll.scrollTop = 0;
    renderDetail();
}
function closeDetail() {
    detailOverlay.style.display = 'none';
    ++detailRenderSerial;
    if (detailRenderTask) detailRenderTask.cancel();
}
document.getElementById('zoomOpen').addEventListener('click',()=>openDetail(mode === 'front' ? 1 : mode === 'back' ? totalPages : leftPageNumber));
leftPage.addEventListener('click',()=>{if(mode === 'open') openDetail(leftPageNumber)});
rightPage.addEventListener('click',()=>{if(mode === 'open') openDetail(leftPageNumber+1)});
document.getElementById('detailClose').addEventListener('click',closeDetail);
document.getElementById('detailPrev').addEventListener('click',()=>{if(detailPage>1){detailPage--;detailScroll.scrollTop=0;renderDetail()}});
document.getElementById('detailNext').addEventListener('click',()=>{if(detailPage<totalPages){detailPage++;detailScroll.scrollTop=0;renderDetail()}});
document.getElementById('detailMinus').addEventListener('click',()=>{detailZoom=Math.max(0,Math.round((detailZoom-.1)*10)/10);renderDetail()});
document.getElementById('detailPlus').addEventListener('click',()=>{detailZoom=Math.min(1.2,Math.round((detailZoom+.1)*10)/10);renderDetail()});
document.addEventListener('keydown',e=>{if(detailOverlay.style.display !== 'flex')return; if(['Escape','ArrowLeft','ArrowRight'].includes(e.key)){e.stopImmediatePropagation();e.preventDefault(); if(e.key==='Escape')closeDetail(); else document.getElementById(e.key==='ArrowLeft'?'detailPrev':'detailNext').click();}},true);

start();

</script>
