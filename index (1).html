<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>Detection of Traffic Violations and Congestion Using Deep Learning</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
:root{--bg:#151515;--panel:#202020;--line:#333;--text:#eee;--muted:#aaa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
body{user-select:none}
#app{height:100%;display:flex;flex-direction:column}
header{
  height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:#101010;border-bottom:1px solid #2b2b2b;z-index:20
}
.title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px}
button{
  width:38px;height:38px;border:1px solid #3b3b3b;border-radius:7px;
  background:#272727;color:#fff;font-size:20px;cursor:pointer
}
button:hover{background:#353535}
#stage{
  position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:
  radial-gradient(ellipse at center, #292929 0%, #1b1b1b 55%, #121212 100%);
}
#book{visibility:hidden; width:100%; height:100%; display:flex; align-items:center; justify-content:center}
.page{
  background:#fff;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
}
.page canvas{display:block;width:100%;height:100%;object-fit:fill}
.page.--left{border-radius:4px 0 0 4px}
.page.--right{border-radius:0 4px 4px 0}
.page-cover{background:#fff}
.loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:#ddd;z-index:10
}
.spinner{width:36px;height:36px;border:3px solid #444;border-top-color:#eee;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{
  height:58px;min-height:58px;display:flex;align-items:center;justify-content:center;gap:18px;
  background:#101010;border-top:1px solid #2b2b2b;z-index:20
}
.nav button{font-size:25px}
#counter{min-width:100px;text-align:center;font-size:14px;color:#ddd}
.hint{font-size:12px;color:#888}
.edge{
  position:absolute;top:0;bottom:0;width:13%;z-index:8;cursor:pointer;
}
#leftEdge{left:0}
#rightEdge{right:0}
.edge:hover::after{
  content:"";position:absolute;top:50%;transform:translateY(-50%);
  width:42px;height:70px;background:rgba(255,255,255,.08)
}
#leftEdge:hover::after{left:0;border-radius:0 35px 35px 0}
#rightEdge:hover::after{right:0;border-radius:35px 0 0 35px}
@media(max-width:700px){
  header{height:50px;min-height:50px;padding:0 10px}
  .title{font-size:12px;max-width:65vw}
  .nav{height:54px;min-height:54px;gap:12px}
  .hint{display:none}
  button{width:36px;height:36px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">Detection of Traffic Violations and Congestion Using Deep Learning</div>
  <div class="actions">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="fullscreen" title="Fullscreen">⛶</button>
  </div>
</header>

<div id="stage">
  <div class="loading" id="loading"><div class="spinner"></div><div>Preparing catalogue…</div></div>
  <div id="book"></div>
  <div id="leftEdge" class="edge" title="Previous page"></div>
  <div id="rightEdge" class="edge" title="Next page"></div>
</div>

<div class="nav">
  <button id="prev" title="Previous">‹</button>
  <div id="counter">Page 1 / 13</div>
  <button id="next" title="Next">›</button>
  <div class="hint">Drag a page corner to turn the page</div>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_URL = "catalogue.pdf";
const bookEl = document.getElementById("book");
const stage = document.getElementById("stage");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");

let pdfDoc, pageFlip;
let baseW = 595, baseH = 842;
let zoom = 1;

async function renderPDF(){
  pdfDoc = await pdfjsLib.getDocument({url:PDF_URL}).promise;
  const first = await pdfDoc.getPage(1);
  const firstVp = first.getViewport({scale:1});
  baseW = firstVp.width;
  baseH = firstVp.height;

  // Render at enough resolution to stay sharp while flipping.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const renderScale = Math.max(1.55, dpr * 1.15);

  for(let i=1;i<=pdfDoc.numPages;i++){
    const p = await pdfDoc.getPage(i);
    const vp = p.getViewport({scale:renderScale});

    const page = document.createElement("div");
    page.className = "page" + ((i===1 || i===pdfDoc.numPages) ? " page-cover" : "");
    page.dataset.density = (i===1 || i===pdfDoc.numPages) ? "hard" : "soft";

    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    page.appendChild(canvas);
    bookEl.appendChild(page);

    await p.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
  }
}

function fitSize(){
  const rect = stage.getBoundingClientRect();
  const mobile = rect.width < 720;
  const availableW = rect.width * (mobile ? .90 : .86);
  const availableH = rect.height * .91;
  const pagesAcross = mobile ? 1 : 2;
  const scale = Math.min(availableW/(baseW*pagesAcross), availableH/baseH) * zoom;
  return {
    w: Math.max(220, Math.round(baseW*scale)),
    h: Math.max(310, Math.round(baseH*scale)),
    mobile
  };
}

function initFlip(){
  const s = fitSize();
  pageFlip = new St.PageFlip(bookEl,{
    width:s.w,
    height:s.h,
    size:"fixed",
    minWidth:220,
    maxWidth:1600,
    minHeight:310,
    maxHeight:2200,
    showCover:true,
    usePortrait:false,
    mobileScrollSupport:false,
    drawShadow:true,
    maxShadowOpacity:0.55,
    flippingTime:850,
    useMouseEvents:true,
    swipeDistance:18,
    clickEventForward:true,
    disableFlipByClick:false,
    startZIndex:0,
    autoSize:false
  });

  pageFlip.loadFromHTML(document.querySelectorAll(".page"));
  pageFlip.on("flip", e => updateCounter(e.data));
  pageFlip.on("changeOrientation", () => updateCounter(pageFlip.getCurrentPageIndex()));
  updateCounter(0);
  bookEl.style.visibility="visible";
  loading.style.display="none";
}

function updateCounter(index){
  const page = Math.min((index ?? 0)+1, pdfDoc.numPages);
  counter.textContent = `Page ${page} / ${pdfDoc.numPages}`;
}

function rebuild(){
  if(!pageFlip) return;
  const current = pageFlip.getCurrentPageIndex();
  pageFlip.destroy();
  pageFlip = null;
  initFlip();
  try{ pageFlip.turnToPage(current); }catch(e){}
}

document.getElementById("prev").onclick=()=>pageFlip?.flipPrev("top");
document.getElementById("next").onclick=()=>pageFlip?.flipNext("top");
document.getElementById("leftEdge").onclick=()=>pageFlip?.flipPrev("top");
document.getElementById("rightEdge").onclick=()=>pageFlip?.flipNext("top");

document.getElementById("zoomIn").onclick=()=>{
  zoom=Math.min(1.45,zoom+.10); rebuild();
};
document.getElementById("zoomOut").onclick=()=>{
  zoom=Math.max(.70,zoom-.10); rebuild();
};
document.getElementById("fullscreen").onclick=async()=>{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
};

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") pageFlip?.flipNext("top");
  if(e.key==="ArrowLeft") pageFlip?.flipPrev("top");
});

let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(rebuild,250);
});

(async()=>{
  try{
    await renderPDF();
    initFlip();
  }catch(err){
    console.error(err);
    loading.innerHTML="<div>Could not load the catalogue. Make sure <b>catalogue.pdf</b> is in the same GitHub folder as this file.</div>";
  }
})();
</script>
</body>
</html>
